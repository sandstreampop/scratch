<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUST VIPER — Operation Kilo Outpost</title>
<style>
  :root {
    --hud-white: rgba(240, 244, 248, 0.92);
    --hud-dim: rgba(240, 244, 248, 0.55);
    --hud-amber: #ffb454;
    --hud-red: #ff3b30;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; user-select: none; cursor: default; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hidden { display: none !important; }

  /* Crosshair */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair .line { position: absolute; background: var(--hud-white); box-shadow: 0 0 2px rgba(0,0,0,0.9); }
  #crosshair .t { width: 2px; height: 7px; left: -1px; }
  #crosshair .b { width: 2px; height: 7px; left: -1px; }
  #crosshair .l { width: 7px; height: 2px; top: -1px; }
  #crosshair .r { width: 7px; height: 2px; top: -1px; }
  #crosshair .dot { position: absolute; width: 2px; height: 2px; left: -1px; top: -1px; background: var(--hud-white); }

  /* Hitmarker */
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
  #hitmarker .hm { position: absolute; width: 2px; height: 9px; background: var(--hud-white); box-shadow: 0 0 3px rgba(0,0,0,0.8); }
  #hitmarker.kill .hm { background: var(--hud-red); }
  #hitmarker .h1 { transform: translate(-7px,-13px) rotate(45deg); }
  #hitmarker .h2 { transform: translate(5px,-13px) rotate(-45deg); }
  #hitmarker .h3 { transform: translate(-7px,4px) rotate(-45deg); }
  #hitmarker .h4 { transform: translate(5px,4px) rotate(45deg); }

  /* Ammo block */
  #ammo { position: absolute; right: 42px; bottom: 34px; text-align: right; color: var(--hud-white); text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  #ammo .weapon { font-size: 13px; letter-spacing: 3px; color: var(--hud-dim); font-weight: 600; }
  #ammo .counts { font-variant-numeric: tabular-nums; }
  #ammo .mag { font-size: 42px; font-weight: 700; letter-spacing: 1px; }
  #ammo .reserve { font-size: 20px; color: var(--hud-dim); font-weight: 600; }
  #ammo .firemode { font-size: 11px; letter-spacing: 2px; color: var(--hud-dim); }

  /* Compass */
  #compass { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); width: 460px; height: 34px; overflow: hidden;
             -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
             mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  #compass canvas { width: 100%; height: 100%; }

  /* Kill feed */
  #killfeed { position: absolute; top: 90px; right: 36px; text-align: right; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
  #killfeed .entry { color: var(--hud-white); text-shadow: 0 1px 2px rgba(0,0,0,0.9); margin-bottom: 5px; opacity: 0.95; }
  #killfeed .entry .you { color: var(--hud-amber); }

  /* Score */
  #score { position: absolute; left: 42px; bottom: 34px; color: var(--hud-white); text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  #score .label { font-size: 11px; letter-spacing: 3px; color: var(--hud-dim); font-weight: 600; }
  #score .value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Damage vignette */
  #damage { position: absolute; inset: 0; opacity: 0;
            background: radial-gradient(ellipse at center, transparent 42%, rgba(160,10,5,0.55) 100%); }

  /* Objective */
  #objective { position: absolute; top: 78px; left: 50%; transform: translateX(-50%); color: var(--hud-white);
               font-size: 12px; letter-spacing: 2px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.9); opacity: 0.85; }

  /* Title card */
  #title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
           padding: 0 0 12vh 8vw; opacity: 0; transition: opacity 1.2s ease; background: none; }
  #title .op { font-size: 14px; letter-spacing: 8px; color: var(--hud-amber); font-weight: 700; }
  #title .name { font-size: 54px; letter-spacing: 4px; color: var(--hud-white); font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,0.7); }
  #title .sub { font-size: 13px; letter-spacing: 3px; color: var(--hud-dim); font-weight: 600; margin-top: 6px; }

  /* Start overlay */
  #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: rgba(4, 6, 8, 0.82); color: var(--hud-white); cursor: pointer; }
  #start h1 { font-size: 46px; letter-spacing: 10px; font-weight: 800; }
  #start p { margin-top: 14px; font-size: 14px; letter-spacing: 2px; color: var(--hud-dim); }
  #start .keys { margin-top: 26px; font-size: 12px; letter-spacing: 1px; color: var(--hud-dim); line-height: 1.9; text-align: center; }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="compass"><canvas width="920" height="68"></canvas></div>
  <div id="objective">◆ ELIMINATE HOSTILE FORCES — KILO OUTPOST</div>
  <div id="crosshair">
    <div class="line t"></div><div class="line b"></div>
    <div class="line l"></div><div class="line r"></div>
    <div class="dot"></div>
  </div>
  <div id="hitmarker"><div class="hm h1"></div><div class="hm h2"></div><div class="hm h3"></div><div class="hm h4"></div></div>
  <div id="killfeed"></div>
  <div id="ammo">
    <div class="weapon">M4A1 · MK.2 CARBINE</div>
    <div class="counts"><span class="mag">30</span> <span class="reserve">| 120</span></div>
    <div class="firemode">AUTO</div>
  </div>
  <div id="score"><div class="label">ELIMINATIONS</div><div class="value">0</div></div>
  <div id="damage"></div>
  <div id="title"><div class="op">OPERATION</div><div class="name">DUST VIPER</div><div class="sub">KILO OUTPOST · 0547 HRS</div></div>
</div>

<div id="start">
  <h1>DUST VIPER</h1>
  <p>CLICK TO DEPLOY</p>
  <div class="keys">WASD — MOVE &nbsp;·&nbsp; SHIFT — SPRINT &nbsp;·&nbsp; MOUSE — AIM<br>
    LMB — FIRE &nbsp;·&nbsp; RMB — ADS &nbsp;·&nbsp; R — RELOAD &nbsp;·&nbsp; SPACE — JUMP &nbsp;·&nbsp; C — CROUCH</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
