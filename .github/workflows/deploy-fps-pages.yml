name: deploy-fps-pages

on:
  push:
    branches: [ "main", "claude/aaa-fps-threejs-j24dtg" ]
    paths:
      - 'fps/**'
      - '.github/workflows/deploy-fps-pages.yml'
  workflow_dispatch:

# Allow one deploy at a time; cancel superseded runs rather than queueing them.
concurrency:
  group: fps-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        working-directory: fps
        run: npm install --no-save esbuild playwright-core

      - name: Build
        working-directory: fps
        run: node build.mjs

      # The runner has network access, so this is the one place a real WebKit
      # can be obtained. It is not iOS Safari, but it is the same engine family
      # and it catches the JavaScriptCore and WebKit-WebGL differences that
      # Chromium silently tolerates.
      - name: Install browser engines
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit chromium

      # Two engines against the profile that actually ships. WebKit is the
      # closest available stand-in for iOS Safari and is only obtainable on the
      # runner; it is what caught the readPixels type bug that Chromium
      # tolerated silently.
      - name: Smoke test (WebKit, iPhone viewport)
        working-directory: fps
        run: xvfb-run -a node tools/verify.mjs --dist --engine=webkit

      - name: Smoke test (Chromium, iPhone viewport)
        working-directory: fps
        run: xvfb-run -a node tools/verify.mjs --dist --engine=chromium

      # The black-scene defect depended on which WebGL extensions the device
      # withholds, not on the device. Withholding them here reproduces the
      # condition without an iPhone; with the old float-texture path this run
      # comes back at half the scene brightness.
      - name: Smoke test (iOS capability profile)
        working-directory: fps
        run: xvfb-run -a node tools/verify.mjs --dist --engine=webkit --emulate=ios

      # Keyboard and mouse coverage. Advisory: the desktop profile is heavier,
      # the runner has no GPU, and this consistently needs minutes there while
      # the same check finishes in seconds on a machine with one. A timeout
      # here says nothing about the build and must not block a deploy.
      - name: Smoke test (Chromium, desktop, advisory)
        continue-on-error: true
        timeout-minutes: 6
        working-directory: fps
        run: xvfb-run -a node tools/verify.mjs --dist --engine=chromium --desktop

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: fps/shots/verify/
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fps/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Proves the artifact users actually load is playable, not merely that a
  # local build was. Runs against the live URL after the deployment lands.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        working-directory: fps
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Playability check against the deployed site
        working-directory: fps
        run: |
          xvfb-run -a node tools/verify.mjs \
            --engine=webkit --url='${{ needs.deploy.outputs.page_url }}'

      - name: Upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-live-screenshots
          path: fps/shots/verify/
          if-no-files-found: warn
