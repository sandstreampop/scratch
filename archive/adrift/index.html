<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>ADRIFT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none;
    overscroll-behavior:none; position:fixed; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lbl { position:absolute; color:rgba(160,175,195,.55); font:400 10px/1.4 -apple-system,'Helvetica Neue',monospace,sans-serif;
    letter-spacing:.12em; text-transform:lowercase; white-space:nowrap; transform:translate(-50%,-50%);
    text-shadow:0 0 6px #000; transition:opacity .4s; }
  .lbl::before { content:''; display:block; width:3px; height:3px; border:1px solid rgba(160,175,195,.4);
    transform:rotate(45deg); margin:0 auto 6px; }
  #hud { position:absolute; inset:0; pointer-events:none; color:rgba(190,200,215,.75);
    font:300 12px/1.5 -apple-system,'Helvetica Neue',sans-serif; letter-spacing:.1em; }
  #speed { position:absolute; top:calc(14px + env(safe-area-inset-top)); left:calc(16px + env(safe-area-inset-left)); }
  #speed .c { color:rgba(255,190,150,.85); }
  #near  { position:absolute; top:calc(14px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right)); text-align:right; }
  #whisper { position:absolute; bottom:22%; left:0; right:0; text-align:center; padding:0 12%;
    color:rgba(200,205,220,.0); font:300 14px/1.9 Georgia,'Times New Roman',serif; letter-spacing:.16em;
    font-style:italic; transition:color 2.5s ease; text-shadow:0 0 12px #000; }
  #whisper.on { color:rgba(200,205,220,.85); }
  #stick { position:absolute; width:110px; height:110px; border:1px solid rgba(170,180,200,.18);
    border-radius:50%; display:none; pointer-events:none; }
  #knob { position:absolute; width:44px; height:44px; left:33px; top:33px; border-radius:50%;
    background:rgba(170,180,200,.14); border:1px solid rgba(170,180,200,.3); }
  .btn { position:absolute; right:calc(18px + env(safe-area-inset-right)); width:76px; height:76px;
    border-radius:50%; border:1px solid rgba(170,180,200,.25); color:rgba(190,200,215,.6);
    font:300 10px/76px -apple-system,sans-serif; text-align:center; letter-spacing:.2em;
    user-select:none; -webkit-user-select:none; display:none; }
  .btn.held { background:rgba(255,190,150,.1); border-color:rgba(255,190,150,.5); color:rgba(255,190,150,.9); }
  #boost { bottom:calc(96px + env(safe-area-inset-bottom)); }
  #brake { bottom:calc(20px + env(safe-area-inset-bottom)); width:60px; height:60px; line-height:60px; right:calc(26px + env(safe-area-inset-right)); }
  #scream { bottom:calc(186px + env(safe-area-inset-bottom)); width:56px; height:56px; line-height:56px;
    right:calc(28px + env(safe-area-inset-right)); font-size:8px; opacity:.7; }
  @media (max-height: 480px) {   /* landscape phones: keep whispers off the thumb controls */
    #whisper { bottom:10%; padding:0 22%; font-size:12px; }
  }
  #start { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, #05060a 0%, #000 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10;
    color:#cdd3e0; font:300 13px/2 -apple-system,'Helvetica Neue',sans-serif; letter-spacing:.14em;
    text-align:center; padding:0 8%; transition:opacity 2s ease; }
  #start.gone { opacity:0; pointer-events:none; }
  #start h1 { font-weight:100; font-size:34px; letter-spacing:.85em; text-indent:.85em; margin-bottom:14px; color:#e8ecf4; }
  #start .sub { font-style:italic; font-family:Georgia,serif; color:rgba(190,200,220,.55); margin-bottom:52px; }
  #start .hint { font-size:10px; color:rgba(160,170,190,.45); line-height:2.2; }
  #begin { margin-top:56px; padding:14px 44px; border:1px solid rgba(190,200,220,.3); border-radius:2px;
    cursor:pointer; color:rgba(220,228,240,.9); font-size:11px; letter-spacing:.4em; text-indent:.4em; }
  #begin:active { background:rgba(190,200,220,.08); }
  #err { position:absolute; inset:0; display:none; z-index:20; background:#000; color:#889;
    font:300 13px/1.8 -apple-system,sans-serif; padding:20%; text-align:center; letter-spacing:.1em; }
  #death { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:5;
    display:flex; align-items:center; justify-content:center; transition:opacity 2.2s ease; }
  #death.on { opacity:1; }
  #epitaph { color:rgba(205,210,225,.0); font:300 15px/2.1 Georgia,serif; font-style:italic;
    letter-spacing:.18em; text-align:center; padding:0 10%; transition:color 3s ease; }
  #death.on #epitaph { color:rgba(205,210,225,.8); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="hud">
  <div id="speed"></div>
  <div id="near"></div>
  <div id="whisper"></div>
</div>
<div id="stick"><div id="knob"></div></div>
<div id="boost" class="btn">THRUST</div>
<div id="brake" class="btn">HALT</div>
<div id="scream" class="btn">SCREAM</div>
<div id="death"><div id="epitaph"></div></div>
<div id="start">
  <h1>ADRIFT</h1>
  <div class="sub">a first-person account of your own insignificance</div>
  <div class="hint" id="hintTouch">right of screen — look &nbsp;·&nbsp; left of screen — drift<br>hold THRUST to burn &nbsp;·&nbsp; HALT to stop</div>
  <div class="hint" id="hintKeys">mouse — look &nbsp;·&nbsp; W A S D — drift &nbsp;·&nbsp; SHIFT — burn &nbsp;·&nbsp; X — stop &nbsp;·&nbsp; V — scream</div>
  <div id="begin">WAKE</div>
</div>
<div id="err"></div>
<script>
'use strict';
// ============================================================ ADRIFT
// units: kilometres, seconds. c = 299792.458 km/s.
// rendering is camera-relative (float64 world coords in JS,
// float32 offsets on GPU) with logarithmic depth.
const C_KM = 299792.458;
const FAR = 8e8, NEAR = 2.0;
const LOGF = 2.0 / Math.log2(FAR + 1.0);

const $ = id => document.getElementById(id);
const canvas = $('gl');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false,
  powerPreference:'high-performance' });
const METRICS = window.__metrics = { fps:0, ms:0, scale:1, draws:0, errors:[] };
window.onerror = (m,s,l) => { METRICS.errors.push(m + ' @' + l); };
if (!gl) { $('err').style.display='flex'; $('err').textContent =
  'this vessel requires WebGL2. the void will wait.'; throw new Error('no webgl2'); }

// ---------------------------------------------------------- gl helpers
function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s) + '\n' + src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, '#version 300 es\nprecision highp float;\n' + vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, '#version 300 es\nprecision highp float;\n' + fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const inf = gl.getActiveUniform(p,i); u[inf.name.replace('[0]','')] = gl.getUniformLocation(p, inf.name); }
  return { p, u };
}
const NOISE = `
float hash13(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float vnoise(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),
                 mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),
                 mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
float fbm3(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<3;i++){ s+=a*vnoise(p); p*=2.11; a*=0.5; } return s; }
`;
const LOGDEPTH = `gl_Position.z = (log2(max(1e-6, gl_Position.w + 1.0)) * uLogF - 1.0) * gl_Position.w;`;

// ---------------------------------------------------------- geometry
function makeSphere(lat, lon) {
  const pos=[], idx=[];
  for (let y=0;y<=lat;y++){ const v=y/lat, ph=v*Math.PI;
    for (let x=0;x<=lon;x++){ const u=x/lon, th=u*Math.PI*2;
      pos.push(Math.sin(ph)*Math.cos(th), Math.cos(ph), Math.sin(ph)*Math.sin(th)); } }
  for (let y=0;y<lat;y++) for (let x=0;x<lon;x++){
    const a=y*(lon+1)+x, b=a+lon+1;
    idx.push(a,b,a+1, b,b+1,a+1); }
  return { pos:new Float32Array(pos), idx:new Uint16Array(idx) };
}
function makeRing(seg) { // annulus in xz, r 1..2, vertex.x carries radial t
  const pos=[], idx=[];
  for (let i=0;i<=seg;i++){ const th=i/seg*Math.PI*2, c=Math.cos(th), s=Math.sin(th);
    pos.push(c,0,s, c*2,0,s*2); }
  for (let i=0;i<seg;i++){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  return { pos:new Float32Array(pos), idx:new Uint16Array(idx) };
}
function vao(geo) {
  const v = gl.createVertexArray(); gl.bindVertexArray(v);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, geo.pos, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  const e = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, e);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, geo.idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { v, n: geo.idx.length };
}
const sphereHi = vao(makeSphere(40, 64));
const sphereLo = vao(makeSphere(20, 32));
const ringGeo  = vao(makeRing(128));
const quadVao = gl.createVertexArray(); gl.bindVertexArray(quadVao);
const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindVertexArray(null);

// stars: points on unit sphere, weighted toward a galactic band
const N_STARS = 22000;
const starBuf = new Float32Array(N_STARS*5);
{
  const gN = [0.31, 0.87, 0.38]; const gl0 = Math.hypot(...gN); gN[0]/=gl0; gN[1]/=gl0; gN[2]/=gl0;
  let i=0, put=0;
  while (put < N_STARS) {
    let x=Math.random()*2-1, y=Math.random()*2-1, z=Math.random()*2-1;
    const l=Math.hypot(x,y,z); if (l<0.1||l>1) continue;
    x/=l; y/=l; z/=l;
    const band = Math.abs(x*gN[0]+y*gN[1]+z*gN[2]);
    // keep with probability higher near the band
    if (Math.random() > 0.25 + 0.75*Math.exp(-band*band*9.0)) continue;
    const o = put*5;
    starBuf[o]=x; starBuf[o+1]=y; starBuf[o+2]=z;
    const m = Math.pow(Math.random(), 3.2);            // magnitude, few bright
    starBuf[o+3] = m;
    starBuf[o+4] = Math.random();                       // temperature
    put++;
  }
}
const starVao = gl.createVertexArray(); gl.bindVertexArray(starVao);
const sb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, sb);
gl.bufferData(gl.ARRAY_BUFFER, starBuf, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,20,12);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,1,gl.FLOAT,false,20,16);
gl.bindVertexArray(null);

// warp streak lines: two vertices per star (end flag 0/1) for a subset
const N_STREAK = 5000;
const streakBuf = new Float32Array(N_STREAK*2*6);
for (let i=0;i<N_STREAK;i++) {
  const s = i*5;
  for (let e=0;e<2;e++) {
    const o = (i*2+e)*6;
    streakBuf[o]=starBuf[s]; streakBuf[o+1]=starBuf[s+1]; streakBuf[o+2]=starBuf[s+2];
    streakBuf[o+3]=starBuf[s+3]; streakBuf[o+4]=starBuf[s+4]; streakBuf[o+5]=e;
  }
}
const streakVao = gl.createVertexArray(); gl.bindVertexArray(streakVao);
const stb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, stb);
gl.bufferData(gl.ARRAY_BUFFER, streakBuf, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,24,0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,24,12);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,1,gl.FLOAT,false,24,16);
gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,1,gl.FLOAT,false,24,20);
gl.bindVertexArray(null);

// asteroid belt: a torus of drifting rubble between halcyon and tyrant
const N_BELT = 3500, BELT_R = 1.06e7, BELT_SPREAD = 9e5, BELT_H = 1.6e5;
const beltBuf = new Float32Array(N_BELT*5);
for (let i=0;i<N_BELT;i++) {
  const th = Math.random()*Math.PI*2;
  const rr = BELT_R + (Math.random()+Math.random()+Math.random()-1.5)/1.5*BELT_SPREAD;
  const o = i*5;
  beltBuf[o]   = Math.cos(th)*rr;
  beltBuf[o+1] = (Math.random()*2-1)*BELT_H;
  beltBuf[o+2] = Math.sin(th)*rr;
  beltBuf[o+3] = 6 + Math.pow(Math.random(),2.5)*70;   // rock radius, km
  beltBuf[o+4] = Math.random();
}
const beltVao = gl.createVertexArray(); gl.bindVertexArray(beltVao);
const bb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bb);
gl.bufferData(gl.ARRAY_BUFFER, beltBuf, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,20,12);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,1,gl.FLOAT,false,20,16);
gl.bindVertexArray(null);

// ---------------------------------------------------------- shaders
const VS_BODY = `
layout(location=0) in vec3 aPos;
uniform mat4 uProj; uniform mat3 uView;
uniform vec3 uRel; uniform float uRadius; uniform float uLogF;
out vec3 vN; out vec3 vObj; out vec3 vRel;
void main(){
  vObj = aPos; vN = aPos;
  vec3 w = uRel + aPos * uRadius;
  vRel = w;
  gl_Position = uProj * vec4(uView * w, 1.0);
  ${''}${LOGDEPTH}
}`;

const FS_PLANET = NOISE + `
in vec3 vN; in vec3 vObj; in vec3 vRel;
uniform vec3 uSunDir; uniform vec3 uColA; uniform vec3 uColB; uniform vec3 uColC;
uniform float uSeed; uniform int uType; uniform float uTime; uniform vec3 uAtmo; uniform float uFlash;
out vec4 o;
void main(){
  vec3 N = normalize(vN);
  vec3 V = normalize(-vRel);
  float ndl = dot(N, uSunDir);
  float day = smoothstep(-0.12, 0.18, ndl);
  vec3 col; float spec = 0.0; float lights = 0.0;
  if (uType == 0) {            // scorched rock
    float h = fbm(vObj*3.5 + uSeed);
    float r = abs(fbm(vObj*7.0 + uSeed*2.0)*2.0-1.0);
    col = mix(uColA, uColB, smoothstep(0.25,0.75,h));
    col *= 0.7 + 0.5*r;
  } else if (uType == 1) {     // gas giant
    float warp = fbm(vObj*2.0 + uSeed)*1.6;
    float band = fbm(vec3(vObj.y*5.0 + warp, uSeed*3.1, uTime*0.004));
    col = mix(uColA, uColB, band);
    float storm = smoothstep(0.16, 0.0, length(vObj - normalize(vec3(0.8,-0.25,0.5))) - 0.02*sin(uTime*0.1));
    col = mix(col, uColC, storm*0.85);
  } else if (uType == 2) {     // living world
    float h = fbm(vObj*2.6 + uSeed);
    float ocean = smoothstep(0.55, 0.53, h);
    vec3 land = mix(uColB, uColC, smoothstep(0.55,0.72,h));
    land = mix(land, vec3(0.55,0.5,0.42), smoothstep(0.68,0.8,h));
    vec3 sea = mix(uColA*0.35, uColA, smoothstep(0.42,0.545,h));
    col = mix(land, sea, ocean);
    float cap = smoothstep(0.72, 0.86, abs(vObj.y) + fbm3(vObj*5.0)*0.12);
    col = mix(col, vec3(0.9,0.93,0.97), cap);
    spec = ocean * (1.0-cap);
    float cl = smoothstep(0.52, 0.74, fbm(vObj*3.4 + vec3(uTime*0.003,0.0,uTime*0.001) + uSeed*7.0));
    col = mix(col, vec3(0.92,0.94,0.97), cl*0.9);
    lights = (1.0-ocean)*(1.0-cap)*(1.0-cl) * smoothstep(0.6,0.9, fbm(vObj*9.0+uSeed*3.0));
  } else {                     // ice
    float h = fbm(vObj*3.0 + uSeed);
    float crack = smoothstep(0.02,0.0,abs(fbm(vObj*6.0+uSeed)*2.0-1.0)-0.02);
    col = mix(uColA, uColB, h);
    col = mix(col, uColC, crack*0.6);
  }
  vec3 sunCol = vec3(1.0, 0.93, 0.82);
  vec3 lit = col * (day * max(ndl,0.0) * sunCol * 1.25 + 0.006);
  if (spec > 0.0) {
    vec3 R = reflect(-uSunDir, N);
    lit += sunCol * pow(max(dot(R,V),0.0), 90.0) * spec * day * 0.6;
  }
  lit += vec3(1.0,0.85,0.5) * lights * (1.0-day) * 0.28;   // cities on the night side
  float rim = pow(1.0 - max(dot(N,V),0.0), 3.0);
  lit += uAtmo * rim * (day*0.9+0.03) * 1.2;
  lit += col * uFlash * 0.35;                              // supernova light
  o = vec4(lit, 1.0);
}`;

const FS_SUN = NOISE + `
in vec3 vN; in vec3 vObj; in vec3 vRel;
uniform float uTime;
out vec4 o;
void main(){
  vec3 N = normalize(vN); vec3 V = normalize(-vRel);
  float g = fbm(vObj*6.0 + vec3(uTime*0.02, uTime*0.013, 0.0));
  float g2 = fbm(vObj*16.0 - vec3(0.0, uTime*0.03, uTime*0.02));
  float limb = pow(max(dot(N,V), 0.0), 0.55);
  vec3 col = mix(vec3(1.0,0.42,0.1), vec3(1.0,0.85,0.55), g*0.7+g2*0.3);
  o = vec4(col * (1.4 + g*1.2) * (0.35 + 0.65*limb) * 2.2, 1.0);
}`;

const FS_ATMO = `
in vec3 vN; in vec3 vObj; in vec3 vRel;
uniform vec3 uSunDir; uniform vec3 uAtmo;
out vec4 o;
void main(){
  vec3 N = normalize(vN); vec3 V = normalize(-vRel);
  float rim = pow(1.0 - abs(dot(N,V)), 3.2);
  float litf = clamp(dot(N,uSunDir)*0.65 + 0.42, 0.02, 1.0);
  o = vec4(uAtmo * rim * litf * 1.6, 1.0);
}`;

const VS_RING = `
layout(location=0) in vec3 aPos;
uniform mat4 uProj; uniform mat3 uView; uniform mat3 uModel;
uniform vec3 uRel; uniform float uR0; uniform float uR1; uniform float uLogF;
out float vT; out vec3 vRel; out vec3 vLocal;
void main(){
  vec3 dir = normalize(vec3(aPos.x, 0.0, aPos.z));
  float rr = mix(uR0, uR1, step(1.5, length(aPos.xz)));
  vT = step(1.5, length(aPos.xz));
  vLocal = dir * rr;
  vec3 w = uRel + uModel * vLocal;
  vRel = w;
  gl_Position = uProj * vec4(uView * w, 1.0);
  ${''}${LOGDEPTH}
}`;

const FS_RING = NOISE + `
in float vT; in vec3 vRel; in vec3 vLocal;
uniform vec3 uSunDir; uniform float uSeed; uniform float uPlanetR; uniform vec3 uPlanetRel;
out vec4 o;
void main(){
  float t = vT;
  float r = length(vLocal);
  float bands = fbm(vec3(r*0.00045, uSeed, 0.0));
  float fine  = vnoise(vec3(r*0.004, uSeed*2.0, 0.0));
  float a = smoothstep(0.0,0.06,t)*smoothstep(1.0,0.9,t) * (0.25 + bands*0.85) * (0.55+fine*0.45);
  // shadow of the planet across the ring, with a soft penumbra
  vec3 P = vRel - uPlanetRel;
  float along = dot(P, uSunDir);
  float side = length(P - uSunDir*along);
  float pen = mix(1.0, 1.35, clamp(-along/(uPlanetR*8.0), 0.0, 1.0));
  float shadow = along < 0.0 ? mix(0.12, 1.0, smoothstep(uPlanetR*0.85, uPlanetR*pen, side)) : 1.0;
  vec3 col = mix(vec3(0.45,0.38,0.3), vec3(0.72,0.64,0.52), bands) * shadow;
  o = vec4(col * 0.9, a*0.85);
}`;

const FS_DISK = NOISE + `

in vec2 vUv;
uniform int uFace;
out vec4 o;
vec3 faceDir(int f, vec2 c){

const VS_POST = `
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;
const FS_POST = `
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uBH;        // screen uv of black hole
uniform float uBHr;      // photon-sphere screen radius (uv units, aspect-corrected y)
uniform float uBHon;
uniform vec2 uAspect;
uniform float uTime; uniform float uFlash;
uniform vec2 uSun; uniform float uSunI; uniform float uBHfront;
uniform float uDark; uniform float uWhite;
out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  vec2 uv = vUv;
  vec3 col;
  if (uBHon > 0.001) {
    vec2 d = (uv - uBH) * uAspect;
    float r = length(d);
    float rs = uBHr;
    float pull = min(rs*rs / max(r, 1e-4) * 1.35, rs*2.2) * uBHon;
    float infl = smoothstep(rs*14.0, rs*2.0, r);
    vec2 dir = d / max(r, 1e-5);
    vec2 warp = dir * pull * infl;
    // frame-dragging twist
    float tw = 0.55 * rs / max(r, rs) * infl * uBHon;
    vec2 dirT = vec2(-dir.y, dir.x);
    vec2 suv = uv - (warp + dirT * tw * rs) / uAspect;
    float ca = min(pull, rs) * smoothstep(rs*5.0, rs*1.2, r) * 0.05;
    col.r = texture(uTex, suv - dir*ca/uAspect).r;
    col.g = texture(uTex, suv).g;
    col.b = texture(uTex, suv + dir*ca/uAspect).b;
    // event horizon + photon ring
    float hole = smoothstep(rs*1.02, rs*0.92, r) * uBHon;
    col = mix(col, vec3(0.0), hole);
    float ring = exp(-pow((r-rs*1.08)/(rs*0.07), 2.0));
    col += vec3(1.0,0.82,0.6) * ring * 1.8 * uBHon;
  } else {
    col = texture(uTex, uv).rgb;
  }
  // sun glare — only when the sun's pixels are actually visible (not eclipsed)
  if (uSunI > 0.001) {
    vec3 sc = texture(uTex, uSun).rgb + texture(uTex, uSun+vec2(0.004,0.0)).rgb
            + texture(uTex, uSun-vec2(0.004,0.0)).rgb;
    float lum = dot(sc, vec3(0.33));
    float vis = smoothstep(1.6, 3.6, lum) * uSunI;
    if (uBHon > 0.001 && uBHfront > 0.5) {
      // no glare from behind an event horizon (only when the hole is nearer)
      float rsun = length((uSun - uBH) * uAspect);
      vis *= mix(1.0, smoothstep(uBHr*1.05, uBHr*1.7, rsun), uBHon);
    }
    if (vis > 0.001) {
      vec2 sd = (vUv - uSun) * uAspect;
      float sr = length(sd);
      float halo = exp(-sr*5.0);
      float streak = exp(-abs(sd.y)*70.0) * exp(-abs(sd.x)*3.5);
      col += vec3(1.0,0.75,0.5) * (halo*0.5 + streak*0.4) * vis;
    }
  }
  col *= 1.0 + uFlash;
  // vignette
  vec2 q = vUv*2.0-1.0;
  col *= 1.0 - dot(q,q)*0.16;
  col = aces(col);
  col = mix(col, vec3(1.0), uWhite);

  float g = fract(sin(dot(vUv*vec2(917.13,533.7)+uTime, vec2(12.9898,78.233)))*43758.5453);
  col += (g-0.5)*0.015;
  col *= 1.0 - uDark;
  o = vec4(col, 1.0);
}`;

  gl.drawElements(gl.TRIANGLES, sphereHi.n, gl.UNSIGNED_SHORT, 0); drawCount++;

  gl.useProgram(pBody.p);
  gl.uniformMatrix4fv(pBody.u.uProj, false, proj);
  gl.uniformMatrix3fv(pBody.u.uView, false, view);

    bhU = px*0.5+0.5; bhV = py*0.5+0.5;
    bhR = (BH.r*2.6/bhDist) / (2*Math.tan(cam.fov/2)); // photon sphere angular size / vertical fov
    if (death.state === 1 && death.cause === 'gorgon') bhR *= 1 + death.t*1.4;  // it takes the sky with it
    // fade the whole lens by how far its center sits outside the frame — no pop
    const ox = Math.max(0, -bhU, bhU-1), oy = Math.max(0, -bhV, bhV-1);

  gl.uniform2f(pPost.u.uBH, bhU, bhV);

  gl.uniform1f(pPost.u.uBHon, bhOn);
  gl.uniform2f(pPost.u.uAspect, fboW/fboH, 1.0);
  gl.uniform1f(pPost.u.uTime, t % 61.7);
  gl.uniform1f(pPost.u.uFlash, nova.bright*0.55);
  // sun screen position for glare
  const svx = view[0]*sunRel[0]+view[3]*sunRel[1]+view[6]*sunRel[2];
  const svy = view[1]*sunRel[0]+view[4]*sunRel[1]+view[7]*sunRel[2];
  const svz = view[2]*sunRel[0]+view[5]*sunRel[1]+view[8]*sunRel[2];
  let sunI = 0, sunU = 0.5, sunV = 0.5;
  if (svz < -NEAR) {
    const px = proj[0]*svx/-svz, py = proj[5]*svy/-svz;
    sunU = px*0.5+0.5; sunV = py*0.5+0.5;
    if (sunU > -0.2 && sunU < 1.2 && sunV > -0.2 && sunV < 1.2) {

  gl.uniform2f(pPost.u.uSun, sunU, sunV);
  gl.uniform1f(pPost.u.uSunI, sunI);
  gl.uniform1f(pPost.u.uBHfront, bhDist < Math.hypot(sunRel[0],sunRel[1],sunRel[2]) ? 1 : 0);
  gl.uniform1f(pPost.u.uDark, death.dark);
  gl.uniform1f(pPost.u.uWhite, death.white);
  gl.bindVertexArray(quadVao);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); drawCount++;
}

// ---------------------------------------------------------- sim loop

  const lookBH = ((fx*(BH.pos[0]-cam.pos[0])+fy*(BH.pos[1]-cam.pos[1])+fz*(BH.pos[2]-cam.pos[2]))/Math.max(bhDist,1)) > 0.9987;

  cand.sort((a,b) => a.d - b.d);
  const placed = [];
  for (const c of cand) {
    if (placed.some(p => Math.abs(p.x-c.x) < 170 && Math.abs(p.y-c.y) < 48)) continue;
    placed.push(c);
    c.el.style.opacity = 0.9;
    c.el.style.left = (c.x/W*100) + '%';
    c.el.style.top  = (c.y/H*100) + '%';
    setText(c.el, c.text);
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!started) { last = now; return; }
  let dt = (now - last)/1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (dt <= 0) return;
  gatherInput();
  const st = step(dt);
  draw(simT);
  // metrics + adaptive resolution
  fpsAcc += dt; fpsN++;
  adaptT -= dt;
  updateHud(st);   // every frame — labels must track their bodies at multi-c
  if (adaptT <= 0 && fpsN > 20) {
    const avgMs = fpsAcc/fpsN*1000;
    METRICS.fps = Math.round(1000/avgMs); METRICS.ms = +avgMs.toFixed(2);
    METRICS.scale = +renderScale.toFixed(2); METRICS.draws = drawCount;
    // a frame interval alone can't distinguish "rAF-capped, GPU idle" (iOS Low
    // Power Mode: 30 Hz) from "GPU-bound at 33 ms" — so downscaling is run as
    // an experiment: if it doesn't make frames faster, revert and accept the
    // observed cadence as the display rate.
    const maxScale = Math.min(devicePixelRatio||1, 2);
    dispMs = Math.min(dispMs, Math.max(avgMs, 6));           // rates only reveal themselves downward
    if (probing) {
      probing = false;
      if (avgMs > preProbe*0.92) {                           // bought nothing: we were vsync-capped
        renderScale = Math.min(maxScale, renderScale + 0.15);
        dispMs = Math.max(dispMs, avgMs*0.98);
        resize();
      }
    } else if (avgMs > dispMs*1.5 && renderScale > 0.55) {
      preProbe = avgMs; probing = true; goodRun = 0;
      renderScale = Math.max(0.55, renderScale - 0.15);
      resize();
    } else if (avgMs < dispMs*1.25 && renderScale < maxScale) {
      if (++goodRun >= 3) { goodRun = 0; renderScale = Math.min(maxScale, renderScale + 0.1); resize(); }
    } else goodRun = 0;
    fpsAcc = 0; fpsN = 0; adaptT = 2.0;
  }
}
requestAnimationFrame(frame);

// ---------------------------------------------------------- boot
function begin() {
  if (started) return;
  started = true;
  window.__started = true;
  $('start').classList.add('gone');
  if (isTouch) { $('boost').style.display='block'; $('brake').style.display='block'; $('scream').style.display='block'; }
  initAudio();
  setTimeout(() => {
    if (!$('whisper').classList.contains('on')) whisper('you are awake. no one else is, for a very long way.', 10);
  }, 3500);
}
$('begin').addEventListener('click', begin);
$('begin').addEventListener('touchend', e => { e.preventDefault(); begin(); }, { passive:false });
window.__begin = begin;

document.addEventListener('visibilitychange', () => {
  if (AC) { (document.hidden ? AC.suspend() : AC.resume()).catch(() => {}); }
});
// iOS can leave the context 'interrupted' after calls/Siri/lock; a resume()
// outside a gesture may be rejected — retry inside the next touch.
document.addEventListener('touchstart', () => {
  if (AC && AC.state !== 'running') AC.resume().catch(() => {});
}, { passive:true });
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  $('err').style.display='flex';
  $('err').textContent = 'the renderer was lost to the void. reload to wake again.';
});
addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
