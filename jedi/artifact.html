  var rb = Math.sqrt(bx*bx + by*by + bz*bz);
  var cx = ax + (bx-ax)*t, cy = ay + (by-ay)*t, cz = az + (bz-az)*t;
  var rc = Math.sqrt(cx*cx + cy*cy + cz*cz);
  if (rc > 1e-4){
    var k = (ra + (rb-ra)*t) / rc;
    cx *= k; cy *= k; cz *= k;
  }
  o[0] = blC[0]+cx; o[1] = blC[1]+cy; o[2] = blC[2]+cz;
  return o;
}
function norm3(o){
  var l = Math.sqrt(o[0]*o[0] + o[1]*o[1] + o[2]*o[2]);
  if (l < 1e-6){ o[0] = 0; o[1] = 1; o[2] = 0; return o; }
  o[0] /= l; o[1] /= l; o[2] /= l; return o;
}
function max0(x){ return x > 0 ? x : 0; }
function ez(c, t, k){ return c + (t - c) * k; }

/* ======================= ARC ENGINE ========================================
 * An arc is a rotation of the blade about `pivot` in the plane whose normal is
 * `axis` (all body-local). The plane's basis (u,v) is derived from the axis so
 * arcDefs stay readable: u (angle 0) points UP, or FORWARD when the axis is
 * vertical; v = axis X u, so positive angles follow the right-hand rule.
 * Zero allocation after create(): every intermediate lives in a module scratch.
 * ========================================================================== */
var AV = new Float32Array(3);      /* scratch: radial (pivot->blade middle) dir */
var A2 = new Float32Array(2);      /* scratch: [a0, a1] out of dirsToArc        */
var ESC_C = new Float32Array(8);   /* scratch: 4 candidate escapes, (x,z) pairs */

function setBasis(a, x, y, z){
  var l = Math.sqrt(x * x + y * y + z * z);
  if (!(l > 1e-6)){ x = -1; y = 0; z = 0; l = 1; }   /* default: sagittal chop */
  x /= l; y /= l; z /= l;
  a.n[0] = x; a.n[1] = y; a.n[2] = z;
  var ux, uy, uz;
  if (y < 0.965 && y > -0.965){       /* angle 0 = UP, projected into the plane */
    ux = -x * y; uy = 1 - y * y; uz = -z * y;
  } else {                            /* vertical axis: angle 0 = FORWARD (-Z) */
    ux = x * z; uy = y * z; uz = z * z - 1;
  }
  l = Math.sqrt(ux * ux + uy * uy + uz * uz) || 1;
  ux /= l; uy /= l; uz /= l;
  a.u[0] = ux; a.u[1] = uy; a.u[2] = uz;
  a.v[0] = y * uz - z * uy;           /* v = axis X u */
  a.v[1] = z * ux - x * uz;
  a.v[2] = x * uy - y * ux;
}

/* Build a plane + [a0,a1] (into A2) that sweeps direction s -> direction e.
 * Used by the playSwing shim and the default slash. */
function dirsToArc(a, sx, sy, sz, ex, ey, ez){
  var l = Math.sqrt(sx*sx + sy*sy + sz*sz) || 1; sx /= l; sy /= l; sz /= l;
  l = Math.sqrt(ex*ex + ey*ey + ez*ez) || 1; ex /= l; ey /= l; ez /= l;
  var cx = sy*ez - sz*ey, cy = sz*ex - sx*ez, cz = sx*ey - sy*ex;
  var cl = Math.sqrt(cx*cx + cy*cy + cz*cz);
  var dp = sx*ex + sy*ey + sz*ez, ang;
  if (cl < 1e-3){                     /* parallel: swing in the plane s x up */
    cx = -sz; cy = 0; cz = sx;
    if (cx*cx + cz*cz < 1e-4){ cx = 1; cy = 0; cz = 0; }
    ang = 1.3;
  } else {
    ang = Math.atan2(cl, dp);
  }
  setBasis(a, cx, cy, cz);
  A2[0] = Math.atan2(sx*a.v[0] + sy*a.v[1] + sz*a.v[2],
                     sx*a.u[0] + sy*a.u[1] + sz*a.u[2]);
  A2[1] = A2[0] + ang;
  return A2;
}

/* the classic default slash: high outside right -> low across to the left */
var DEFAULT_ARC = {
  dur: 0.40, pivot: new Float32Array([0.06, 1.34, -0.04]), radius: 1.02,
  axis: new Float32Array(3), a0: 0, a1: 1.6, tilt: 0,
  windup: 0.28, recover: 0.26, lunge: 0.16, name: 'SLASH'
};
(function(){
  var tmp = { n: DEFAULT_ARC.axis, u: new Float32Array(3), v: new Float32Array(3) };
  dirsToArc(tmp, 0.52, 0.60, -0.60, -0.60, -0.34, -0.72);
  DEFAULT_ARC.a0 = A2[0]; DEFAULT_ARC.a1 = A2[1];
})();

/* How far the weapon has to slide along the body-local XZ direction (ex,ez) so
 * that no part of it is inside the no-go volume — the BODY_RX/BODY_RZ ellipse,
 * between BODY_Y0 and BODY_Y1. All arguments are BODY-LOCAL: the hand at
 * (hx,hy,hz), the blade direction (dx,dy,dz), and the weapon occupying `lo`..`hi`
 * metres along it (`lo` is NEGATIVE: the pommel is behind the hand).
 * Zero allocation, ~25 flops a sample.
 *
 * ONLY SAMPLES ACTUALLY INSIDE THE CAPSULE ASK FOR ANYTHING, and what they ask
 * for is the LARGER root of P + t*e outside the no-go ellipse (P = the sample in
 * the body's XZ plane) — the least travel that gets the sample out AND keeps it
 * out. Inside the ellipse that root always exists and is always positive, so
 * there is no branch to step over. The demand
 * fades in with penetration DEPTH over BODY_DEEP, so a sample crossing the
 * ellipse wall asks for nothing at the wall — which is what makes the whole
 * function continuous in time, hence pop-free. A clean pose is left EXACTLY
 * alone: push is identically zero, so idle/run/guard are untouched.
 *
 * WHAT THIS REPLACED, AND WHY (measured, all 12 attacks x 3 saber types,
 * 161 samples a swing, plus a one-frame-displacement probe at 60 fps):
 *   - The old version treated a sample that was out the FAR side as a CAP on the
 *     whole weapon's travel. That cap STEPPED: one sample crossing the far
 *     tangent flipped its contribution from "clamp everything to ~0" to
 *     "displace clear across the body", so the entire weapon teleported up to BODY_MAX in
 *     a single frame. Measured on the three cross-body attacks (SNAP CUT RIGHT,
 *     FALLING STAR, AVALANCHE — one in every stance): 0.50 m of HAND movement in
 *     one 60 fps frame at phase 0.056, a peak wind-up tip speed of 358 m/s
 *     against a 36 m/s strike. Those attacks read as a flinch, then a cut. No
 *     swing-probe metric sees a one-frame pop; only differentiating the tip does.
 *   - The cap was also what left the staff's hilt at the exact centre of the
 *     chest (-0.120 m, the deepest penetration the torso box admits) on those
 *     same three attacks: clearing one end of a centre-gripped staff drove the
 *     other end in, so the cap gave up and pushed nothing at all.
 * Travel is capped by BODY_MAX; the escape DIRECTION (see playArc) is what keeps
 * the demand small — a cross-body arc escapes mostly FORWARD, in front of the
 * chest, because no amount of sideways sliding can clear a blade that lies
 * across the sternum. */
function clearPush(hx, hy, hz, dx, dy, dz, lo, hi, steps, ex, ez){
  var push = 0, i, s, x, y, z, w, b, q, t;
  for (i = 0; i <= steps; i++){
    s = lo + (hi - lo) * (i / steps);
    y = hy + dy * s;
    w = 1;
    if (y < BODY_Y0) w = (y - BODY_Y0 + BODY_FADE) / BODY_FADE;
    else if (y > BODY_Y1) w = (BODY_Y1 + BODY_FADE - y) / BODY_FADE;
    if (w <= 0) continue;                     /* above the hair / below the hips */
    if (w > 1) w = 1;
    w = w * w * (3 - 2 * w);                  /* smooth fade at the capsule ends */
    x = hx + dx * s; z = hz + dz * s;
    q = (x * x) * IRX2 + (z * z) * IRZ2;      /* < 1 == inside the ellipse */
    if (q >= 1) continue;                     /* clear: asks for nothing */
    if (1 - q < BODY_DEEP){                   /* fade in with depth */
      var f = (1 - q) / BODY_DEEP;
      w *= f * f * (3 - 2 * f);
    }
    /* least t >= 0 that puts P + t*e outside the ellipse: the larger root of
       A t^2 + 2 B t + (q - 1) >= 0. Inside means q < 1, so the root always
       exists and is always positive — there is no branch to step over. */
    var A = ex * ex * IRX2 + ez * ez * IRZ2;
    if (A < 1e-9) continue;
    b = x * ex * IRX2 + z * ez * IRZ2;
    t = ((Math.sqrt(b * b - A * (q - 1)) - b) / A) * w;
    if (t > push) push = t;
  }
  return push;                    /* RAW: callers apply the BODY_MAX ceiling, and
                                     buildProf scores the raw total so a candidate
                                     that saturates loses to one that fits */
}

/* Sample the arc at phase p (0..1) for one side, all in body-local space.
 *   om <- blade MIDDLE (what the IK blends through), od <- blade direction,
 *   oh <- the hand that puts the blade there, AV <- radial dir (torso follow).
 *   sgn -1 mirrors everything across the body's YZ plane (dual off hand). */
function arcSample(a, p, oh, od, om, type, sgn){
  var d = a.a1 - a.a0, wu = a.windup, rc = a.recover;
  var back = a.a0 - BACK_FRAC * d;
  var ang, rs, s;
  if (p < wu){                                     /* anticipation: coil back */
    s = smooth(p / wu);
    ang = a.a0 + (back - a.a0) * s;
    rs = 1 - COIL_R * (0.55 + 0.45 * s);   /* already coiled at p=0: the blade
                                              takes the SHORT way into the cock */
  } else if (p < 1 - rc){                          /* strike: snap, then decel */
    var span = 1 - rc - wu;
    s = span > 1e-4 ? (p - wu) / span : 1;
    if (s > 1) s = 1;
    /* strike curve: 3/4 of a "snap" (angular speed peaks a third of the way in,
     * then decelerates) + 1/4 smoothstep so the follow-through is not all dead
     * time. Both terms start and end at zero speed, so no jerk at either edge. */
    var e = 0.75 * (s * s * (6 - 8 * s + 3 * s * s)) + 0.25 * (s * s * (3 - 2 * s));
    ang = back + (a.a1 - back) * e;
    var x = s * 1.8; if (x > 1) x = 1;
    rs = (1 - COIL_R) + (COIL_R + OVER_R) * smooth(x);   /* arm extends */
  } else {                                         /* follow-through -> guard */
    s = smooth(rc > 1e-4 ? (p - (1 - rc)) / rc : 1);
    ang = a.a1 - SETTLE_FRAC * d * s;
    rs = (1 + OVER_R) - PULL_R * s;
  }
  var bang = ang + (d >= 0 ? LEAD : -LEAD);        /* blade leads the sweep */
  var c = Math.cos(ang), si = Math.sin(ang);
  AV[0] = a.u[0]*c + a.v[0]*si;
  AV[1] = a.u[1]*c + a.v[1]*si;
  AV[2] = a.u[2]*c + a.v[2]*si;
  c = Math.cos(bang); si = Math.sin(bang);
  od[0] = a.u[0]*c + a.v[0]*si;
  od[1] = a.u[1]*c + a.v[1]*si;
  od[2] = a.u[2]*c + a.v[2]*si;
  var r = a.radius * rs;
  if (AV[1] > 0.04){          /* elbow tucks as the blade goes overhead */
    var cap = (CEIL_Y - a.pivot[1] - od[1] * BLADE_LEN * 0.5) / AV[1];
    if (cap < 0.30) cap = 0.30;
    var k = 0.35, h = 0.5 + 0.5 * (cap - r) / k;
    if (h < 0) h = 0; else if (h > 1) h = 1;
    r = cap + (r - cap) * h - k * h * (1 - h);      /* smooth min(r, cap) */
  }
  /* the off hand never holds a staff, so only the right side uses STAFF_TOP */
  var ho = (sgn > 0 && type === 'staff' ? STAFF_TOP : HILT_TOP) + BLADE_LEN * 0.5;
  om[0] = a.pivot[0] + AV[0]*r;
  om[1] = a.pivot[1] + AV[1]*r;
  om[2] = a.pivot[2] + AV[2]*r;
  oh[0] = om[0] - od[0]*ho;
  oh[1] = om[1] - od[1]*ho;
  oh[2] = om[2] - od[2]*ho;
  if (sgn < 0){
    oh[0] = -oh[0]; od[0] = -od[0]; om[0] = -om[0]; AV[0] = -AV[0];
  }
}

/* advance the arc clock and refresh this frame's targets */
function arcUpdate(r, dt){
  var a = r.arc;
  a.t += dt;
  if (a.active && a.t >= a.dur) a.active = false;
  if (a.t >= a.dur + BLEND_OUT){
    a.live = false; a.wIn = 0; a.wOut = 0; a.lungeCur = 0;
    return;
  }
  var p = a.t / a.dur; if (p > 1) p = 1; else if (p < 0) p = 0;
  a.wIn = smooth(a.t / a.blendIn);
  a.wOut = a.t <= a.dur ? 1 : smooth(1 - (a.t - a.dur) / BLEND_OUT);

  arcSample(a, p, a.hR, a.dR, a.mR, r.type, 1);
  a.twist = TW_GAIN * -AV[0];                 /* chest rotates into the swing */
  a.lean  = LN_GAIN * LEAN_SIGN * AV[1];      /* overheads arch, then hunch */
  if (a.mirror){
    var pl = (a.t - DUAL_PHASE * a.dur) / a.dur;
    if (pl < 0) pl = 0; else if (pl > 1) pl = 1;
    arcSample(a, pl, a.hL, a.dL, a.mL, r.type, -1);
  }

  var lp = 0;                                  /* lunge pushes during the strike */
  if (p > a.windup){
    var sp = 1 - a.recover - a.windup; if (sp < 1e-3) sp = 1e-3;
    var s = (p - a.windup) / sp; if (s > 1) s = 1;
    lp = smooth(s * 2 > 1 ? 1 : s * 2);
    if (p > 1 - a.recover)
      lp *= 1 - 0.7 * smooth((p - (1 - a.recover)) / (a.recover || 1e-3));
  }
  /* Carry the PREVIOUS swing's lunge out instead of dropping it. Without this,
     chaining out of a lunging attack reset the visual forward offset to 0 in a
     single frame and the whole drawn body teleported: measured 1.29 m of hand
     movement in one 60 fps frame on VIPER LUNGE (1.20 m of lunge) -> FLURRY
     CROSS, the most-used LIGHT combo in the game. The carry starts at exactly
     the offset we already had (so t = 0 is continuous) and eases out over
     LUNGE_CARRY — its own constant, not the pose blend, because a LIGHT chain's
     blend is only 76 ms and unloading a metre that fast is its own artefact. */
  var cw = a.t < LUNGE_CARRY ? 1 - smooth(a.t / LUNGE_CARRY) : 0;
  a.lungeCur = a.lungeAmt * lp * a.wOut + a.lungeCarry * cw;
}

/* Body-local blade middle + direction of the PROCEDURAL arm pose. Used only when
 * a new arc starts and the rig has not been drawn recently (off-screen bots), so
 * the blend still has a real pose to come out of instead of popping. */
var mLocA = M.make();
function fkLocal(r, side, outM, outD){
  var p = r.pose;
  M.ident(mLocA);
  M.tr(mLocA, 0, HIP_Y + p.bob + PELV2TORSO, 0);
  M.ry(mLocA, p.twist); M.rx(mLocA, p.lean);
  M.tr(mLocA, side * SH_X, SH_Y, 0);
  if (side > 0){ M.rz(mLocA, p.sprR); M.ry(mLocA, p.syR); M.rx(mLocA, p.aSwR); }
  else { M.rz(mLocA, -p.sprL); M.ry(mLocA, p.syL); M.rx(mLocA, p.aSwL); }
  M.tr(mLocA, 0, -UARM, 0); M.rx(mLocA, side > 0 ? p.elbR : p.elbL);
  M.tr(mLocA, 0, -LARM, 0); M.rx(mLocA, side > 0 ? p.wrist : p.wrL);
  if (side > 0) M.rz(mLocA, p.wrr);
  var ho = (r.type === 'staff' ? STAFF_TOP : HILT_TOP) + BLADE_LEN * 0.5;
  outD[0] = mLocA[4]; outD[1] = mLocA[5]; outD[2] = mLocA[6];
  outM[0] = mLocA[12] + outD[0] * ho;
  outM[1] = mLocA[13] + outD[1] * ho;
  outM[2] = mLocA[14] + outD[2] * ho;
}

/* ---- the planned clearance slide (see PROF_N) ------------------------------ */
var pfH = new Float32Array(3), pfD = new Float32Array(3), pfM = new Float32Array(3);
var pfFM = new Float32Array(3), pfFD = new Float32Array(3);
var PROF_A = new Float32Array(PROF_N + 1), PROF_B = new Float32Array(PROF_N + 1);

/* Walk the whole swing for one arm and fill `out` with the slide clearPush wants
 * at each instant, then dilate + slope-limit. Returns the peak. `sgn` +1 right /
 * -1 left (mirrored, phase-lagged by DUAL_PHASE exactly as arcUpdate does).
 * Reproduces ikArm's blend arithmetic — blade MIDDLE space, wIn out of the pose
 * we came from, wOut back into the procedural pose. Zero allocation. */
function buildProf(r, a, sgn, snapM, snapD, ho, ex, ez, out){
  var sf = (sgn > 0 && r.type === 'staff');
  var top = sf ? STAFF_TOP : HILT_TOP;
  var lo = sf ? -(top + BLADE_LEN) : -HILT_BOT, hi = top + BLADE_LEN;
  var ns = sf ? 2 * WEAP_N : WEAP_N;
  var tot = a.dur + BLEND_OUT, dtp = tot / PROF_N, i, t, p, wi, wo, l;
  var score = 0, raw;
  var mx0, my0, mz0, dx0, dy0, dz0;
  fkLocal(r, sgn, pfFM, pfFD);            /* where the blend-out is heading */
  blC[0] = sgn * a.pivot[0]; blC[1] = a.pivot[1]; blC[2] = a.pivot[2];
  for (i = 0; i <= PROF_N; i++){
    t = i * dtp;
    p = (sgn < 0 ? t - DUAL_PHASE * a.dur : t) / a.dur;
    if (p < 0) p = 0; else if (p > 1) p = 1;
    wi = smooth(t / a.blendIn);
    wo = t <= a.dur ? 1 : smooth(1 - (t - a.dur) / BLEND_OUT);
    arcSample(a, p, pfH, pfD, pfM, r.type, sgn);
    dx0 = pfD[0]; dy0 = pfD[1]; dz0 = pfD[2];
    if (wi < 1){
      arcLerp(pfM, snapM, pfM, wi);
      dx0 = snapD[0] + (dx0 - snapD[0]) * wi;
      dy0 = snapD[1] + (dy0 - snapD[1]) * wi;
      dz0 = snapD[2] + (dz0 - snapD[2]) * wi;
    }
    if (wo < 1){
      arcLerp(pfM, pfFM, pfM, wo);
      dx0 = pfFD[0] + (dx0 - pfFD[0]) * wo;
      dy0 = pfFD[1] + (dy0 - pfFD[1]) * wo;
      dz0 = pfFD[2] + (dz0 - pfFD[2]) * wo;
    }
    l = Math.sqrt(dx0*dx0 + dy0*dy0 + dz0*dz0);
    if (l < 1e-6){ dx0 = 0; dy0 = 1; dz0 = 0; } else { dx0 /= l; dy0 /= l; dz0 /= l; }
    mx0 = pfM[0]; my0 = pfM[1]; mz0 = pfM[2];
    raw = clearPush(mx0 - dx0*ho, my0 - dy0*ho, mz0 - dz0*ho,
                    dx0, dy0, dz0, lo, hi, ns, ex, ez);
    score += raw + 6 * max0(raw - BODY_MAX);   /* travel, saturation weighs 7x */
    out[i] = raw > BODY_MAX ? BODY_MAX : raw;
  }
  /* dilate one step: a need that peaks BETWEEN samples is still covered */
  PROF_B.set(out);
  for (i = 0; i <= PROF_N; i++){
    if (i > 0 && PROF_B[i-1] > out[i]) out[i] = PROF_B[i-1];
    if (i < PROF_N && PROF_B[i+1] > out[i]) out[i] = PROF_B[i+1];
  }
  /* Slope-limit both ways at PUSH_RATE. The two passes only RAISE samples, so no
     clearance is lost, and the backward pass is what makes the slide start moving
     BEFORE the blade needs it — the anticipation absorbs the move exactly as it
     absorbs the pose blend. */
  var lim = PUSH_RATE * dtp;
  for (i = PROF_N - 1; i >= 0; i--) if (out[i] < out[i+1] - lim) out[i] = out[i+1] - lim;
  for (i = 1; i <= PROF_N; i++) if (out[i] < out[i-1] - lim) out[i] = out[i-1] - lim;
  /* Both ENDS must be exactly zero, and the ramps out of them re-clamped. t = 0 is
     last frame's pose, which needs no slide at all; t = dur + BLEND_OUT is the
     procedural pose, ditto, and it is the frame the arc stops driving the arm — so
     any slide still applied there vanishes in one frame. Starting or ending
     anywhere but zero IS a pop. This is the one step that can cost clearance: a
     slide that could not be pre-charged in time arrives a frame or two late.
     Deliberate trade — a few cm of hilt inside a tunic for two frames is
     invisible; a 0.39 m one-frame jump of the saber is the most visible artefact
     this rig can produce, and was the defect this whole path exists to remove. */
  out[0] = 0; out[PROF_N] = 0;
  for (i = 1; i <= PROF_N; i++) if (out[i] > out[i-1] + lim) out[i] = out[i-1] + lim;
  var dn = PUSH_DROP * dtp;
  for (i = PROF_N - 1; i >= 0; i--) if (out[i] > out[i+1] + dn) out[i] = out[i+1] + dn;
  return score;
}

function profAt(prof, t, tot){
  if (!(tot > 0)) return 0;
  var u = t / tot * PROF_N;
  if (u <= 0) return prof[0];
  if (u >= PROF_N) return prof[PROF_N];
  var i = u | 0;
  return prof[i] + (prof[i+1] - prof[i]) * (u - i);
}

function playArc(def){
  var a = this.arc;
  if (a.active && a.t < a.dur * CHAIN_FRAC) return false;   /* not chainable yet */
  if (!def) def = DEFAULT_ARC;
  var pv = def.pivot, ax = def.axis;
  a.pivot[0] = pv ? num(pv[0],  0.06) :  0.06;
  a.pivot[1] = pv ? num(pv[1],  1.34) :  1.34;
  a.pivot[2] = pv ? num(pv[2], -0.04) : -0.04;
  a.radius = clamp(num(def.radius, 1.02), 0.45, 1.70);
  setBasis(a, ax ? num(ax[0], -1) : -1, ax ? num(ax[1], 0) : 0, ax ? num(ax[2], 0) : 0);
  a.a0 = num(def.a0, -0.9);
  a.a1 = num(def.a1, 1.9);
  var d = a.a1 - a.a0;                          /* keep the sweep sane */
  if (d > 3.4) a.a1 = a.a0 + 3.4;
  else if (d < -3.4) a.a1 = a.a0 - 3.4;
  else if (d < 0.3 && d > -0.3) a.a1 = a.a0 + (d < 0 ? -0.3 : 0.3);
  a.tilt = num(def.tilt, 0);
  var wu = clamp(num(def.windup, 0.28), 0.05, 0.50);
  var rc = clamp(num(def.recover, 0.24), 0.02, 0.45);
  if (wu + rc > 0.82){ var k = 0.82 / (wu + rc); wu *= k; rc *= k; }
  a.windup = wu; a.recover = rc;
  a.lungeAmt = clamp(num(def.lunge, 0), -0.4, 1.2);
  a.dur = clamp(num(def.dur, SWING_DUR), 0.10, 3);
  /* the anticipation IS the blend out of the previous pose */

     one whose worst demand is smallest wins; ties go to the earlier candidate,

       1  straight FORWARD, in front of the chest

  var HOR = (this.type === 'staff' ? STAFF_TOP : HILT_TOP) + BLADE_LEN * 0.5;
  var bestN = 1e9, ci, nd;
  for (ci = 0; ci < 8; ci += 2){

var SHIM_AXIS = new Float32Array(3);
var SHIM = { dur: 0.4, pivot: new Float32Array([0.06, 1.34, -0.04]), radius: 1.02,

  lunge: 0, name: '', mirror: false };

/* Where the idle guard points the blade (body-local, unit): up-forward ~38 deg.
 * The tip has to travel from here into the arc's cocked pose, so an a0 far from
 * this costs real path — see the AUTHORING NOTE in the header. */

/* pull d toward the guard until it is at most `lim` radians away (shim only:
 * playArc always honours the author's a0 exactly) */
function limitFromGuard(d, lim){
  var c = d[0]*GUARD_DIR[0] + d[1]*GUARD_DIR[1] + d[2]*GUARD_DIR[2];

var IK_SOFT = 0.07;              /* m: below this reach the direction is damped
                                    toward the pole — see solveIK. Kept SMALL:

/* Solve upper/lower so the hand lands on T (clamped into reach). `pole` is a
 * unit-ish direction the elbow is pushed toward — stable = no inside-out snap. */
function solveIK(S, T, upper, lower, pole){
  var dx = T[0] - S[0], dy = T[1] - S[1], dz = T[2] - S[2];
  var L = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (L < 1e-4){                       /* target AT the shoulder: aim down-pole */
    dx = pole[0]; dy = pole[1]; dz = pole[2];
    L = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (L < 1e-4){ dx = 0; dy = -1; dz = 0; L = 1; }
  }
  var nx = dx / L, ny = dy / L, nz = dz / L;
  /* Near the shoulder the reach DIRECTION is ill-conditioned: the hand is clamped
     out to minL anyway, so a millimetre of target wobble would swing it through a
     large angle. Fade the direction toward the (always stable) pole as the target
     closes in. Measured: with the body-clearance slide able to drive a target to
     within 0.05 m of the shoulder, this was worth 26 m/s of spurious tip speed on
     METEOR SMASH's wind-up. Continuous, and a no-op beyond IK_SOFT. */
  if (L < IK_SOFT){
    var g = L / IK_SOFT; g = g * g * (3 - 2 * g);
    var pw = (1 - g) / (Math.sqrt(pole[0]*pole[0] + pole[1]*pole[1] + pole[2]*pole[2]) || 1);
    var bx = nx * g + pole[0] * pw, by = ny * g + pole[1] * pw, bz = nz * g + pole[2] * pw;
    var bn = Math.sqrt(bx*bx + by*by + bz*bz);
    if (bn > 1e-3){ nx = bx / bn; ny = by / bn; nz = bz / bn; }
  }
  var maxL = (upper + lower) * 0.995;
  var minL = Math.abs(upper - lower) + 0.06;
  if (L > maxL) L = maxL; else if (L < minL) L = minL;
  ikH[0] = S[0] + nx * L; ikH[1] = S[1] + ny * L; ikH[2] = S[2] + nz * L;
  /* in-plane component of the pole */
  var d = pole[0]*nx + pole[1]*ny + pole[2]*nz;
  var qx = pole[0] - nx*d, qy = pole[1] - ny*d, qz = pole[2] - nz*d;
  var ql = Math.sqrt(qx*qx + qy*qy + qz*qz);
  if (ql < 1e-3){                      /* pole parallel to the reach: any perp */
    qx = -nz; qy = 0; qz = nx;
    ql = Math.sqrt(qx*qx + qz*qz);
    if (ql < 1e-3){ qx = 1; qy = 0; qz = 0; ql = 1; }
  }
  qx /= ql; qy /= ql; qz /= ql;
  var ca = (L*L + upper*upper - lower*lower) / (2 * L * upper);
  if (ca > 1) ca = 1; else if (ca < -1) ca = -1;
  var sa = Math.sqrt(1 - ca*ca);
  ikE[0] = S[0] + upper * (ca*nx + sa*qx);
  ikE[1] = S[1] + upper * (ca*ny + sa*qy);
  ikE[2] = S[2] + upper * (ca*nz + sa*qz);
  ikN[0] = ny*qz - nz*qy;              /* unit: n and q are orthonormal */
  ikN[1] = nz*qx - nx*qz;
  ikN[2] = nx*qy - ny*qx;
}

       with a force jump is most of the time. The off arm still flings back for

    aSwL = 0.10; aSwR = 0.30;
    sprL = 0.10; sprR = 0.14;
    elbL = 0.28; elbR = 0.45;

  var kB = 1 - Math.exp(-14 * dt);            /* body mass */
  var kT = a.live ? 1 - Math.exp(-40 * dt) : kB;   /* torso snaps in a swing */
  p.lSwL = ez(p.lSwL, lSwL, kA);   p.lSwR = ez(p.lSwR, lSwR, kA);
  p.kneeL = ez(p.kneeL, kneeL, kA); p.kneeR = ez(p.kneeR, kneeR, kA);
  p.aSwL = ez(p.aSwL, aSwL, kA);   p.sprL = ez(p.sprL, sprL, kA);
  p.elbL = ez(p.elbL, elbL, kA);   p.syL = ez(p.syL, syL, kA);
  p.wrL = ez(p.wrL, wrL, kA);
  p.aSwR = ez(p.aSwR, aSwR, kA);   p.sprR = ez(p.sprR, sprR, kA);
  p.elbR = ez(p.elbR, elbR, kA);   p.wrist = ez(p.wrist, wrist, kA);
  p.syR = ez(p.syR, syR, kA);      p.wrr = ez(p.wrr, wrr, kA);
  p.bob = ez(p.bob, bob, kB);      p.lean = ez(p.lean, lean, kT);

    M.xp(wX, mRoot, snapM[0], snapM[1], snapM[2]);
    M.xd(wY, mRoot, snapD[0], snapD[1], snapD[2]);
    arcLerp(wT, wX, wT, wIn); lerp3(wB, wY, wB, wIn);
  }
  if (wOut < 1){                                       /* ...back to procedural */
    wY[0] = mH[4];  wY[1] = mH[5];  wY[2] = mH[6];
    wX[0] = mH[12] + wY[0]*ho; wX[1] = mH[13] + wY[1]*ho; wX[2] = mH[14] + wY[2]*ho;
    arcLerp(wT, wX, wT, wOut); lerp3(wB, wY, wB, wOut);
  }
  norm3(wB);
  wT[0] -= wB[0]*ho; wT[1] -= wB[1]*ho; wT[2] -= wB[2]*ho;   /* middle -> hand */
  /* --- body clearance (see BODY_RX): slide the weapon clear until none of it
     is inside its owner. Enforced HERE, on the BLENDED pose that is about to be
     drawn, not on the arc's target — measured, the frames that put the hilt in
     the sternum were the guard->coil blend (wIn 0.35..0.85), where the pose is a
     lerp of two individually clean poses through the middle of the chest. Only
     the drawn pose is what the player sees, so only the drawn pose is checked. */
  var ox = wT[0] - mRoot[12], oy = wT[1] - mRoot[13], oz = wT[2] - mRoot[14];
  var top = ho - BLADE_LEN * 0.5, sf = top > HILT_TOP + 0.01;   /* sf: staff */
  var pu = clearPush(
    ox*mRoot[0] + oy*mRoot[1] + oz*mRoot[2], oy,       /* hand, body-local */
    ox*mRoot[8] + oy*mRoot[9] + oz*mRoot[10],
    wB[0]*mRoot[0] + wB[1]*mRoot[1] + wB[2]*mRoot[2], wB[1],   /* blade dir */
    wB[0]*mRoot[8] + wB[1]*mRoot[9] + wB[2]*mRoot[10],
    /* the weapon runs from the POMMEL, behind the hand, to the tip — a staff is
       live (and long) both ways. Excluding the grip is what let the hilt through
       the chest on 8 of 12 single-saber attacks; see HILT_BOT. */
    sf ? -(top + BLADE_LEN) : -HILT_BOT, top + BLADE_LEN,
    sf ? 2 * WEAP_N : WEAP_N, ex, ez);
  /* ease the slide toward what clearPush asked for (see PUSH_EASE). The state is
     per ARM and survives across swings, so chaining carries the current slide
     instead of resetting it — the guard needs no slide at all, so a swing always
     starts and ends at zero and nothing pops at either edge. */
  if (pu > BODY_MAX) pu = BODY_MAX;
  var cur = pu2[pi], lim = PUSH_RATE * POSE_DT;
  pu -= (pu - cur) * Math.exp(-PUSH_EASE * POSE_DT);
  if (pu - cur > lim) pu = cur + lim; else if (cur - pu > lim) pu = cur - lim;
  if (plan > pu) pu = plan;           /* the PLANNED slide (see PROF_N) leads it */
  else if (pu > plan + REACT_MAX) pu = plan + REACT_MAX;
  pu2[pi] = pu;                       /* state tracks what was APPLIED, so the
                                         reactive term can only ever ADD to the
                                         plan, at a bounded rate, never lag it —
                                         and never by more than REACT_MAX, so the
                                         plan's zeroed ENDS cannot be undone */
  if (pu > 0.0002){                   /* body X/Z in world = mRoot columns 0 / 2 */
    var pux = pu * ex, puz = pu * ez;
    wT[0] += pux*mRoot[0] + puz*mRoot[8];
    wT[1] += pux*mRoot[1] + puz*mRoot[9];
    wT[2] += pux*mRoot[2] + puz*mRoot[10];
  }
  M.xp(wS, mTorso, shx, SH_Y, 0);                      /* shoulder joint */
  M.xd(wP, mTorso, side * 0.30, -0.86, 0.44);          /* elbow pole: down-back */
  norm3(wP);
  solveIK(wS, wT, UARM, LARM, wP);
  setFrame(mU, wS[0], wS[1], wS[2], ikN[0], ikN[1], ikN[2],
    (wS[0] - ikE[0]) / UARM, (wS[1] - ikE[1]) / UARM, (wS[2] - ikE[2]) / UARM);
  setFrame(mF, ikE[0], ikE[1], ikE[2], ikN[0], ikN[1], ikN[2],
    (ikE[0] - ikH[0]) / LARM, (ikE[1] - ikH[1]) / LARM, (ikE[2] - ikH[2]) / LARM);
  /* hand: +Y is the blade; roll it about the blade by `tilt` */
  wQ[0] = wB[1]*ref[2] - wB[2]*ref[1];
  wQ[1] = wB[2]*ref[0] - wB[0]*ref[2];
  wQ[2] = wB[0]*ref[1] - wB[1]*ref[0];
  if (wQ[0]*wQ[0] + wQ[1]*wQ[1] + wQ[2]*wQ[2] < 1e-6){ wQ[0] = ikN[0]; wQ[1] = ikN[1]; wQ[2] = ikN[2]; }
  norm3(wQ);
  var c = Math.cos(tilt), s = Math.sin(tilt);
  var xx = wQ[0]*c + (wB[1]*wQ[2] - wB[2]*wQ[1])*s;
  var xy = wQ[1]*c + (wB[2]*wQ[0] - wB[0]*wQ[2])*s;
  var xz = wQ[2]*c + (wB[0]*wQ[1] - wB[1]*wQ[0])*s;
  setFrame(mH, ikH[0], ikH[1], ikH[2], xx, xy, xz, wB[0], wB[1], wB[2]);
}

function renderRig(r, pos, yaw){
  var GL = JK.GL, p = r.pose, a = r.arc;
  var dual = r.type === 'dual', staff = r.type === 'staff';
  var HO = (staff ? STAFF_TOP : HILT_TOP) + BLADE_LEN * 0.5;   /* hand -> blade middle */

  /* lunge: shift the DRAWN body along facing (visual only; fwd = (-sin,-cos)) */
  var lun = r.lunge;
  var px = pos[0] - Math.sin(yaw) * lun;
  var pz = pos[2] - Math.cos(yaw) * lun;

  /* --- ground shadow first (also guarantees frame starts non-additive) --- */
  var gx = px, gz = pz, gy = 0, dhx = 0, dhz = 0, e = 0.6;
  if (JK.Terrain && JK.Terrain.height){
    gy = JK.Terrain.height(gx, gz);
    dhx = (JK.Terrain.height(gx + e, gz) - JK.Terrain.height(gx - e, gz)) / (2 * e);
    dhz = (JK.Terrain.height(gx, gz + e) - JK.Terrain.height(gx, gz - e)) / (2 * e);
  }
  var alt = pos[1] - gy; if (alt < 0) alt = 0;
  var shs = 1 - alt * 0.22; if (shs < 0.35) shs = 0.35;   /* shrinks mid-air */
  M.ident(mS); M.tr(mS, gx, gy + 0.03, gz);
  M.rx(mS, -Math.atan(dhz)); M.rz(mS, Math.atan(dhx));    /* hug the slope */
  M.sc(mS, shs, 1, shs);
  GL.draw(MESH.shadow, mS, SHADOW_OPTS);

  /* --- hierarchy --- */
  M.ident(mRoot); M.tr(mRoot, px, pos[1], pz); M.ry(mRoot, yaw);

  M.copy(mPelv, mRoot); M.tr(mPelv, 0, HIP_Y + p.bob, 0);
  GL.draw(MESH.hips, mPelv, r.oPants);
  GL.draw(MESH.belt, mPelv, r.oBelt);

  M.copy(mTorso, mPelv); M.tr(mTorso, 0, PELV2TORSO, 0);
  M.ry(mTorso, p.twist); M.rx(mTorso, p.lean);
  GL.draw(MESH.torso, mTorso, r.oTunic);

  /* head */
  M.copy(mA, mTorso); M.tr(mA, 0, NECK_Y, 0); M.rx(mA, p.head);
  GL.draw(MESH.head, mA, r.oSkin);
  GL.draw(MESH.hair, mA, r.oHair);

  /* arc influence + swing-plane reference for the blade roll */
  var arcOn = a.live && (a.wIn * a.wOut) > 0.001;
  if (arcOn){
    M.xd(wR, mRoot, a.n[0], a.n[1], a.n[2]);
    norm3(wR);
  }

  /* left arm (mirrored arc when dual) */
  fkArm(mUL, mFL, mHL, -SH_X, -p.sprL, p.syL, p.aSwL, p.elbL, p.wrL, 0);
  if (arcOn && a.mirror){
    M.xd(wR, mRoot, -a.n[0], a.n[1], a.n[2]); norm3(wR);   /* mirrored plane */
    M.xp(blC, mRoot, -a.pivot[0], a.pivot[1], a.pivot[2]); /* arcLerp centre */
    ikArm(mUL, mFL, mHL, -SH_X, a.mL, a.dL, a.snapML, a.snapDL,
          -a.tilt, a.wIn, a.wOut, -1, wR, HILT_TOP + BLADE_LEN * 0.5, -a.escX, a.escZ,
          a.pu, 1, profAt(a.profL, a.t, a.profT));
    M.xd(wR, mRoot, a.n[0], a.n[1], a.n[2]); norm3(wR);
  }
  GL.draw(MESH.uarm, mUL, r.oTunic);
  GL.draw(MESH.larm, mFL, r.oTunic);
  GL.draw(MESH.hand, mHL, r.oSkin);
  if (dual) GL.draw(MESH.hilt, mHL, null);

  /* left leg */
  M.copy(mA, mPelv); M.tr(mA, -HIP_X, HIP_DY, 0); M.rx(mA, p.lSwL);
  GL.draw(MESH.uleg, mA, r.oPants);
  M.tr(mA, 0, -ULEG, 0); M.rx(mA, p.kneeL);
  GL.draw(MESH.lleg, mA, r.oPants);
  M.tr(mA, 0, -LLEG, 0); M.rx(mA, -(p.lSwL + p.kneeL) * 0.6);  /* fake ankle */
  GL.draw(MESH.boot, mA, r.oBoots);

  /* right leg */
  M.copy(mA, mPelv); M.tr(mA, HIP_X, HIP_DY, 0); M.rx(mA, p.lSwR);
  GL.draw(MESH.uleg, mA, r.oPants);
  M.tr(mA, 0, -ULEG, 0); M.rx(mA, p.kneeR);
  GL.draw(MESH.lleg, mA, r.oPants);
  M.tr(mA, 0, -LLEG, 0); M.rx(mA, -(p.lSwR + p.kneeR) * 0.6);
  GL.draw(MESH.boot, mA, r.oBoots);

  /* right (saber) arm */
  fkArm(mUR, mFR, mHR, SH_X, p.sprR, p.syR, p.aSwR, p.elbR, p.wrist, p.wrr);
  if (arcOn) M.xp(blC, mRoot, a.pivot[0], a.pivot[1], a.pivot[2]);
  if (arcOn)
    ikArm(mUR, mFR, mHR, SH_X, a.mR, a.dR, a.snapM, a.snapD,
          a.tilt, a.wIn, a.wOut, 1, wR, HO, a.escX, a.escZ, a.pu, 0,
          profAt(a.prof, a.t, a.profT));
  GL.draw(MESH.uarm, mUR, r.oTunic);
  GL.draw(MESH.larm, mFR, r.oTunic);
  GL.draw(MESH.hand, mHR, r.oSkin);
  GL.draw(staff ? MESH.hiltS : MESH.hilt, mHR, null);

  /* --- remember the effective hand poses (body-local) so the next arc can
     blend out of exactly what we are drawing right now --- */
  var cy = Math.cos(yaw), sy = Math.sin(yaw), dx, dy, dz;
  dx = mHR[12] + mHR[4]*HO - px; dy = mHR[13] + mHR[5]*HO - pos[1];
  dz = mHR[14] + mHR[6]*HO - pz;
  a.curM[0] = cy*dx - sy*dz; a.curM[1] = dy; a.curM[2] = sy*dx + cy*dz;
  a.curD[0] = cy*mHR[4] - sy*mHR[6]; a.curD[1] = mHR[5];
  a.curD[2] = sy*mHR[4] + cy*mHR[6];
  dx = mHL[12] + mHL[4]*HO - px; dy = mHL[13] + mHL[5]*HO - pos[1];
  dz = mHL[14] + mHL[6]*HO - pz;
  a.curML[0] = cy*dx - sy*dz; a.curML[1] = dy; a.curML[2] = sy*dx + cy*dz;
  a.curDL[0] = cy*mHL[4] - sy*mHL[6]; a.curDL[1] = mHL[5];
  a.curDL[2] = sy*mHL[4] + cy*mHL[6];
  a.hasCur = true; a.snapAge = 0;

  /* --- world blade ends for combat (valid every frame, on or off) --- */
  var b0 = r.blades[0], b1 = r.blades.length > 1 ? r.blades[1] : null;
  if (staff){
    M.xp(b0.base, mHR, 0, STAFF_TOP, 0);
    M.xp(b0.tip,  mHR, 0, STAFF_TOP + BLADE_LEN, 0);
    if (b1){
      M.xp(b1.base, mHR, 0, -STAFF_TOP, 0);
      M.xp(b1.tip,  mHR, 0, -STAFF_TOP - BLADE_LEN, 0);
    }
  } else {
    M.xp(b0.base, mHR, 0, HILT_TOP, 0);
    M.xp(b0.tip,  mHR, 0, HILT_TOP + BLADE_LEN, 0);
    if (dual && b1){
      M.xp(b1.base, mHL, 0, HILT_TOP, 0);
      M.xp(b1.tip,  mHL, 0, HILT_TOP + BLADE_LEN, 0);
    }
  }

  /* --- blade glow: always the LAST draws of the rig. Additive shells first,
     opaque cores LAST (final core draw restores blend/depthMask state). --- */
  if (r.saberOn){
    if (staff){
      GL.draw(MESH.bladeU.g2, mHR, r.oGlow2);
      GL.draw(MESH.bladeD.g2, mHR, r.oGlow2);
      GL.draw(MESH.bladeU.g1, mHR, r.oGlow1);
      GL.draw(MESH.bladeD.g1, mHR, r.oGlow1);
      GL.draw(MESH.bladeU.core, mHR, CORE_OPTS);
      GL.draw(MESH.bladeD.core, mHR, CORE_OPTS);
    } else {
      GL.draw(MESH.blade.g2, mHR, r.oGlow2);          /* faint outer shell */
      if (dual) GL.draw(MESH.blade.g2, mHL, r.oGlow2);
      GL.draw(MESH.blade.g1, mHR, r.oGlow1);          /* hot inner shell */
      if (dual) GL.draw(MESH.blade.g1, mHL, r.oGlow1);
      GL.draw(MESH.blade.core, mHR, CORE_OPTS);
      if (dual) GL.draw(MESH.blade.core, mHL, CORE_OPTS);
    }
  }
}

function instanceDraw(pos, yaw, anim, phaseInfo){
  if (phaseInfo){
    this.advance(phaseInfo.dt || 0, phaseInfo.t || 0, anim || 'idle',
      phaseInfo.speed !== undefined ? phaseInfo.speed : (phaseInfo.speed2D || 0));
  }
  renderRig(this, pos, yaw);
}

/* ---------------- factory ---------------- */
function col3(a, d){
  var o = new Float32Array(3);
  a = a || d;
  o[0] = a[0]; o[1] = a[1]; o[2] = a[2];
  return o;
}

function create(palette){
  buildMeshes();
  var pal = palette || {};
  var rig = {
    pose: { bob: 0, lean: 0.04, twist: 0, head: 0,
      lSwL: 0.05, lSwR: -0.05, kneeL: -0.09, kneeR: -0.09,
      aSwL: 0.10, aSwR: 0.30, sprL: 0.10, sprR: 0.14,
      elbL: 0.28, elbR: 0.45, wrist: -1.65,
      syL: 0, syR: 0, wrL: 0, wrr: 0 },
    phase: 0,
    swingT: -1,
    lunge: 0,
    type: 'single',
    arc: {
      live: false, active: false, t: 0, dur: SWING_DUR,
      pivot: new Float32Array([0.06, 1.34, -0.04]), radius: 1.02,
      u: new Float32Array(3), v: new Float32Array(3), n: new Float32Array(3),
      a0: 0, a1: 1.6, tilt: 0, windup: 0.28, recover: 0.24, escX: 1, escZ: 0,
      lungeAmt: 0, lungeCur: 0, lungeCarry: 0, pu: new Float32Array(2),
      prof: new Float32Array(PROF_N + 1), profL: new Float32Array(PROF_N + 1),
      profT: SWING_DUR + BLEND_OUT,
      mirror: false, name: '', blendIn: BLEND_IN,
      wIn: 0, wOut: 0, twist: 0, lean: 0, snapAge: 99,
      hR: new Float32Array(3), dR: new Float32Array([0, 1, 0]), mR: new Float32Array(3),
      hL: new Float32Array(3), dL: new Float32Array([0, 1, 0]), mL: new Float32Array(3),
      snapD: new Float32Array([0, 1, 0]), snapDL: new Float32Array([0, 1, 0]),
      snapM: new Float32Array(3), snapML: new Float32Array(3),
      curM: new Float32Array(3), curD: new Float32Array([0, 1, 0]),
      curML: new Float32Array(3), curDL: new Float32Array([0, 1, 0]),
      hasCur: false
    },
    saberOn: true,
    saberCol: col3(null, [0.2, 0.9, 0.3]),
    basePos: new Float32Array(3),
    tipPos: new Float32Array(3),
    advance: advance,
    draw: instanceDraw,
    startSwing: startSwing,
    playArc: playArc,
    playSwing: playSwing,
    swingPhase: swingPhase,
    setType: setType,
    setSaber: setSaber
  };
  setBasis(rig.arc, -1, 0, 0);
  /* blades: entries preallocated once; blades[0] aliases basePos/tipPos and the
     array is mutated in place by setType (identity-stable for consumers). */
  rig.blades = [{ base: rig.basePos, tip: rig.tipPos }];
  rig._blade2 = { base: new Float32Array(3), tip: new Float32Array(3) };
  /* per-instance draw opts, allocated once (tint arrays live for rig lifetime) */
  rig.oSkin  = { tint: col3(pal.skin,  DEF_PAL.skin)  };
  rig.oTunic = { tint: col3(pal.tunic, DEF_PAL.tunic) };
  rig.oPants = { tint: col3(pal.pants, DEF_PAL.pants) };
  rig.oBoots = { tint: col3(pal.boots, DEF_PAL.boots) };
  rig.oBelt  = { tint: col3(pal.belt,  DEF_PAL.belt)  };
  rig.oHair  = { tint: col3(pal.hair,  DEF_PAL.hair)  };
  rig.oGlow1 = { emissive: 1, nofog: true, additive: true, alpha: 0.55, tint: rig.saberCol };
  rig.oGlow2 = { emissive: 1, nofog: true, additive: true, alpha: 0.25, tint: rig.saberCol };
  return rig;
}

/* ---------------- module = player instance bridge ---------------- */
var player = null;

JK.Rig = {
  create: create,
  SWING_DUR: SWING_DUR,
  DEFAULT_ARC: DEFAULT_ARC,
  player: null,
  pose: null,
  tipPos: null,
  basePos: null,
  blades: null,

  init: function(){
    buildMeshes();
    player = create(null);
    this.player = player;
    this.pose = player.pose;
    this.tipPos = player.tipPos;
    this.basePos = player.basePos;
    this.blades = player.blades;      /* identity-stable: setType mutates in place */
  },

  update: function(dt, t){
    if (!player) return;
    var P = JK.Player;
    var anim = 'idle', sp = 0;
    if (P){
      anim = P.anim || 'idle';
      sp = P.speed2D || 0;
      /* legacy attack path — ONLY while JK.Sabers isn't built/loaded
         (iteration 2: Sabers owns attack consumption + swing selection). */
      if (!JK.Sabers){
        if (P.attackQueued){
          if (player.playArc(DEFAULT_ARC)) P.attackQueued = false;
        } else if (P.attackQueued === undefined &&
                   JK.Input && JK.Input.state && JK.Input.state.attack){
          player.startSwing();
        }
      }
    }
    player.advance(dt, t, anim, sp);
  },

  draw: function(){
    if (!player || !JK.Player || !JK.Player.pos) return;
    renderRig(player, JK.Player.pos, JK.Player.yaw || 0);
  },

  setSaber: function(rgb, on){ if (player) player.setSaber(rgb, on); },
  setType: function(type){ if (player) player.setType(type); },
  startSwing: function(){ return player ? player.startSwing() : false; },
  playArc: function(def){ return player ? player.playArc(def) : false; },
  playSwing: function(def){ return player ? player.playSwing(def) : false; },
  swingPhase: function(){ return player ? player.swingPhase() : -1; }
};
})();

/* ===== 50_sabers.js ===== */
/* JK.Sabers — stance + attack system (the Jedi Outcast heart). Owner: sabers agent.
 *
 * Three stances (JK.Player.stanceIdx): 0 LIGHT / 1 MEDIUM / 2 STRONG.
 * Twelve hand-authored ARCS (4 per stance), picked AT PRESS by stick direction:
 * neutral / forward (moveY>0.4, wins ties) / left (moveX<-0.4) / right (moveX>0.4).
 *
 * EXPORTS (contract — see CONVENTIONS.md "ITERATION 2 CONTRACTS"):
 *   STANCES        [{name,color,dmg,dur,knock,chainAt,act0,act1}] (act* = dmg window)
 *   stanceName(i)  -> 'LIGHT'|'MEDIUM'|'STRONG'
 *   active()       -> true during damage-active frames of a swing
 *   sweeps         array, one entry PER BLADE while active: {pb,pt,cb,ct,dmg,knock,name}
 *                  pb/pt = prev base/tip, cb/ct = cur base/tip — COPIES (never aliases
 *                  of rig.blades). First active frame: prev == cur (no teleport sweep).
 *   sweep          sweeps[0] or null
 *   attackName     name of current/last swing ('' before first)
 *   attackId       int, increments once per accepted swing (Combat dedupes on it)
 *   DEFS           DEFS[stance][dir] arcDef — feed straight to rig.playArc(def)
 *                  (bots may reuse these; they are plain data, never mutated)
 *
 * Consumes JK.Player.attackQueued; drives the player rig via rig.playArc (see the
 * SWING REWORK CONTRACT). Updates #stanceTag text + color on stance change.
 *
 * ===================== HOW THE TWELVE ARE AUTHORED =====================
 * Per the SWING REWORK CONTRACT nobody hand-writes joint angles: an attack is the
 * BLADE'S ARC and 40_character.js solves the arm to match. What a player actually
 * SEES is where the blade TIP travels, so that is what this table states: the tip's
 * start and end direction from the chest pivot, in degrees:
 *
 *      tip(elevation, azimuth)   elevation +up / -down,  azimuth + = character's LEFT
 *      so tip(38, 40) = high on the left, tip(-40,-48) = low on the right,
 *         tip(0, -52) = straight out to the right at chest height.
 *
 * arcFromTips() turns that pair into the (axis, a0, a1) the engine wants. It has to
 * undo two engine behaviours to land the tip where the table says:
 *   - the tip TRAILS the arc angle by ~6 deg (the tip is a blend of the arm's radial
 *     vector and the blade, and the blade LEADs the radial by 0.26 rad), and
 *   - the strike starts BACK_FRAC (7%) of the arc BEHIND a0 (the anticipation).
 * Everything else (pivot, radius, windup/recover, lunge) is per stance, overridden
 * per attack where the attack's identity needs it.
 *
 * ===================== TWO RULES THE TABLE MUST OBEY =====================
 * 1. THE STRIKE MUST BE THE FASTEST THING ON SCREEN. The blade starts every swing
 *    at the idle guard (tip ~elevation 20, azimuth -7 from the pivot) and the engine
 *    blends guard -> a0 over the wind-up. That blend is real, visible motion: if the
 *    cocked pose is far from the guard and `windup` is short, the COCK-BACK is faster
 *    than the cut and the attack reads backwards (a flinch, then a slow push). Keep
 *      coilFromGuard(deg) / (windup * dur)  well under the strike's angular rate.
 *    Measured guard->coil distances are noted per attack below; none exceed 47 deg,
 *    and every stance now spends >= 0.08 s winding up.

 *      LIGHT   100-102 deg   28-32 m/s   wind-up 0.33-0.82 of the strike

/* ================= arc authoring helpers (run ONCE at load) ================ */
var DEG = Math.PI / 180;
var TIP_LAG = 0.105;   /* rad the tip trails the arc angle (blade LEAD vs radial) */
var BACK    = 0.07;    /* engine's anticipation overshoot, fraction of the arc     */

function basis(x, y, z){

var pendingDir = 0, wasQueued = false;
var lastStance = -1, tagEl = null;

  if (my > 0.4) return 1;          /* forward wins ties over sides */
  if (mx < -0.4) return 2;
  if (mx > 0.4) return 3;

  var R = JK.Rig;

  var p = R.player;
  if (p && p.playArc) return p.playArc(d) !== false;        /* contract instance API */
  if (R.playArc) return R.playArc(d) !== false;             /* module bridge */
  if (p && p.playSwing) return p.playSwing(d) !== false;    /* degraded: keyframe rig */
  if (R.playSwing) return R.playSwing(d) !== false;
  if (R.startSwing){ R.startSwing(); return true; }         /* degraded: fixed slash */
  return false;

  var R = JK.Rig, p = R && R.player;

  if (R && R.swingPhase) return R.swingPhase();
  return -2;

  var R = JK.Rig;
  if (!R) return null;
  var p = R.player;

/* ================= module =================================================== */

  sweep: null,

  stanceName: function(i){

    if (si !== lastStance){ lastStance = si; tagStance(si); }

 *   lastHit — {dmg, t, name} updated on every PLAYER-sourced hit (Ui reads).

      p.life = p.max = 0.22 + 0.35 * r2;
      p.size = 0.028 + 0.04 * Math.random();
      p.grav = 10; p.spin = 14 * (r1 - 0.5); p.bounce = 0; p.tw = 0;
    }
  }
}

function updateParticles(dt){
  var i = 0;
  while (i < liveN){
    var p = parts[i];
    p.life -= dt;
    if (p.life <= 0){                     /* kill: swap-with-last, retest slot */
      liveN--;
      parts[i] = parts[liveN];
      parts[liveN] = p;
      continue;
    }
    p.vy -= p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.bounce && p.vy < 0){            /* shards bounce off the dunes */
      var gy = groundY(p.x, p.z) + p.size * 0.5;
      if (p.y < gy){
        p.y = gy;
        p.vy *= -0.42; p.vx *= 0.72; p.vz *= 0.72;
      }
    }
    i++;
  }
}

/* BATCHING NOTE — why this is one draw call and why it looks identical.
 *
 * This loop used to issue one JK.GL.draw per live particle: a 40-spark impact
 * cost 40 driver calls, an explosion 44+, and two overlapping bursts pushed the
 * frame past 150 consecutive draws of the SAME unit cube. On iOS Safari every
 * WebGL call crosses a process boundary, so that call count — not the 12
 * triangles behind each one — was the measured draw-call spike.
 *
 * Now every particle is CPU-transformed into one shared vertex buffer and the
 * whole pool goes out as a single drawElements. Three things make the pixels
 * come out the same rather than merely similar:
 *
 * 1. emissive = 1 makes the shader's lit term drop out entirely
 *    (vCol = mix(lit, base, 1) = base), so particle NORMALS are never read. They
 *    are filled in once at build time and this loop never touches them again, and
 *    the cube can be 8 shared corners / 12 triangles instead of 24 split verts —
 *    same silhouette, same 6 faces (CULL_FACE is off, so front and back faces
 *    both accumulate exactly as before).
 * 2. nofog = true forces the fog factor to exactly 1, so the shader reduces to
 *    dst += aC * uTint * uAlpha under blendFunc(SRC_ALPHA, ONE). Per-particle
 *    tint and per-particle fade therefore multiply into the vertex colour with
 *    no approximation: aC = rgb*alpha, uTint = 1, uAlpha = 1.
 * 3. Additive blending with depthMask(false) is order-independent, and the depth
 *    TEST is per fragment, so collapsing the draws cannot change occlusion.
 *
 * The model matrix work is replaced by three rotated half-axis vectors: with
 * MTX = T * Ry(a) * Rx(0.7a) * S the eight corners are just
 * pos +/- e0 +/- e1 +/- e2 where e0..e2 are the columns of Ry*Rx scaled by
 * size/2 — 4 trig calls and ~30 multiplies per particle, cheaper than the four
 * 4x4 matrix multiplies it replaces, let alone the driver call.
 *
 * MEASURED (driver entry points stubbed to no-ops so this is CPU only, best of
 * 5 x 300 calls, zero heap growth in both):
 *          40 particles   120 particles   256 (pool full)
 *   before   0.0233 ms      0.0613 ms       0.1270 ms
 *   after    0.0057 ms      0.0143 ms       0.0240 ms
 * Do NOT quote a whole-game ms/frame delta for this: at these magnitudes it is
 * far inside the run-to-run spread of gate.js (1.0-1.3 ms either way). What is
 * reproducible is the line above, the draw count (201 -> 79 in a hand-composed
 * 120-particle frame) and the pixels: a seeded 124-particle burst of all three
 * kinds renders BIT-IDENTICAL to the per-particle path, 0 of 329160 pixels
 * different, and still 0 with the pool saturated at 256. */
var CUBE_TRI = [0,1,3, 0,3,2,   4,5,7, 4,7,6,   0,1,5, 0,5,4,
                2,3,7, 2,7,6,   0,2,6, 0,6,4,   1,3,7, 1,7,5];

function buildParticleBatch(){
  var idx = new Uint16Array(PMAX * 36), i, j;
  for (i = 0; i < PMAX; i++){
    var vb = i * 8, ib = i * 36;
    for (j = 0; j < 36; j++) idx[ib + j] = vb + CUBE_TRI[j];
  }
  pBatch = JK.GL.dynamic(PMAX * 8, { idx: idx });
  var v = pBatch.v;                       /* normals: unused (emissive), set once */
  for (i = 3; i < v.length; i += 9){ v[i] = 0; v[i+1] = 1; v[i+2] = 0; }
}

function drawParticles(){
  if (liveN === 0){ JK.GL.reset(pBatch); return; }  /* never hold a stale count */
  var V = pBatch.v, o = 0;                /* interleaved: pos at o, colour at o+6 */
  for (var i = 0; i < liveN; i++){
    var p = parts[i];
    var k = p.life / p.max;               /* 1 -> 0 over lifetime */
    var age = p.max - p.life;
    var s = p.size * (0.35 + 0.65 * k) * 0.5;   /* half-extent: shrinks as it dies */
    var a = k;
    if (p.tw) a *= 0.55 + 0.45 * Math.sin(age * 26 + p.ph);
    var e0x, e0y, e0z, e1x, e1y, e1z, e2x, e2y, e2z;
    if (p.spin !== 0){                    /* columns of Ry(an)*Rx(bn), scaled */
      var an = age * p.spin, bn = an * 0.7;
      var ca = Math.cos(an), sa = Math.sin(an);
      var cbn = Math.cos(bn), sbn = Math.sin(bn);
      e0x =  ca * s;        e0y = 0;         e0z = -sa * s;
      e1x =  sa * sbn * s;  e1y = cbn * s;   e1z =  ca * sbn * s;
      e2x =  sa * cbn * s;  e2y = -sbn * s;  e2z =  ca * cbn * s;
    } else {
      e0x = s; e0y = 0; e0z = 0;
      e1x = 0; e1y = s; e1z = 0;
      e2x = 0; e2y = 0; e2z = s;
    }
    var px = p.x, py = p.y, pz = p.z;
    var cr = p.r * a, cg = p.g * a, cbl = p.b * a;
    for (var q = 0; q < 8; q++){          /* sign bits: 1=+x, 2=+y, 4=+z */
      var sx = (q & 1) ? 1 : -1, sy = (q & 2) ? 1 : -1, sz = (q & 4) ? 1 : -1;
      V[o]     = px + sx * e0x + sy * e1x + sz * e2x;
      V[o + 1] = py + sx * e0y + sy * e1y + sz * e2y;
      V[o + 2] = pz + sx * e0z + sy * e1z + sz * e2z;
      V[o + 6] = cr; V[o + 7] = cg; V[o + 8] = cbl;   /* o+3..o+5: normal, fixed */
      o += 9;
    }
  }
  pBatch.n  = liveN * 8;
  pBatch.ni = liveN * 36;
  JK.GL.draw(pBatch, null, FXO);          /* ONE draw call for the whole pool */
}

/* ============================ JK.Combat ==================================== */
var ents = [];
var nowT = 0;
var DIR  = new Float32Array(3);           /* scratch: hit direction */
var HITP = new Float32Array(3);           /* scratch: impact point on blade */
var lastS = 0;                            /* stash: blade param of closest point */

function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

/* Exact closest-distance^2 between the blade segment b + s*d (s in 0..1) and
 * the entity's VERTICAL capsule axis (x=cx, z=cz, y in y0..y1). Standard
 * two-segment closest-point (Ericson 5.1.9) specialised for d2 = (0,y1-y0,0).
 * Stashes the blade parameter in lastS so the caller can place sparks. */
function segCapDistSq(bx, by, bz, dx, dy, dz, cx, y0, y1, cz){
  var rx = bx - cx, ry = by - y0, rz = bz - cz;
  var a = dx * dx + dy * dy + dz * dz;    /* blade len^2 */
  var ey = y1 - y0;
  var e = ey * ey;                        /* axis len^2 */
  var f = ey * ry;
  var c = dx * rx + dy * ry + dz * rz;
  var s, u;
  if (a <= 1e-9){ s = 0; u = e > 1e-9 ? clamp01(f / e) : 0; }
  else if (e <= 1e-9){ u = 0; s = clamp01(-c / a); }
  else {
    var b2 = dy * ey;                     /* dot(blade, axis) */
    var den = a * e - b2 * b2;
    s = den > 1e-9 ? clamp01((b2 * f - c * e) / den) : 0;
    u = (b2 * s + f) / e;
    if (u < 0){ u = 0; s = clamp01(-c / a); }
    else if (u > 1){ u = 1; s = clamp01((b2 - c) / a); }
  }
  lastS = s;
  var wx = bx + dx * s - cx;
  var wy = by + dy * s - (y0 + ey * u);
  var wz = bz + dz * s - cz;
  return wx * wx + wy * wy + wz * wz;
}

/* TUNNELING NOTE (why NT=5 slices, and why exact segments beat K points):
 * Worst case: a STRONG swing tip covers ~3 m in one clamped frame (tip radius
 * ~1.9 m from the torso pivot, peak ~12 rad/s arc, dt clamp 0.05 s -> ~3 m of
 * tip travel between prev and cur). We lerp the whole blade segment across
 * NT=5 time slices (u = 0, .25, .5, .75, 1 between prev and cur = prev + cur
 * + 3 interpolated steps, as the contract asks) and run an EXACT segment-vs-
 * vertical-capsule distance test per slice. The exact segment test is the
 * K->infinity limit of "sample K points along the blade" at roughly the cost
 * of K=2, so there are NO along-blade gaps at all; the only gap left is
 * BETWEEN time slices: at most 3/4 = 0.75 m of tip travel, i.e. any point of
 * the true swept surface is within 0.375 m of a tested slice. The hit
 * threshold for a training droid is 0.4 (droid) + 0.12 (blade) = 0.52 m >
 * 0.375 m, so a 0.4 m-radius droid CANNOT tunnel through a STRONG swing at
 * 30 fps — only grazes shallower than ~0.15 m can slip, which is invisible. */
function hitTest(sweep, attackId, attackerTeam, channel){
  if (!sweep || !sweep.cb || !sweep.ct) return 0;
  var cb = sweep.cb, ct = sweep.ct;
  var pb = sweep.pb || cb, pt = sweep.pt || ct;
  var key = (channel | 0) * CHAN_MUL + (attackId | 0);
  var dmg = sweep.dmg !== undefined ? sweep.dmg : 10;
  var hits = 0, i, j;
  /* blade travel this frame (midpoint motion) -> hit direction */
  var mvx = (cb[0] + ct[0] - pb[0] - pt[0]) * 0.5;
  var mvy = (cb[1] + ct[1] - pb[1] - pt[1]) * 0.5;
  var mvz = (cb[2] + ct[2] - pb[2] - pt[2]) * 0.5;

  for (i = 0; i < ents.length; i++){
    var en = ents[i];
    if (!en || !en.pos || en.team === attackerTeam || en.hp <= 0) continue;
    var ring = en._hk;                    /* per-entity ring of recent hit keys */
    if (!ring){ ring = en._hk = [-1, -1, -1, -1, -1, -1, -1, -1]; en._hki = 0; }
    var dup = false;
    for (j = 0; j < 8; j++) if (ring[j] === key){ dup = true; break; }
    if (dup) continue;                    /* already hit by this swing */

    /* coarse sphere reject: hull of {pb,pt,cb,ct} stays within ~4.4 m of cb
     * (blade 1.37 + 3 m travel), +0.52 hit slack -> 6 covers it with margin */
    var ecx = en.pos[0], ecy = en.pos[1] + en.height * 0.5, ecz = en.pos[2];
    var reach = 6.0 + en.radius + en.height * 0.5;
    var ddx = ecx - cb[0], ddy = ecy - cb[1], ddz = ecz - cb[2];
    if (ddx * ddx + ddy * ddy + ddz * ddz > reach * reach) continue;

    var rr = en.radius + BLADE_R;
    rr *= rr;
    var y0 = en.pos[1], y1 = y0 + en.height;
    for (j = 0; j < NT; j++){
      var u = j / (NT - 1);
      var bx = pb[0] + (cb[0] - pb[0]) * u,
          by = pb[1] + (cb[1] - pb[1]) * u,
          bz = pb[2] + (cb[2] - pb[2]) * u;
      var tx = pt[0] + (ct[0] - pt[0]) * u,
          ty = pt[1] + (ct[1] - pt[1]) * u,
          tz = pt[2] + (ct[2] - pt[2]) * u;
      if (segCapDistSq(bx, by, bz, tx - bx, ty - by, tz - bz,
                       ecx, y0, y1, ecz) <= rr){
        HITP[0] = bx + (tx - bx) * lastS; /* impact = closest blade point */
        HITP[1] = by + (ty - by) * lastS;
        HITP[2] = bz + (tz - bz) * lastS;
        var ml = Math.sqrt(mvx * mvx + mvy * mvy + mvz * mvz);
        if (ml > 0.03){ DIR[0] = mvx / ml; DIR[1] = mvy / ml; DIR[2] = mvz / ml; }
        else {                            /* 1st active frame: prev==cur */
          var fx = ecx - bx, fz = ecz - bz;
          var fl = Math.sqrt(fx * fx + fz * fz) || 1;
          DIR[0] = fx / fl; DIR[1] = 0; DIR[2] = fz / fl;
        }
        ring[en._hki & 7] = key;
        en._hki = (en._hki + 1) & 7;
        Combat.hitKnock = sweep.knock || 0;
        if (typeof en.onHit === 'function') en.onHit(dmg, DIR, 'saber', HITP);
        if (attackerTeam === 'player'){
          Combat.lastHit.dmg = dmg;
          Combat.lastHit.t = nowT;
          Combat.lastHit.name = sweep.name || '';
        }
        hits++;
        break;                            /* one hit per entity per call */
      }
    }
  }
  return hits;
}

var Combat = JK.Combat = {
  ents: ents,                             /* read-only by convention */
  swingId: 0,
  hitKnock: 0,
  hitPos: HITP,
  lastHit: { dmg: 0, t: -1e9, name: '' },
  hitTest: hitTest,

  register: function(ent){
    if (!ent || ents.indexOf(ent) >= 0) return ent;
    if (!ent._hk){ ent._hk = [-1, -1, -1, -1, -1, -1, -1, -1]; ent._hki = 0; }
    ents.push(ent);
    return ent;
  },

  unregister: function(ent){
    var i = ents.indexOf(ent);
    if (i >= 0){ ents[i] = ents[ents.length - 1]; ents.pop(); }
  },

  /* Called by JK.Fx.update (Combat is not in main's SYSTEMS list). Safe to
   * call while the sabers agent is mid-build: sweeps may be missing/empty. */
  update: function(dt, t){
    nowT = t;
    var S = JK.Sabers;
    if (!S) return;
    if (typeof S.attackId === 'number') Combat.swingId = S.attackId;
    var sw = S.sweeps;
    if (!sw || !sw.length) return;
    if (S.active && !S.active()) return;  /* trust Sabers' damage window */
    for (var i = 0; i < sw.length; i++)
      hitTest(sw[i], Combat.swingId, 'player', 0);
  }
};

/* ============================ training droids ============================== */
/* Star-Wars remote-trainer vibe: small grey box body with a glowing red eye
 * and an antenna, bobbing above a thin post. They never move or block. */
var droids = [];
var meshDroid = null, meshEye = null, meshPost = null;
var SPAWN_X = 0, SPAWN_Z = 6;             /* player spawn (30_player.js) */
/* distinct bearings around spawn (angle from +Z, dist m): ahead, ahead-right,
 * ahead-left of the spawn-facing (-Z) player, 11-13 m out */
var DROID_AT = [
  { a: Math.PI,         d: 11.0 },
  { a: Math.PI * 0.78,  d: 13.0 },
  { a: -Math.PI * 0.75, d: 12.0 }
];

var FT2    = new Float32Array([1, 1, 1]);
var FLASHO = { tint: FT2 };
var EYEO   = { emissive: 1 };
var BODYO  = {};                          /* shared, avoids GL.draw's opts||{} */
var SP3    = new Float32Array(3);         /* scratch position for fx spawns */

var TB = M.make();
function bb(sx, sy, sz, r, g, b, x, y, z){ /* baked-offset box */
  M.ident(TB); M.tr(TB, x, y, z);
  return JK.Geo.tf(JK.Geo.box(sx, sy, sz, r, g, b), TB);
}

function buildMeshes(){
  if (meshDroid) return;
  var G = JK.Geo, GL = JK.GL;
  buildParticleBatch();
  meshDroid = GL.mesh(G.merge([
    bb(0.34, 0.28, 0.34, 0.55, 0.57, 0.60, 0,  0.00,  0),     /* body */
    bb(0.22, 0.07, 0.22, 0.36, 0.38, 0.42, 0,  0.17,  0),     /* top cap */
    bb(0.22, 0.07, 0.22, 0.36, 0.38, 0.42, 0, -0.17,  0),     /* bottom cap */
    bb(0.022, 0.24, 0.022, 0.25, 0.26, 0.28, 0, 0.30, 0),     /* antenna */
    bb(0.055, 0.055, 0.055, 0.95, 0.35, 0.20, 0, 0.43, 0),    /* antenna tip */
    bb(0.05, 0.16, 0.20, 0.32, 0.34, 0.38,  0.195, 0, 0),     /* vent R */
    bb(0.05, 0.16, 0.20, 0.32, 0.34, 0.38, -0.195, 0, 0),     /* vent L */
    bb(0.11, 0.11, 0.035, 0.15, 0.15, 0.17, 0, 0.02, -0.175)  /* eye rim */
  ]));
  meshEye = GL.mesh(bb(0.055, 0.055, 0.03, 1, 0.18, 0.12, 0, 0.02, -0.195));
}

/* The posts never move and the terrain under them never changes, so bake all
 * three into ONE world-space static mesh: 3 draw calls -> 1, zero CPU cost.
 * Must run after buildDroids() (it needs their positions). */
function buildPostMesh(){
  var G = JK.Geo, list = [], i;
  for (i = 0; i < droids.length; i++){
    var x = droids[i].pos[0], z = droids[i].pos[2], gy = groundY(x, z);
    list.push(bb(0.07, 0.90, 0.07, 0.30, 0.27, 0.24, x, gy + 0.45,  z));  /* pole */
    list.push(bb(0.34, 0.07, 0.34, 0.26, 0.23, 0.20, x, gy + 0.035, z));  /* foot */
    list.push(bb(0.16, 0.04, 0.16, 0.38, 0.36, 0.33, x, gy + 0.92,  z));  /* plate */
  }
  meshPost = JK.GL.mesh(G.merge(list));
}

function droidHit(dmg, dir, kind, hitPos){
  var d = this;
  if (d.dead) return;
  d.hp -= dmg;
  d.flash = 1;
  /* wobble impulse: rotate the hit direction into droid-local, kick springs */
  var c = Math.cos(d.yaw), s = Math.sin(d.yaw);
  var lx = c * dir[0] - s * dir[2];
  var lz = s * dir[0] + c * dir[2];
  d.wvx += lz * 6;                        /* pitch away */
  d.wvz -= lx * 6;                        /* roll away */
  if (hitPos){ SP3[0] = hitPos[0]; SP3[1] = hitPos[1]; SP3[2] = hitPos[2]; }
  else { SP3[0] = d.pos[0]; SP3[1] = d.cy; SP3[2] = d.pos[2]; }
  Fx.sparks(SP3, 14, null);
  if (d.hp <= 0){                         /* boom: shards + fire, hide 3 s */
    d.hp = 0; d.dead = true; d.deadT = RESPAWN_T;
    SP3[0] = d.pos[0]; SP3[1] = d.cy; SP3[2] = d.pos[2];
    Fx.burst(SP3, 26, null);
    Fx.sparks(SP3, 18, null);
    if (JK.game) JK.game.kills++;
    if (JK.msg) JK.msg('TRAINING DROID DESTROYED', 1.4);
  }
}

function buildDroids(){
  if (droids.length) return;
  for (var i = 0; i < DROID_AT.length; i++){
    var x = SPAWN_X + Math.sin(DROID_AT[i].a) * DROID_AT[i].d;
    var z = SPAWN_Z + Math.cos(DROID_AT[i].a) * DROID_AT[i].d;
    var d = {
      /* --- JK.Combat entity contract --- */
      pos: [x, 0, z], radius: 0.4, height: 0.8,
      hp: DROID_HP, team: 'enemy', onHit: droidHit,
      /* --- droid internals --- */
      gy: 0, cy: 0, yaw: Math.atan2(-(SPAWN_X - x), -(SPAWN_Z - z)),
      ph: i * 2.1, sway: 0,
      wpx: 0, wvx: 0, wpz: 0, wvz: 0,     /* tilt springs (pitch/roll) */
      flash: 0, dead: false, deadT: 0
    };
    droids.push(d);
    Combat.register(d);
  }
}

function updateDroids(dt, t){
  for (var i = 0; i < droids.length; i++){
    var d = droids[i];
    d.gy = groundY(d.pos[0], d.pos[2]);
    if (d.dead){
      d.deadT -= dt;
      if (d.deadT <= 0){                  /* respawn with a shimmer */
        d.dead = false; d.hp = DROID_HP; d.flash = 0;
        d.wpx = d.wvx = d.wpz = d.wvz = 0;
        SP3[0] = d.pos[0]; SP3[1] = d.gy + HOVER; SP3[2] = d.pos[2];
        Fx.shimmer(SP3, 18, null);
      }
    }
    d.cy = d.gy + HOVER + Math.sin(t * 1.5 + d.ph) * 0.12;   /* hover bob */
    d.pos[1] = d.cy - d.height * 0.5;     /* capsule feet track the bob */
    d.sway = Math.sin(t * 0.8 + d.ph) * 0.18;
    /* damped tilt springs (kicked by droidHit) */
    d.wvx += (-26 * d.wpx - 4.5 * d.wvx) * dt; d.wpx += d.wvx * dt;
    d.wvz += (-26 * d.wpz - 4.5 * d.wvz) * dt; d.wpz += d.wvz * dt;
    if (d.flash > 0){ d.flash -= dt * 6; if (d.flash < 0) d.flash = 0; }
  }
}

function drawDroids(){
  var GL = JK.GL;
  GL.draw(meshPost, null, BODYO);         /* all three posts, one call */
  for (var i = 0; i < droids.length; i++){
    var d = droids[i];
    if (d.dead) continue;                 /* hidden while blown up */
    M.ident(MTX);
    M.tr(MTX, d.pos[0], d.cy, d.pos[2]);
    M.ry(MTX, d.yaw + d.sway);
    M.rx(MTX, d.wpx); M.rz(MTX, d.wpz);
    var o = BODYO;
    if (d.flash > 0){                     /* brief red tint on hit */
      FT2[0] = 1; FT2[1] = 1 - 0.78 * d.flash; FT2[2] = 1 - 0.78 * d.flash;
      o = FLASHO;
    }
    GL.draw(meshDroid, MTX, o);
    GL.draw(meshEye, MTX, EYEO);          /* glowing eye dot */
  }
}

/* ============================ JK.Fx module ================================= */
var Fx = JK.Fx = {
  sparks:  function(pos, n, color){ emit(pos, n || 12, color, 0); },
  burst:   function(pos, n, color){ emit(pos, n || 24, color, 1); },
  shimmer: function(pos, n, color){ emit(pos, n || 16, color, 2); },
  live:    function(){ return liveN; },   /* profiler / tests read this */

  init: function(){
    buildMeshes();
    buildDroids();                        /* registers 3 'enemy' entities */
    buildPostMesh();                      /* needs droid positions */
    liveN = 0;
  },

  update: function(dt, t){
    updateDroids(dt, t);                  /* capsules current before tests */
    Combat.update(dt, t);                 /* saber sweeps vs entities */
    updateParticles(dt);
  },

  /* No trailing "reset" draw: JK.GL.beginFrame now restores depthMask(true)
   * before clearing, so leaving GL in additive mode here is harmless. */
  draw: function(){
    if (!pBatch) return;
    drawDroids();                         /* opaque first */
    drawParticles();                      /* additive on top */
  }
};
})();

/* ===== 58_playerent.js ===== */
/* JK.Hero — registers the player as a JK.Combat entity so bots can hurt him,
 * and owns his health / knockback / death / respawn. Owner: core.
 *
 * Runs inside the 'Fx' slot's Combat pass indirectly: Combat.update() calls
 * ent.onHit(); this module only needs its own update() for regen + respawn, so
 * it is driven from 90_main's SYSTEMS list entry 'Hero'.
 *
 * Exposed:
 *   JK.Hero.ent      the registered entity (team 'player'), pos ALIASES
 *                    JK.Player.pos so it tracks the player with no copying.
 *   JK.Hero.hurt(dmg, dirX, dirY, dirZ, kind)  damage entry point for bots.
 *   JK.Hero.dead     bool
 *   JK.Hero.invuln   seconds of remaining spawn protection
 */
(function(){
'use strict';

var HP_MAX = 100;
var RESPAWN_T = 2.6;
var INVULN_T = 2.0;
var REGEN_DELAY = 6.0;      /* seconds without damage before health creeps back */
var REGEN_RATE = 4.0;       /* hp per second */

var dead = false, deadT = 0, invuln = 0, sinceHit = 99;
var ent = null, hpEl = null;
var flashT = 0;

function game(){ return JK.game || (JK.game = { hp: HP_MAX, hpMax: HP_MAX }); }

function hurt(dmg, dx, dy, dz, kind){
  var g = game();
  if (dead || invuln > 0 || !(dmg > 0)) return;
  g.hp -= dmg;
  sinceHit = 0;
  flashT = 0.22;
  /* knockback: blasters shove lightly, sabers/force shove hard */
  var k = kind === 'bolt' ? 1.6 : (kind === 'force' ? 7.0 : 4.0);
  if (JK.Player && JK.Player.impulse){
    var l = Math.sqrt((dx||0)*(dx||0) + (dz||0)*(dz||0)) || 1;
    JK.Player.impulse((dx||0)/l * k, (dy > 0 ? dy * k : 1.5), (dz||0)/l * k);
  }
  if (JK.Fx && JK.Fx.sparks && JK.Player){
    SP[0] = JK.Player.pos[0]; SP[1] = JK.Player.pos[1] + 1.1; SP[2] = JK.Player.pos[2];
    JK.Fx.sparks(SP, 8, RED);
  }
  if (g.hp <= 0){
    g.hp = 0;
    dead = true; deadT = RESPAWN_T;
    if (JK.msg) JK.msg('YOU HAVE FALLEN', 2.4);
    if (JK.Fx && JK.Fx.burst && JK.Player){
      SP[0] = JK.Player.pos[0]; SP[1] = JK.Player.pos[1] + 1.0; SP[2] = JK.Player.pos[2];
      JK.Fx.burst(SP, 26, RED);
    }
  }
}
var SP = [0, 0, 0];
var RED = [1.0, 0.25, 0.15];

function respawn(){
  var g = game();
  g.hp = g.hpMax || HP_MAX;
  if (g.forceMax) g.force = g.forceMax;
  dead = false; invuln = INVULN_T; sinceHit = 99;
  var P = JK.Player;
  if (P){
    P.pos[0] = 0; P.pos[2] = 6;
    P.pos[1] = (JK.Terrain && JK.Terrain.height) ? JK.Terrain.height(0, 6) : 0;
    P.vel[0] = P.vel[1] = P.vel[2] = 0;
    P.speedMul = 1;
  }
  if (JK.Fx && JK.Fx.shimmer && P){
    SP[0] = P.pos[0]; SP[1] = P.pos[1] + 1.0; SP[2] = P.pos[2];
    JK.Fx.shimmer(SP, 18, [0.6, 0.85, 1.0]);
  }
  if (JK.msg) JK.msg('THE FORCE SUSTAINS YOU', 1.6);
}

JK.Hero = {
  ent: null,
  dead: false,
  invuln: 0,
  hurt: hurt,

  init: function(){
    var g = game();
    g.hpMax = g.hpMax || HP_MAX;
    g.hp = g.hpMax;
    dead = false; deadT = 0; invuln = INVULN_T; sinceHit = 99; flashT = 0;
    hpEl = document.getElementById('hpFill');
    if (!JK.Player) return;
    ent = {
      pos: JK.Player.pos,            /* alias — tracks the player for free */
      radius: 0.55,
      height: 1.8,
      hp: g.hp,
      team: 'player',
      kind: 'hero',
      onHit: function(dmg, dir, kind){
        hurt(dmg, dir ? dir[0] : 0, dir ? dir[1] : 0, dir ? dir[2] : 0, kind);
        this.hp = game().hp;
      }
    };
    JK.Hero.ent = ent;
    if (JK.Combat && JK.Combat.register) JK.Combat.register(ent);
  },

  update: function(dt, t){
    var g = game();
    if (invuln > 0) invuln -= dt;
    if (flashT > 0) flashT -= dt;
    sinceHit += dt;
    if (dead){
      deadT -= dt;
      if (deadT <= 0) respawn();
    } else if (g.hp < g.hpMax && sinceHit > REGEN_DELAY){
      g.hp = Math.min(g.hpMax, g.hp + REGEN_RATE * dt);
    }
    if (ent) ent.hp = dead ? 0 : g.hp;
    JK.Hero.dead = dead;
    JK.Hero.invuln = invuln > 0 ? invuln : 0;
    /* the Ui module owns the bar width; we only tint on damage flash */
    if (hpEl){
      var want = flashT > 0 ? '#ff6a4a' : '';
      if (hpEl.style.filter !== (want ? 'brightness(1.6)' : ''))
        hpEl.style.filter = want ? 'brightness(1.6)' : '';
    }
  }
};
})();

/* ---------------- tiny DOM helpers ---------------- */
function mk(tag, cls, parent){
  var el = document.createElement(tag);
  if (cls) el.className = cls;
  if (parent) parent.appendChild(el);
  return el;
}
function clamp255(v){
  v = Math.round(v);
  if (!(v >= 0)) v = 0; else if (v > 255) v = 255;   /* !(>=0) also catches NaN */
  return v;
}
function stopOnly(e){ e.stopPropagation(); }
function eat(e){                       /* swallow: game never sees it, no ghost click */
  e.stopPropagation();
  if (e.cancelable) e.preventDefault();
}

/* Did this Touch actually land on el? Same guard as 20_input.js: an iOS event
 * can coalesce several new/moved/ended fingers into one changedTouches list,
 * so [0] may belong to the stick/look/ATK finger, not to us. */
function ownsTouch(el, t){
  var n = t.target;
  if (!n) return true;                 /* ancient UA without Touch.target */
  return n === el || !!(el.contains && el.contains(n));
}
function hasTouch(ts, id){
  if (id === null || !ts) return false;
  for (var i = 0; i < ts.length; i++) if (ts[i].identifier === id) return true;
  return false;
}

/* Block game-feeding events at the panel/button boundary. touchstart/touchmove
 * STOP here (input's document touchmove preventDefaults => would kill native
 * pan-y scroll; starts must never leak toward game zones). touchend/touchcancel
 * are NOT stopped — a coalesced end may carry ANOTHER finger's release that
 * 20_input.js's document touchEnd must see to clear its identifiers; letting
 * ends bubble is harmless because input ignores ids it never claimed. */
function shield(el){
  var i;
  var tev = ['touchstart', 'touchmove'];
  for (i = 0; i < tev.length; i++) el.addEventListener(tev[i], stopOnly, {passive:false});
  var mev = ['mousedown', 'mousemove', 'mouseup', 'click', 'wheel', 'keydown', 'keyup'];
  for (i = 0; i < mev.length; i++) el.addEventListener(mev[i], stopOnly, {passive:false});
}

/* iOS-safe tap. touchstart+touchend preventDefault kills the synthetic click
 * (no touchend+click double fire); the click handler is the desktop path, with
 * a time guard in case a non-cancelable touchend let a ghost click through.
 * The touch is latched by identifier so a coalesced event can't trigger us
 * with someone else's finger, and ends/cancels bubble on (see shield note). */
var GHOST_MS = 700;
function tap(el, fn){
  var tid = null, lastTouchT = 0;
  el.addEventListener('touchstart', function(e){
    eat(e);
    if (tid !== null) return;                  /* one finger owns the control */
    var ts = e.changedTouches;
    for (var i = 0; i < ts.length; i++){
      if (ownsTouch(el, ts[i])){ tid = ts[i].identifier; break; }
    }
    if (tid !== null) el.classList.add('dn');
  }, {passive:false});
  el.addEventListener('touchend', function(e){
    if (e.cancelable) e.preventDefault();      /* kill iOS synthetic click */
    if (!hasTouch(e.changedTouches, tid)) return;   /* not our finger */
    tid = null;
    lastTouchT = Date.now();
    el.classList.remove('dn');
    fn();
  }, {passive:false});
  el.addEventListener('touchcancel', function(e){
    if (!hasTouch(e.changedTouches, tid)) return;
    tid = null;
    lastTouchT = Date.now();
    el.classList.remove('dn');
  }, {passive:false});
  el.addEventListener('mousedown', function(e){ stopOnly(e); el.classList.add('dn'); });
  el.addEventListener('mouseup', function(e){ stopOnly(e); el.classList.remove('dn'); });
  el.addEventListener('click', function(e){
    eat(e);
    if (Date.now() - lastTouchT < GHOST_MS) return;  /* ghost click: already fired */
    fn();
  });
}

/* ---------------- rig bridge (defensive vs mid-build siblings) ----------------
 * Prefer the contract instance API (rig.setType/setSaber). The module-level
 * bridges in 40_character.js exist BEFORE Rig.init() and silently no-op while
 * their player slot is still null — report that as failure so the update()
 * retry loop actually retries (a rig without a 'player' slot is trusted). */
function rigSetType(t){
  var R = JK.Rig;
  if (!R) return false;
  if (R.player && R.player.setType){ R.player.setType(t); return true; }
  if (R.setType){ R.setType(t); return R.player !== null; }
  return false;
}
function rigSetSaber(f){
  var R = JK.Rig;
  if (!R) return false;
  if (R.player && R.player.setSaber){ R.player.setSaber(f); return true; }
  if (R.setSaber){ R.setSaber(f); return R.player !== null; }
  return false;
}

/* ---------------- apply + persist ---------------- */

      Math.round(cur[1] / 255 * 1000) / 1000,
      Math.round(cur[2] / 255 * 1000) / 1000
    ]));
  } catch (e) {}
}

function applyType(t, save){
  if (TYPES.indexOf(t) < 0) t = 'single';
  curType = t;
  typePushed = rigSetType(t);
  for (var i = 0; i < 3; i++){
    var el = typeEls[i];
    if (el) el.className = TYPES[i] === t ? 'jku-type sel' : 'jku-type';
  }
  if (save) saveType();
}

function applyColor(save){
  var r = cur[0], g = cur[1], b = cur[2];
  F3[0] = r / 255; F3[1] = g / 255; F3[2] = b / 255;
  colPushed = rigSetSaber(F3);
  if (prevEl){
    prevEl.style.background = 'rgb(' + r + ',' + g + ',' + b + ')';
    prevEl.style.boxShadow = '0 0 16px 3px rgba(' + r + ',' + g + ',' + b + ',.85), ' +
      'inset 0 0 6px rgba(255,255,255,.35)';
  }
  for (var i = 0; i < 3; i++){
    if (slid[i] && +slid[i].value !== cur[i]) slid[i].value = '' + cur[i];
    if (vals[i]) vals[i].textContent = '' + cur[i];
  }

function setOpen(o){

  if (panel) panel.style.display = open ? 'block' : 'none';
  if (btn){
    if (open) btn.classList.add('on'); else btn.classList.remove('on');

/* ---------------- sliders ----------------
 * iOS Safari + ancestor touch-action:none makes native range touch-drag flaky,
 * so touches drive the value manually (deterministic); mouse uses the native
 * 'input' path. The driving touch is latched by identifier: a coalesced event's
 * changedTouches[0] can be the STICK finger moving under the open panel, and
 * feeding its X here would yank the color around. Rect math only runs during
 * menu interaction — not per frame. */
function bindSlider(inp, idx){
  var tid = null;
  function fromX(clientX){
    var rc = inp.getBoundingClientRect();
    var tw = 30;                                /* thumb width incl. borders */
    var w = rc.width - tw;
    var v = clamp255(w > 0 ? (clientX - rc.left - tw / 2) / w * 255 : 0);
    if (v !== cur[idx]){ cur[idx] = v; applyColor(false); }
  }
  inp.addEventListener('touchstart', function(e){
    eat(e);
    if (tid !== null) return;                   /* one finger drives the slider */
    var ts = e.changedTouches;
    for (var i = 0; i < ts.length; i++){
      if (ownsTouch(inp, ts[i])){ tid = ts[i].identifier; fromX(ts[i].clientX); break; }
    }
  }, {passive:false});
  inp.addEventListener('touchmove', function(e){
    var ts = e.changedTouches;
    for (var i = 0; i < ts.length; i++){
      if (ts[i].identifier === tid){ eat(e); fromX(ts[i].clientX); return; }
    }
    /* foreign finger only: leave it for the panel shield / input module */
  }, {passive:false});
  inp.addEventListener('touchend', function(e){
    if (e.cancelable) e.preventDefault();       /* no ghost click; DO bubble (shield note) */
    if (!hasTouch(e.changedTouches, tid)) return;
    tid = null;
    applyColor(true);
  }, {passive:false});
  inp.addEventListener('touchcancel', function(e){
    if (!hasTouch(e.changedTouches, tid)) return;
    tid = null;
    applyColor(true);
  }, {passive:false});
  inp.addEventListener('mousedown', stopOnly);  /* no preventDefault: keep native drag */
  inp.addEventListener('input', function(){
    var v = clamp255(+inp.value || 0);
    if (v !== cur[idx]){ cur[idx] = v; applyColor(false); }
  });
  inp.addEventListener('change', function(){ applyColor(true); });
}

/* restart the one-shot fade animation (DOM touched only on change) */
function flash(el){
  el.classList.remove('on');
  void el.offsetWidth;                          /* reflow -> animation restarts */
  el.classList.add('on');
}

/* ---------------- DOM build ---------------- */
function build(){
  var d = document, i;
