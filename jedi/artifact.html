<title>DUNE RAIDER</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none;
    overscroll-behavior:none; position:fixed; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud { position:absolute; inset:0; pointer-events:none; z-index:3;
    font:700 12px/1.3 "Trebuchet MS","Verdana",sans-serif; color:#d8e0c8;
    text-shadow:1px 1px 0 #000, 0 0 6px rgba(0,0,0,.8); letter-spacing:.06em; }
  /* --- 2000s LucasArts-ish HUD corners --- */
  #hpBox { position:absolute; left:calc(12px + env(safe-area-inset-left));
    bottom:calc(12px + env(safe-area-inset-bottom)); }
  #fpBox { position:absolute; right:calc(12px + env(safe-area-inset-right));
    bottom:calc(12px + env(safe-area-inset-bottom)); text-align:right; }
  .bar { width:120px; height:10px; border:2px solid #6a705a; background:#101408; margin-top:3px; }
  .bar > i { display:block; height:100%; background:linear-gradient(#aef07a,#4f9f2f); }
  #fpBox .bar > i { background:linear-gradient(#8ad4ff,#2f6f9f); }
  #stanceTag { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); font-size:11px; color:#e8d9a0; opacity:.9; }
  #forceTag { position:absolute; top:calc(28px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); font-size:10px; color:#9fd4ff; opacity:.85; }
  #msg { position:absolute; top:30%; left:0; right:0; text-align:center; font-size:14px;
    color:#f0e6c0; opacity:0; transition:opacity .5s; }
  #msg.on { opacity:1; }
  /* --- touch controls --- */
  .tbtn { position:absolute; z-index:4; width:64px; height:64px; border-radius:50%;
    border:2px solid rgba(200,210,170,.35); background:rgba(20,26,12,.35);
    color:rgba(220,228,190,.85); font:700 10px/60px "Trebuchet MS",sans-serif;
    text-align:center; letter-spacing:.08em; pointer-events:auto;
    -webkit-user-select:none; user-select:none; }
  .tbtn.held { background:rgba(160,200,90,.25); border-color:rgba(200,240,140,.7); }
  #btnJump  { right:calc(16px + env(safe-area-inset-right)); bottom:calc(120px + env(safe-area-inset-bottom)); }
  #btnAtk   { right:calc(96px + env(safe-area-inset-right)); bottom:calc(48px + env(safe-area-inset-bottom)); width:76px; height:76px; line-height:72px; }
  #btnForce { right:calc(20px + env(safe-area-inset-right)); bottom:calc(210px + env(safe-area-inset-bottom)); width:56px; height:56px; line-height:52px; }
  #btnStance{ left:calc(16px + env(safe-area-inset-left)); bottom:calc(150px + env(safe-area-inset-bottom)); width:52px; height:52px; line-height:48px; font-size:9px; }
  #stickL { position:absolute; z-index:2; left:0; bottom:0; width:45%; height:70%; pointer-events:auto; }
  #stickUI { position:absolute; z-index:3; width:96px; height:96px; border:2px solid rgba(200,210,170,.25);
    border-radius:50%; display:none; pointer-events:none; }
  #stickUI > b { position:absolute; width:40px; height:40px; left:26px; top:26px; border-radius:50%;
    background:rgba(200,210,170,.25); border:2px solid rgba(200,210,170,.4); }
  /*INPUT-CSS*/
  #gl, #stickL, #stickUI, .tbtn { touch-action:none; }
  #gl { cursor:crosshair; }
  #stickUI { left:0; top:0; will-change:transform; }
  #stickUI.on { display:block; }
  #stickUI > b { will-change:transform; }
  #stickUI.run { border-color:rgba(255,215,106,.65); box-shadow:0 0 14px rgba(255,190,80,.3); }
  #stickUI.run > b { background:rgba(255,215,106,.45); border-color:rgba(255,225,140,.85); }
  .tbtn.held { transform:scale(.92); }
  #btnAtk.held { background:rgba(220,120,60,.3); border-color:rgba(255,170,90,.75); }
  /* --- start screen --- */
  #start { position:absolute; inset:0; z-index:10; background:
    radial-gradient(ellipse at 50% 30%, #3a2c18 0%, #120d06 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#e8dcb0; font:700 13px/1.8 "Trebuchet MS","Verdana",sans-serif; letter-spacing:.1em;
    text-align:center; padding:0 8%; transition:opacity .8s; }
  #start.gone { opacity:0; pointer-events:none; }
  #start h1 { font-size:34px; letter-spacing:.3em; text-indent:.3em; color:#ffd76a;
    text-shadow:2px 2px 0 #000, 0 0 18px rgba(255,180,60,.35); margin-bottom:6px; }
  #start .sub { font-size:11px; color:#b8a878; margin-bottom:30px; }
  #start .hint { font-size:10px; color:#8f8464; line-height:2; font-weight:400; }
  #begin { margin-top:34px; padding:14px 46px; border:2px solid #8f8050; background:#241c0e;
    color:#ffe9a8; font:700 13px "Trebuchet MS",sans-serif; letter-spacing:.3em; text-indent:.3em;
    cursor:pointer; }
  #begin:active { background:#3a2e14; }
  #err { position:absolute; inset:0; display:none; z-index:20; background:#000; color:#a99;
    font:400 13px/1.8 sans-serif; padding:20%; text-align:center; }
</style>

<canvas id="gl"></canvas>
<div id="hud">
  <div id="hpBox">HEALTH<div class="bar"><i id="hpFill" style="width:100%"></i></div></div>
  <div id="fpBox">FORCE<div class="bar"><i id="fpFill" style="width:100%"></i></div></div>
  <div id="stanceTag">MEDIUM STANCE</div>
  <div id="forceTag"></div>
  <div id="msg"></div>
</div>
<div id="stickL"></div>
<div id="stickUI"><b></b></div>
<div id="btnJump"  class="tbtn">JUMP</div>
<div id="btnAtk"   class="tbtn">ATK</div>
<div id="btnForce" class="tbtn">FORCE</div>
<div id="btnStance"class="tbtn">STANCE</div>
<div id="start">
  <h1>DUNE RAIDER</h1>
  <div class="sub">A TALE OF THE OUTER RIM &middot; 2002</div>
  <div class="hint" id="hintTouch">left thumb — move &middot; right thumb — camera<br>
    ATK swings the saber &middot; JUMP leaps &middot; FORCE unleashes power</div>

</div>
<div id="err"></div>
<script>
/* ===== 00_math.js ===== */
/* JK.M — column-major mat4 + vec3 helpers. Owner: core. */
var JK = window.JK = window.JK || {};
(function(){
'use strict';
var TMP = new Float32Array(16);

function make(){ var m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function ident(m){ for(var i=0;i<16;i++) m[i]=0; m[0]=m[5]=m[10]=m[15]=1; return m; }
function copy(o,a){ o.set(a); return o; }

/* o = a * b  (safe if o aliases a or b) */
function mul(o,a,b){
  for(var c=0;c<4;c++){
    var b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    TMP[c*4]  =a[0]*b0+a[4]*b1+a[8]*b2 +a[12]*b3;
    TMP[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2 +a[13]*b3;
    TMP[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    TMP[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;
  }
  o.set(TMP); return o;
}

/* in-place post-multiply composers: m = m * X. Natural for parent->child builds. */
var B = make();
function tr(m,x,y,z){ ident(B); B[12]=x; B[13]=y; B[14]=z; return mul(m,m,B); }
function sc(m,x,y,z){ ident(B); B[0]=x; B[5]=y; B[10]=z; return mul(m,m,B); }
function rx(m,a){ var c=Math.cos(a),s=Math.sin(a); ident(B); B[5]=c; B[6]=s; B[9]=-s; B[10]=c; return mul(m,m,B); }
function ry(m,a){ var c=Math.cos(a),s=Math.sin(a); ident(B); B[0]=c; B[2]=-s; B[8]=s; B[10]=c; return mul(m,m,B); }
function rz(m,a){ var c=Math.cos(a),s=Math.sin(a); ident(B); B[0]=c; B[1]=s; B[4]=-s; B[5]=c; return mul(m,m,B); }

function persp(o,fovy,aspect,near,far){
  var f=1/Math.tan(fovy/2), nf=1/(near-far);
  o[0]=f/aspect; o[1]=0; o[2]=0; o[3]=0;
  o[4]=0; o[5]=f; o[6]=0; o[7]=0;
  o[8]=0; o[9]=0; o[10]=(far+near)*nf; o[11]=-1;
  o[12]=0; o[13]=0; o[14]=2*far*near*nf; o[15]=0;
  return o;
}

function lookAt(o,eye,ctr,up){
  var zx=eye[0]-ctr[0], zy=eye[1]-ctr[1], zz=eye[2]-ctr[2];
  var l=1/(Math.sqrt(zx*zx+zy*zy+zz*zz)||1); zx*=l; zy*=l; zz*=l;
  var xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  l=1/(Math.sqrt(xx*xx+xy*xy+xz*xz)||1); xx*=l; xy*=l; xz*=l;
  var yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
  o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
  o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
  o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  o[15]=1;
  return o;
}

/* transform point [x,y,z,1] by m -> out3 */
function xp(o,m,x,y,z){
  o[0]=m[0]*x+m[4]*y+m[8]*z+m[12];
  o[1]=m[1]*x+m[5]*y+m[9]*z+m[13];
  o[2]=m[2]*x+m[6]*y+m[10]*z+m[14];
  return o;
}
/* transform direction (no translation) */
function xd(o,m,x,y,z){
  o[0]=m[0]*x+m[4]*y+m[8]*z;
  o[1]=m[1]*x+m[5]*y+m[9]*z;
  o[2]=m[2]*x+m[6]*y+m[10]*z;
  return o;
}

JK.M = { make:make, ident:ident, copy:copy, mul:mul, tr:tr, sc:sc, rx:rx, ry:ry, rz:rz,
  persp:persp, lookAt:lookAt, xp:xp, xd:xd };

JK.V = {
  set:function(o,x,y,z){ o[0]=x; o[1]=y; o[2]=z; return o; },
  copy:function(o,a){ o[0]=a[0]; o[1]=a[1]; o[2]=a[2]; return o; },
  add:function(o,a,b){ o[0]=a[0]+b[0]; o[1]=a[1]+b[1]; o[2]=a[2]+b[2]; return o; },
  sub:function(o,a,b){ o[0]=a[0]-b[0]; o[1]=a[1]-b[1]; o[2]=a[2]-b[2]; return o; },
  scale:function(o,a,s){ o[0]=a[0]*s; o[1]=a[1]*s; o[2]=a[2]*s; return o; },
  dot:function(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; },
  cross:function(o,a,b){ var x=a[1]*b[2]-a[2]*b[1], y=a[2]*b[0]-a[0]*b[2], z=a[0]*b[1]-a[1]*b[0];
    o[0]=x; o[1]=y; o[2]=z; return o; },
  len:function(a){ return Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]); },
  norm:function(o,a){ var l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1;
    o[0]=a[0]/l; o[1]=a[1]/l; o[2]=a[2]/l; return o; },
  lerp:function(o,a,b,t){ o[0]=a[0]+(b[0]-a[0])*t; o[1]=a[1]+(b[1]-a[1])*t; o[2]=a[2]+(b[2]-a[2])*t; return o; },
  dist:function(a,b){ var x=a[0]-b[0],y=a[1]-b[1],z=a[2]-b[2]; return Math.sqrt(x*x+y*y+z*z); }
};
})();

/* ===== 05_gl.js ===== */
/* JK.GL + JK.Geo — WebGL1 renderer with one gouraud/fog shader. Owner: core. */
(function(){
'use strict';
var M = JK.M;
var gl = null, prog = null, canvas = null, dpr = 1;
var loc = {};
var proj = M.make(), view = M.make(), IDENT = M.make();
var sunDir = new Float32Array([0.45, 0.75, 0.35]);
var sunCol = new Float32Array([1.0, 0.93, 0.78]);
var amb    = new Float32Array([0.38, 0.34, 0.30]);
var fogCol = new Float32Array([0.86, 0.72, 0.52]);
var fogDen = 0.0035;
var curBlend = false;

var VS =
'attribute vec3 aP; attribute vec3 aN; attribute vec3 aC;\n'+
'uniform mat4 uProj, uView, uModel;\n'+
'uniform vec3 uSunDir, uSunCol, uAmb, uTint;\n'+
'uniform float uEmissive;\n'+
'varying vec3 vCol; varying float vDist;\n'+
'void main(){\n'+
'  vec4 wp = uModel * vec4(aP, 1.0);\n'+
'  mat3 nm = mat3(uModel[0].xyz, uModel[1].xyz, uModel[2].xyz);\n'+
'  vec3 n = normalize(nm * aN);\n'+
'  float d = max(dot(n, uSunDir), 0.0);\n'+
'  vec3 base = aC * uTint;\n'+
'  vec3 lit = (uAmb + uSunCol * d) * base;\n'+
'  vCol = mix(lit, base, uEmissive);\n'+
'  vec4 vp = uView * wp;\n'+
'  vDist = length(vp.xyz);\n'+
'  gl_Position = uProj * vp;\n'+
'}';
var FS =
'precision mediump float;\n'+
'varying vec3 vCol; varying float vDist;\n'+
'uniform vec3 uFogCol; uniform float uFogDen; uniform float uAlpha; uniform float uNoFog;\n'+
'void main(){\n'+
'  float f = exp(-uFogDen * uFogDen * vDist * vDist * 1.442695);\n'+
'  f = clamp(max(f, uNoFog), 0.0, 1.0);\n'+
'  gl_FragColor = vec4(mix(uFogCol, vCol, f), uAlpha);\n'+
'}';

function sh(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}

var GL = JK.GL = {
  gl: null, eye: new Float32Array(3), aspect: 1, w: 0, h: 0,

  init: function(cv){
    canvas = cv;
    gl = cv.getContext('webgl', {antialias:false, alpha:false, depth:true,
      powerPreference:'high-performance'}) || cv.getContext('experimental-webgl');
    if (!gl) return false;
    GL.gl = gl;
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.bindAttribLocation(prog, 0, 'aP');
    gl.bindAttribLocation(prog, 1, 'aN');
    gl.bindAttribLocation(prog, 2, 'aC');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error('link: ' + gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    ['uProj','uView','uModel','uSunDir','uSunCol','uAmb','uTint','uEmissive',
     'uFogCol','uFogDen','uAlpha','uNoFog'].forEach(function(n){ loc[n] = gl.getUniformLocation(prog, n); });
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.disable(gl.CULL_FACE);
    gl.enableVertexAttribArray(0);
    gl.enableVertexAttribArray(1);
    gl.enableVertexAttribArray(2);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    return true;
  },

  fog: function(col, den){ fogCol.set(col); fogDen = den; },
  sun: function(dir, col, ambient){
    var l = Math.sqrt(dir[0]*dir[0]+dir[1]*dir[1]+dir[2]*dir[2]) || 1;
    sunDir[0]=dir[0]/l; sunDir[1]=dir[1]/l; sunDir[2]=dir[2]/l;
    sunCol.set(col); amb.set(ambient);
  },

  beginFrame: function(r, g, b){
    var w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
    GL.w = w; GL.h = h; GL.aspect = w / (h || 1);
    gl.viewport(0, 0, w, h);
    gl.clearColor(r, g, b, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniform3fv(loc.uSunDir, sunDir);
    gl.uniform3fv(loc.uSunCol, sunCol);
    gl.uniform3fv(loc.uAmb, amb);
    gl.uniform3fv(loc.uFogCol, fogCol);
    gl.uniform1f(loc.uFogDen, fogDen);
  },

  setCamera: function(eye, target, fovDeg){
    GL.eye[0]=eye[0]; GL.eye[1]=eye[1]; GL.eye[2]=eye[2];
    M.persp(proj, (fovDeg||70) * Math.PI/180, GL.aspect, 0.1, 2000);
    M.lookAt(view, eye, target, [0,1,0]);
    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);
  },

  /* geo: {pos,nrm,col:Float32Array, idx:Uint16Array} */
  mesh: function(geo){
    function buf(target, data){
      var b = gl.createBuffer(); gl.bindBuffer(target, b);
      gl.bufferData(target, data, gl.STATIC_DRAW); return b;
    }
    return {
      p: buf(gl.ARRAY_BUFFER, geo.pos),
      n: buf(gl.ARRAY_BUFFER, geo.nrm),
      c: buf(gl.ARRAY_BUFFER, geo.col),
      i: buf(gl.ELEMENT_ARRAY_BUFFER, geo.idx),
      count: geo.idx.length
    };
  },

  draw: function(mesh, model, opts){
    opts = opts || {};
    gl.uniformMatrix4fv(loc.uModel, false, model || IDENT);
    gl.uniform1f(loc.uEmissive, opts.emissive || 0);
    gl.uniform1f(loc.uAlpha, opts.alpha !== undefined ? opts.alpha : 1);
    gl.uniform1f(loc.uNoFog, opts.nofog ? 1 : 0);
    var t = opts.tint;
    gl.uniform3f(loc.uTint, t ? t[0] : 1, t ? t[1] : 1, t ? t[2] : 1);
    var add = !!opts.additive;
    if (add !== curBlend){
      curBlend = add;
      if (add){ gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.depthMask(false); }
      else { gl.disable(gl.BLEND); gl.depthMask(true); }
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.p); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.n); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.c); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.i);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  }
};

/* ---- CPU geometry builders ---- */
var Geo = JK.Geo = {
  box: function(sx, sy, sz, r, g, b){
    var x = sx/2, y = sy/2, z = sz/2;
    var P = [], N = [], C = [], I = [];
    var faces = [
      [[ 1,0,0],[[ x,-y,-z],[ x, y,-z],[ x, y, z],[ x,-y, z]]],
      [[-1,0,0],[[-x,-y, z],[-x, y, z],[-x, y,-z],[-x,-y,-z]]],
      [[0, 1,0],[[-x, y,-z],[-x, y, z],[ x, y, z],[ x, y,-z]]],
      [[0,-1,0],[[-x,-y, z],[-x,-y,-z],[ x,-y,-z],[ x,-y, z]]],
      [[0,0, 1],[[-x,-y, z],[ x,-y, z],[ x, y, z],[-x, y, z]]],
      [[0,0,-1],[[ x,-y,-z],[-x,-y,-z],[-x, y,-z],[ x, y,-z]]]
    ];
    for (var f = 0; f < 6; f++){
      var n = faces[f][0], vs = faces[f][1], base = P.length/3;
      for (var v = 0; v < 4; v++){
        P.push(vs[v][0], vs[v][1], vs[v][2]);
        N.push(n[0], n[1], n[2]);
        C.push(r, g, b);
      }
      I.push(base, base+1, base+2, base, base+2, base+3);
    }
    return { pos:new Float32Array(P), nrm:new Float32Array(N),
             col:new Float32Array(C), idx:new Uint16Array(I) };
  },

  tf: function(geo, m){
    var n = geo.pos.length/3;
    var pos = new Float32Array(geo.pos.length), nrm = new Float32Array(geo.nrm.length);
    var p = [0,0,0];
    for (var i = 0; i < n; i++){
      M.xp(p, m, geo.pos[i*3], geo.pos[i*3+1], geo.pos[i*3+2]);
      pos[i*3]=p[0]; pos[i*3+1]=p[1]; pos[i*3+2]=p[2];
      M.xd(p, m, geo.nrm[i*3], geo.nrm[i*3+1], geo.nrm[i*3+2]);
      var l = Math.sqrt(p[0]*p[0]+p[1]*p[1]+p[2]*p[2]) || 1;
      nrm[i*3]=p[0]/l; nrm[i*3+1]=p[1]/l; nrm[i*3+2]=p[2]/l;
    }
    return { pos:pos, nrm:nrm, col:new Float32Array(geo.col), idx:new Uint16Array(geo.idx) };
  },

  merge: function(list){
    var vTot = 0, iTot = 0, i, g;
    for (i = 0; i < list.length; i++){ vTot += list[i].pos.length/3; iTot += list[i].idx.length; }
    if (vTot > 65535) throw new Error('Geo.merge: ' + vTot + ' verts > 65535');
    var pos = new Float32Array(vTot*3), nrm = new Float32Array(vTot*3),
        col = new Float32Array(vTot*3), idx = new Uint16Array(iTot);
    var vo = 0, io = 0;
    for (i = 0; i < list.length; i++){
      g = list[i];
      pos.set(g.pos, vo*3); nrm.set(g.nrm, vo*3); col.set(g.col, vo*3);
      for (var j = 0; j < g.idx.length; j++) idx[io+j] = g.idx[j] + vo;
      vo += g.pos.length/3; io += g.idx.length;
    }
    return { pos:pos, nrm:nrm, col:col, idx:idx };
  }
};
})();

/* ===== 10_terrain.js ===== */
/* JK.Terrain — open desert: analytic dune heightfield, rocks, mesas, wreck, sun.
   Owner: terrain agent. */
(function(){
'use strict';
var M = JK.M, Geo = JK.Geo;

/* ---------- deterministic PRNG (mulberry32) ---------- */
var SEED = 0x0DE5E27; /* fixed seed: same dunes every load */
function mulberry32(a){
  a = a >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- smooth value noise on a hashed lattice ---------- */
var PERM = new Uint8Array(512);
var VALS = new Float32Array(256);
(function(){
  var r = mulberry32(SEED), i, j, t;
  for (i = 0; i < 256; i++){ PERM[i] = i; VALS[i] = r(); }
  for (i = 255; i > 0; i--){
    j = (r() * (i + 1)) | 0;
    t = PERM[i]; PERM[i] = PERM[j]; PERM[j] = t;
  }
  for (i = 0; i < 256; i++) PERM[i + 256] = PERM[i];
})();

/* value noise, returns 0..1, C1-continuous (smoothstep-interpolated) */
function vn(x, z){
  var ix = Math.floor(x), iz = Math.floor(z);
  var fx = x - ix, fz = z - iz;
  ix &= 255; iz &= 255;
  var ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  var p0 = PERM[ix], p1 = PERM[ix + 1];
  var a = VALS[PERM[p0 + iz]], b = VALS[PERM[p1 + iz]];
  var c = VALS[PERM[p0 + iz + 1]], d = VALS[PERM[p1 + iz + 1]];
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}

/* ---------- THE contract: analytic ground height ----------
   Long rolling dune ridges (two rotated sine trains, wavelengths ~90-150m,
   phase-warped so crests wander) + broad value noise + fine ripple.
   Relief ~= +/-5m, slopes gentle enough to sprint over. */
function height(x, z){
  var u = x * 0.831 + z * 0.556;        /* rotated dune-ridge axes */
  var v = z * 0.831 - x * 0.556;
  var h = 2.6 * Math.sin(u * 0.0430 + 1.6 * Math.sin(v * 0.0110 + 0.7));
  h += 1.35 * Math.sin(v * 0.0700 + 2.1 + 0.8 * Math.sin(u * 0.0170 + 3.0));
  h += 3.9  * (vn(x * 0.0082 + 91.3, z * 0.0082 + 47.8) - 0.5);
  h += 1.7  * (vn(x * 0.0270 + 13.1, z * 0.0270 + 71.7) - 0.5);
  h += 0.45 * (vn(x * 0.0900 + 55.5, z * 0.0900 + 23.9) - 0.5);
  return h;
}

/* ---------- module state ---------- */
var terrainMesh = null, sceneryMesh = null, sunMesh = null, haloMesh = null;
var OBST = [];
var SUN_DIR = [0.71, 0.573, 0.409];   /* normalized; points UP toward the sun */
var SUN_OPTS  = { emissive: 1, nofog: true };
var HALO_OPTS = { emissive: 1, nofog: true, additive: true, alpha: 0.45 };

/* sand palette: #b8905a -> #d2aa6d, banded */
var SAND_LO = [0.722, 0.565, 0.353];
var SAND_HI = [0.824, 0.667, 0.427];

/* ---------- terrain grid: 128x128 quads over 760x760m ----------
   Mesh samples height() exactly => visuals == collision. */
function buildTerrainGeo(){
  var N = 128, V = N + 1, EXT = 760, half = EXT / 2, step = EXT / N;
  var pos = new Float32Array(V * V * 3);
  var nrm = new Float32Array(V * V * 3);
  var col = new Float32Array(V * V * 3);
  var idx = new Uint16Array(N * N * 6);
  var jr = mulberry32(SEED ^ 0x51AB);
  var e = 2.0;
  var gx, gz, x, z, y, i3, nx, ny, nz, il, t, slopeK, j, a, b, c, d, io;

  for (gz = 0; gz < V; gz++){
    z = -half + gz * step;
    for (gx = 0; gx < V; gx++){
      x = -half + gx * step;
      y = height(x, z);
      i3 = (gz * V + gx) * 3;
      pos[i3] = x; pos[i3 + 1] = y; pos[i3 + 2] = z;

      /* central-difference normal from the same height() */
      nx = height(x - e, z) - height(x + e, z);
      nz = height(x, z - e) - height(x, z + e);
      ny = 2 * e;
      il = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx *= il; ny *= il; nz *= il;
      nrm[i3] = nx; nrm[i3 + 1] = ny; nrm[i3 + 2] = nz;

      /* two-tone banding by height, pushed darker on slopes, quantized retro */
      t = (y + 5.5) / 11;
      if (t < 0) t = 0; else if (t > 1) t = 1;
      slopeK = (1 - ny) * 26;
      if (slopeK < 0) slopeK = 0; else if (slopeK > 1) slopeK = 1;
      t -= slopeK * 0.45;
      if (t < 0) t = 0;
      t = Math.round(t * 4) / 4;          /* 5 hard bands */
      j = (jr() - 0.5) * 0.05;            /* deterministic grain */
      col[i3]     = SAND_LO[0] + (SAND_HI[0] - SAND_LO[0]) * t + j;
      col[i3 + 1] = SAND_LO[1] + (SAND_HI[1] - SAND_LO[1]) * t + j;
      col[i3 + 2] = SAND_LO[2] + (SAND_HI[2] - SAND_LO[2]) * t + j * 0.8;
    }
  }

  io = 0;
  for (gz = 0; gz < N; gz++){
    for (gx = 0; gx < N; gx++){
      a = gz * V + gx; b = a + 1; c = a + V; d = c + 1;
      if ((gx + gz) & 1){  /* alternate the diagonal — chunkier dune shading */
        idx[io++] = a; idx[io++] = c; idx[io++] = b;
        idx[io++] = b; idx[io++] = c; idx[io++] = d;
      } else {
        idx[io++] = a; idx[io++] = c; idx[io++] = d;
        idx[io++] = a; idx[io++] = d; idx[io++] = b;
      }
    }
  }
  return { pos: pos, nrm: nrm, col: col, idx: idx };
}

/* helper: boxed part placed by T*Ry*Rx*Rz, appended to list */
var TM = M.make();
function part(list, sx, sy, sz, r, g, b, x, y, z, ry, rx, rz){
  M.ident(TM);
  M.tr(TM, x, y, z);
  if (ry) M.ry(TM, ry);
  if (rx) M.rx(TM, rx);
  if (rz) M.rz(TM, rz);
  list.push(Geo.tf(Geo.box(sx, sy, sz, r, g, b), TM));
}

/* ---------- scenery: rocks + mesas + crashed cruisers, one merged mesh ---------- */
function buildSceneryGeo(){
  var parts = [];
  var rand = mulberry32(SEED ^ 0x9E3779B9);
  var i, k, n, cx, cz, guard, placed;

  /* --- rock outcrops: 34 clusters of 2-5 tilted boxes, off the spawn zone --- */
  placed = 0; guard = 0;
  while (placed < 34 && guard++ < 800){
    cx = (rand() * 2 - 1) * 330;
    cz = (rand() * 2 - 1) * 330;
    if (cx * cx + cz * cz < 42 * 42) continue;   /* keep ~30m spawn zone clear */
    n = 2 + ((rand() * 4) | 0);                  /* 2..5 rocks */
    var shade = 0.42 + rand() * 0.14;            /* grey-brown per cluster */
    var maxExt = 0;
    for (k = 0; k < n; k++){
      var s  = 1 + rand() * 5;                   /* 1..6 m */
      var sy = s * (0.6 + rand() * 0.7);
      var sz2 = s * (0.7 + rand() * 0.6);
      var dx = (rand() - 0.5) * 6, dz = (rand() - 0.5) * 6;
      var px = cx + dx, pz = cz + dz;
      var jc = (rand() - 0.5) * 0.06;
      part(parts, s, sy, sz2,
        shade + 0.06 + jc, shade + 0.01 + jc, shade - 0.05 + jc,
        px, height(px, pz) + sy * 0.30, pz,
        rand() * 6.283, (rand() - 0.5) * 0.5, (rand() - 0.5) * 0.5);
      var ext = Math.sqrt(dx * dx + dz * dz) + s * 0.75;
      if (ext > maxExt) maxExt = ext;
    }
    var rr = maxExt;
    if (rr < 1.6) rr = 1.6; if (rr > 8.5) rr = 8.5;
    OBST.push({ x: cx, z: cz, r: rr });
    placed++;
  }

  /* --- 5 giant mesas outside the playable area (radius 430-650) --- */
  var ang0 = rand() * 6.283;
  for (i = 0; i < 5; i++){
    var ang = ang0 + i * 1.2566 + (rand() - 0.5) * 0.5;
    var dist = 465 + rand() * 195;               /* 465..660 from origin */
    var mx = Math.cos(ang) * dist, mz = Math.sin(ang) * dist;
    var totH = 40 + rand() * 50;                 /* 40..90 m */
    var w = 60 + rand() * 80;
    var yb = height(mx, mz) - 4;
    var fr = [0.55, 0.32, 0.22], wf = [1.0, 0.78, 0.58];
    var rot = rand() * 6.283, yy = yb;
    OBST.push({ x: mx, z: mz, r: w * 0.75 });    /* keep corner-reach out of mesa */
    for (k = 0; k < 3; k++){
      var lh = totH * fr[k];
      var lw = w * wf[k] * (0.9 + rand() * 0.2);
      var cR = (k === 2) ? 0.76 : (k === 1 ? 0.60 : 0.70);
      var cG = (k === 2) ? 0.58 : (k === 1 ? 0.43 : 0.50);
      var cB = (k === 2) ? 0.40 : (k === 1 ? 0.32 : 0.36);
      part(parts, lw, lh, lw * (0.8 + rand() * 0.4), cR, cG, cB,
        mx + (rand() - 0.5) * 8, yy + lh / 2, mz + (rand() - 0.5) * 8,
        rot + (rand() - 0.5) * 0.3, 0, 0);
      yy += lh * 0.92;
    }
  }

  /* --- crashed star-cruiser hulls, half-buried --- */
  var P3 = [0, 0, 0], PM = M.make();
  for (i = 0; i < 2; i++){
    var ca = rand() * 6.283;
    var cd = (i === 0 ? 150 : 240) + rand() * 50;
    var wx = Math.cos(ca) * cd, wz = Math.sin(ca) * cd;
    if (wx > 300) wx = 300; if (wx < -300) wx = -300;
    if (wz > 300) wz = 300; if (wz < -300) wz = -300;
    var yaw = rand() * 6.283;
    var wy = height(wx, wz) + 0.8;
    M.ident(PM); M.tr(PM, wx, wy, wz); M.ry(PM, yaw);
    M.rx(PM, 0.16 + rand() * 0.08); M.rz(PM, (rand() - 0.5) * 0.5);

    var hull = [];
    var scale = (i === 0) ? 1 : 0.7;
    hull.push(Geo.tf(Geo.box(8 * scale, 6.5 * scale, 34 * scale, 0.45, 0.47, 0.50), M.make()));
    M.ident(TM); M.tr(TM, 0, 3.2 * scale, -2 * scale);
    hull.push(Geo.tf(Geo.box(5 * scale, 2.4 * scale, 19 * scale, 0.38, 0.40, 0.43), TM));
    M.ident(TM); M.tr(TM, 0, 7 * scale, 12 * scale); M.rx(TM, -0.15);
    hull.push(Geo.tf(Geo.box(0.9 * scale, 10 * scale, 7 * scale, 0.40, 0.42, 0.46), TM)); /* fin */
    M.ident(TM); M.tr(TM, 0, 0, 17.5 * scale);
    hull.push(Geo.tf(Geo.box(6.6 * scale, 4.2 * scale, 4.5 * scale, 0.24, 0.25, 0.28), TM)); /* engines */
    if (i === 0){ /* torn-off nose chunk a bit ahead */
      M.ident(TM); M.tr(TM, 3, -1.2, -24); M.ry(TM, 0.7); M.rz(TM, 0.4);
      hull.push(Geo.tf(Geo.box(6, 4.5, 8, 0.42, 0.44, 0.47), TM));
    }
    for (k = 0; k < hull.length; k++) parts.push(Geo.tf(hull[k], PM));

    /* collision circles: 4 along the hull axis (spaced/sized to reach the
       4x17m half-extent corners), plus engine block, plus torn-off nose */
    for (k = 0; k < 4; k++){
      M.xp(P3, PM, 0, 0, (k * 9.5 - 14.25) * scale);
      OBST.push({ x: P3[0], z: P3[2], r: 6.25 * scale });
    }
    M.xp(P3, PM, 0, 0, 17.5 * scale);
    OBST.push({ x: P3[0], z: P3[2], r: 4.6 * scale });
    if (i === 0){
      M.xp(P3, PM, 3, -1.2, -24);
      OBST.push({ x: P3[0], z: P3[2], r: 5.4 });
    }
  }

  return Geo.merge(parts);
}

/* ---------- JK.Terrain ---------- */
JK.Terrain = {
  SIZE: 350,                 /* playable half-extent; player/bots clamp to this */
  height: height,            /* analytic, continuous, cheap */
  obstacles: OBST,           /* [{x,z,r}, ...] filled during init */

  init: function(){
    terrainMesh = JK.GL.mesh(buildTerrainGeo());
    sceneryMesh = JK.GL.mesh(buildSceneryGeo());

    /* sun billboard blob 1400m out along SUN_DIR (already unit length) */
    var sp = [SUN_DIR[0] * 1400, SUN_DIR[1] * 1400, SUN_DIR[2] * 1400];
    M.ident(TM); M.tr(TM, sp[0], sp[1], sp[2]); M.ry(TM, 0.5); M.rz(TM, 0.4);
    sunMesh = JK.GL.mesh(Geo.tf(Geo.box(58, 58, 58, 1.0, 0.97, 0.86), TM));

};
})();

/* ===== 20_input.js ===== */
/* JK.Input — touch-first controls + desktop fallback. Owner: input agent.
 *
 * FINAL STATE SHAPE — JK.Input.state, snapshotted exactly once per update(dt).
 * Consumers read it after Input.update has run for the frame (main runs Input
 * before Player). Same object identity forever — safe to cache a reference.
 *
 *   {
 *     moveX, moveY   // -1..1 virtual stick. moveY = +1 means FORWARD (away
 *                    //   from camera). Keyboard diagonals are normalized.
 *     lookDX, lookDY // look-drag pixels accumulated since the LAST update,
 *                    //   then reset each snapshot. +DX = drag right, +DY = drag down.
 *     jump,          // edge: TRUE only on the first frame after a press
 *     attack,        //   (touch button touchstart / key down / mouse down;
 *     force,         //   never repeat-fires while held)
 *     stanceTap,     // edge: stance-cycle tap (Q / #btnStance)
 *     forceTap,      // edge: force-select tap (R / mousewheel)
 *     attackHeld,    // held: TRUE while #btnAtk is touched or LMB is down
 *     forceHeld,     // held: TRUE while #btnForce is touched or E is down
 *     runHeld,       // held: TRUE while sprinting (stick deflection > 0.92
 *                    //   of radius, or Shift on desktop)
 *     run,           // legacy alias, always === runHeld
 *     stance,        // running tap counter for stance cycling (consumers
 *     forceSel       //   take modulo; monotonically increasing ints)
 *   }
 *
 * Touch: #stickL (left 45%) = dynamic virtual stick (origin where the finger
 * lands, #stickUI shown there). Right half of the canvas = look drag. Buttons
 * #btnJump #btnAtk #btnForce #btnStance. Multi-touch tracked by identifier so
 * move + look + ATK all work at once. Desktop: WASD/arrows, Shift run,
 * Space jump, mouse-drag look, LMB attack, E force, Q stance, R/wheel force-select.
 */
(function(){
'use strict';

var RADIUS = 48;          /* stick radius, px */
var RUN_FRAC = 0.92;      /* deflection fraction beyond which we sprint */
var KNOB_SCALE = 28 / 48; /* knob visual travel so it stays inside the ring */
var WHEEL_MS = 200;       /* mousewheel forceTap throttle */

var state = {
  moveX: 0, moveY: 0,
  lookDX: 0, lookDY: 0,
  jump: false, attack: false, force: false, stanceTap: false, forceTap: false,
  attackHeld: false, runHeld: false, forceHeld: false,
  run: false,
  stance: 0, forceSel: 0
};

/* --- pending edges: set by events, copied into state then cleared each update --- */
var pJump = false, pAttack = false, pForce = false, pStance = false, pForceTap = false;
var accDX = 0, accDY = 0;           /* look pixels accumulated between updates */
var cStance = 0, cForceSel = 0;     /* running tap counters */

/* --- touch stick --- */
var stickId = null, stickOX = 0, stickOY = 0;
var stickMX = 0, stickMY = 0, stickRun = false;
/* --- touch look --- */
var lookId = null, lookLX = 0, lookLY = 0;
/* --- touch buttons (attack hold) --- */
var touchAtk = false;
var touchForce = false;   /* #btnForce held (channelled force powers) */
var btns = [];  /* {el, tid, mdown, down, up} */
/* --- mouse --- */
var mouseLook = false, mouseLX = 0, mouseLY = 0, mouseAtk = false;
var lastWheel = 0;
/* --- keyboard --- */
var kFwd = false, kBack = false, kLeft = false, kRight = false, kShift = false;
var kForce = false;       /* E held */
var keyHeld = {};   /* keyCode -> bool, our own repeat guard */

var elStick = null, elUI = null, elKnob = null, elCanvas = null, elStart = null;

function overlayUp(){
  return !!(elStart && !elStart.classList.contains('gone'));
}

/* Did this Touch actually land on el? Guards against same-event multi-touch:
 * when two fingers start in one touchstart, changedTouches can contain BOTH,
 * and claiming ts[0] blindly can steal another zone's finger (e.g. #btnAtk
 * grabbing the stick finger's identifier => stuck button + stuck attackHeld). */
function ownsTouch(el, t){
  var n = t.target;
  if (!n) return true;  /* ancient UA without Touch.target: trust dispatch */
  return n === el || !!(el.contains && el.contains(n));
}

/* ---------- touch: virtual stick ---------- */
function stickStart(e){
  if (overlayUp()) return;
  e.preventDefault();
  var ts = e.changedTouches;
  for (var i = 0; i < ts.length; i++){
    var t = ts[i];
    if (stickId === null && ownsTouch(elStick, t)){
      stickId = t.identifier;
      stickOX = t.clientX; stickOY = t.clientY;
      stickMX = 0; stickMY = 0; stickRun = false;
      if (elUI){
        elUI.style.transform = 'translate(' + (stickOX - 48) + 'px,' + (stickOY - 48) + 'px)';
        elUI.classList.add('on');
        elUI.classList.remove('run');
        if (elKnob) elKnob.style.transform = 'translate(0px,0px)';
      }
    }
  }
}

/* ---------- touch: look drag (right half of canvas, not on a button) ---------- */
function lookStart(e){
  if (overlayUp()) return;
  e.preventDefault();
  var ts = e.changedTouches;
  for (var i = 0; i < ts.length; i++){
    var t = ts[i];
    if (lookId === null && t.clientX >= window.innerWidth * 0.5 && ownsTouch(elCanvas, t)){
      lookId = t.identifier;
      lookLX = t.clientX; lookLY = t.clientY;
    }
  }
}

/* ---------- document-level move/end routing by touch identifier ---------- */
function touchMove(e){
  if (overlayUp()) return;
  if (e.cancelable) e.preventDefault();
  var ts = e.changedTouches;
  for (var i = 0; i < ts.length; i++){
    var t = ts[i];
    if (t.identifier === stickId){
      var dx = t.clientX - stickOX, dy = t.clientY - stickOY;
      var len = Math.sqrt(dx * dx + dy * dy);
      var cl = len > RADIUS ? RADIUS / len : 1;
      var cx = dx * cl, cy = dy * cl;
      stickMX = cx / RADIUS;
      stickMY = -cy / RADIUS;          /* drag up = forward = +1 */
      stickRun = len > RADIUS * RUN_FRAC;
      if (elKnob) elKnob.style.transform =
        'translate(' + (cx * KNOB_SCALE) + 'px,' + (cy * KNOB_SCALE) + 'px)';
      if (elUI){
        if (stickRun) elUI.classList.add('run');
        else elUI.classList.remove('run');
      }
    } else if (t.identifier === lookId){
      accDX += t.clientX - lookLX;
      accDY += t.clientY - lookLY;
      lookLX = t.clientX; lookLY = t.clientY;
    }
  }
}

function touchEnd(e){
  if (overlayUp()) return;
  if (e.cancelable) e.preventDefault();
  var ts = e.changedTouches;
  for (var i = 0; i < ts.length; i++){
    var id = ts[i].identifier;
    if (id === stickId){
      stickId = null;
      stickMX = 0; stickMY = 0; stickRun = false;
      if (elUI){ elUI.classList.remove('on'); elUI.classList.remove('run'); }
    } else if (id === lookId){
      lookId = null;
    } else {
      for (var b = 0; b < btns.length; b++){
        if (btns[b].tid === id){
          btns[b].tid = null;
          if (!btns[b].mdown) btns[b].el.classList.remove('held');
          if (btns[b].up) btns[b].up();
        }
      }
    }
  }
}

/* ---------- touch buttons ---------- */
function bindBtn(el, down, up){
  if (!el) return;
  var b = { el: el, tid: null, mdown: false, down: down, up: up };
  btns.push(b);
  el.addEventListener('touchstart', function(e){
    if (overlayUp()) return;
    e.preventDefault();               /* kills iOS synthetic click / text select */
    if (b.tid !== null) return;
    var ts = e.changedTouches;
    for (var i = 0; i < ts.length; i++){
      if (ownsTouch(el, ts[i])){ b.tid = ts[i].identifier; break; }
    }
    if (b.tid === null) return;       /* none of the new touches landed on us */
    el.classList.add('held');
    if (down) down();
  }, {passive:false});
  /* desktop nicety: buttons also clickable with the mouse (LMB only) */
  el.addEventListener('mousedown', function(e){
    if (overlayUp() || e.button !== 0) return;
    e.preventDefault();
    if (b.mdown) return;
    b.mdown = true;
    el.classList.add('held');
    if (down) down();
  });
}

/* ---------- desktop mouse (down-drag look on canvas) ---------- */
function mouseDown(e){
  if (overlayUp()) return;
  e.preventDefault();
  mouseLook = true;
  mouseLX = e.clientX; mouseLY = e.clientY;
  if (e.button === 0){ pAttack = true; mouseAtk = true; }
}
function mouseMove(e){
  if (!mouseLook) return;
  accDX += e.clientX - mouseLX;
  accDY += e.clientY - mouseLY;
  mouseLX = e.clientX; mouseLY = e.clientY;
}
function mouseUp(e){

    case 68: case 39: kRight = true; break;  /* D / Right */

    case 69: if (!overlayUp()){ pForce = true; kForce = true; } break;   /* E */

    case 68: case 39: kRight = false; break;
    case 16: kShift = false; break;

  touchForce = false; kForce = false;

  lookId = null;

/* ===== 30_player.js ===== */
/* JK.Player — third-person movement physics + orbit camera. Owner: player agent.
 *
 * EXPORTS (stable identities — other modules read these every frame):
 *   pos [x,y,z]      FEET position, meters (same array object forever)
 *   yaw              facing, radians, 0 = -Z (character model heading)
 *   vel [x,y,z]      velocity m/s (same array object forever)
 *   onGround         bool
 *   speed2D          horizontal speed m/s
 *   anim             'idle' | 'run' | 'sprint' | 'jump' | 'fall'
 *   camEye/camTarget vec3 arrays (reused, never reallocated)
 *   camYaw/camPitch  camera orbit angles, radians (for aiming modules)
 *   stanceIdx        0 LIGHT / 1 MEDIUM / 2 STRONG (cycled by stance tap)
 *   attackQueued     set true on attack edge; saber module consumes+clears.
 *
 * Feel: JK2-ish — fast accel, heroic 8.5 m/s jump under 22 m/s^2 gravity,
 * camera-relative stick, body turns toward travel at 12 rad/s.
 */
(function(){
'use strict';

/* ---------------- tuning ---------------- */
var WALK_SPEED   = 5.0;    /* m/s */
var SPRINT_SPEED = 8.0;    /* m/s */
var ACCEL_GND    = 40;     /* m/s^2 toward desired vel on ground */
var ACCEL_AIR    = 12;     /* ~30% air control */
var DECEL_GND    = 30;     /* m/s^2 friction when no input on ground */
var TURN_RATE    = 12;     /* rad/s body yaw toward move dir */
var ATTACK_TURN_RATE = 26; /* rad/s — snap to the aim when swinging */
var GRAVITY      = 22;     /* m/s^2 */
var JUMP_VY      = 8.5;    /* m/s — heroic */
var BODY_R       = 0.55;   /* player capsule radius vs obstacle circles */
var SNAP_DOWN    = 0.6;    /* max ground drop we glue to before going airborne */
var STEEP_TAN    = 0.7;    /* uphill grade where slow-down starts (~35 deg) */
var LOOK_SENS    = 0.0045; /* rad per pixel */
var PITCH_MIN    = -1.1, PITCH_MAX = 0.5;
var CAM_DIST     = 4.2, CAM_DIST_SPRINT = 4.8;
var CAM_UP       = 1.55;   /* target height above feet */
var CAM_SMOOTH   = 10;     /* /s exp smoothing on eye */
var DIST_SMOOTH  = 4;      /* /s easing on orbit distance */
var CAM_CLEAR    = 0.35;   /* eye min height above terrain */
var EDGE_SPRING  = 10;     /* /s soft pushback at world border */
var PI = Math.PI, TWO_PI = PI * 2;

/* ---------------- exported arrays (allocated once) ---------------- */
var pos = [0, 0, 6];
var vel = [0, 0, 0];
var camEye = [0, 3, 11];
var camTarget = [0, 1.55, 6];

/* ---------------- internal state ---------------- */
var yaw = 0, camYaw = 0, camPitch = -0.26, camDist = CAM_DIST;
var onGround = true, speed2D = 0, anim = 'idle';
var stanceIdx = 1;              /* template default: MEDIUM */
var lastStanceCt = 0;
var stanceEl = null;
var STANCE_NAMES = ['LIGHT STANCE', 'MEDIUM STANCE', 'STRONG STANCE'];
var EMPTY = [];
var NULL_STATE = { moveX: 0, moveY: 0, lookDX: 0, lookDY: 0,
  jump: false, attack: false, force: false, run: false, stance: 0 };
var DES_EYE = [0, 0, 0];        /* scratch: desired eye before smoothing */

/* ---------------- helpers ---------------- */
function gh(x, z){                       /* defensive ground height */
  var T = JK.Terrain;
  return (T && T.height) ? T.height(x, z) : 0;
}

function softEdge(i, S, dt){             /* soft pushback on axis i (0 or 2) */
  var p = pos[i], over = 0;
  if (p > S) over = p - S; else if (p < -S) over = p + S;
  if (over !== 0){
    var k = EDGE_SPRING * dt; if (k > 1) k = 1;
    pos[i] = p - over * k;
    if (over * vel[i] > 0) vel[i] *= 1 - k;         /* bleed outward speed */
    if (pos[i] > S + 8) pos[i] = S + 8;             /* hard sanity cap */
    else if (pos[i] < -S - 8) pos[i] = -S - 8;
  }
}

/* camera pose from camYaw/camPitch/camDist. snap=true skips smoothing. */
function placeCamera(dt, snap){
  camTarget[0] = pos[0];
  camTarget[1] = pos[1] + CAM_UP;
  camTarget[2] = pos[2];
  var cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  var fx = -Math.sin(camYaw) * cp, fy = sp, fz = -Math.cos(camYaw) * cp;
  DES_EYE[0] = camTarget[0] - fx * camDist;
  DES_EYE[1] = camTarget[1] - fy * camDist;
  DES_EYE[2] = camTarget[2] - fz * camDist;
  var k = snap ? 1 : 1 - Math.exp(-CAM_SMOOTH * dt);
  camEye[0] += (DES_EYE[0] - camEye[0]) * k;
  camEye[1] += (DES_EYE[1] - camEye[1]) * k;
  camEye[2] += (DES_EYE[2] - camEye[2]) * k;
  var floor = gh(camEye[0], camEye[2]) + CAM_CLEAR;  /* never under the sand */
  if (camEye[1] < floor) camEye[1] = floor;
}

function mirror(P){                      /* copy scalars onto the export */
  P.yaw = yaw; P.onGround = onGround; P.speed2D = speed2D; P.anim = anim;
  P.camYaw = camYaw; P.camPitch = camPitch; P.stanceIdx = stanceIdx;
}

/* ---------------- module ---------------- */
JK.Player = {
  pos: pos, yaw: 0, vel: vel, onGround: true, speed2D: 0, anim: 'idle',
  camEye: camEye, camTarget: camTarget,
  camYaw: 0, camPitch: -0.26,
  stanceIdx: 1,
  attackQueued: false,

  /* --- hooks for JK.Powers / JK.Bots (iteration 3+) ---
   * speedMul  multiplies walk/sprint target speed (Force Speed). Default 1.
   * jumped    true only on the frame the player left the ground by jumping.
   * impulse() adds world-space velocity (knockback, Force Jump); an upward
   *           impulse also unsticks the player from the ground the same frame. */
  speedMul: 1,
  jumped: false,
  impulse: function(vx, vy, vz){
    vel[0] += vx || 0; vel[1] += vy || 0; vel[2] += vz || 0;
    if (vy > 0){ onGround = false; pos[1] += 0.02; }
  },

  init: function(){
    pos[0] = 0; pos[2] = 6;                      /* spawn facing origin (-Z) */
    pos[1] = gh(pos[0], pos[2]);                 /* ground at the ACTUAL spawn xz */
    vel[0] = 0; vel[1] = 0; vel[2] = 0;
    yaw = 0; camYaw = 0; camPitch = -0.26; camDist = CAM_DIST;
    onGround = true; speed2D = 0; anim = 'idle';
    stanceIdx = 1; this.attackQueued = false;
    this.speedMul = 1; this.jumped = false;
    stanceEl = document.getElementById('stanceTag');
    if (stanceEl) stanceEl.textContent = STANCE_NAMES[stanceIdx];
    var st = JK.Input && JK.Input.state;
    lastStanceCt = st ? (st.stance | 0) : 0;
    placeCamera(0, true);
    mirror(this);
    JK.GL.setCamera(camEye, camTarget, 72);
  },

  update: function(dt, t){
    var P = JK.Player;
    var st = (JK.Input && JK.Input.state) || NULL_STATE;
    var i;

    /* ---- orbit look: drag right => orbit right, drag up => look up ---- */
    camYaw -= (st.lookDX || 0) * LOOK_SENS;
    if (camYaw > PI) camYaw -= TWO_PI; else if (camYaw < -PI) camYaw += TWO_PI;
    camPitch -= (st.lookDY || 0) * LOOK_SENS;
    if (camPitch < PITCH_MIN) camPitch = PITCH_MIN;
    else if (camPitch > PITCH_MAX) camPitch = PITCH_MAX;

    /* ---- camera-relative desired move ---- */
    var mx = st.moveX || 0, my = st.moveY || 0;
    var mag = Math.sqrt(mx * mx + my * my);
    if (mag > 1){ mx /= mag; my /= mag; mag = 1; }
    var hasMove = mag > 0.12;
    var sprinting = !!(st.runHeld !== undefined ? st.runHeld : st.run);
    var fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw);
    /* right = fwd x up = (-fwdZ, 0, fwdX) */
    var dirX = fwdX * my - fwdZ * mx;
    var dirZ = fwdZ * my + fwdX * mx;

    var dvx = 0, dvz = 0;
    if (hasMove){
      var spd = (sprinting ? SPRINT_SPEED : WALK_SPEED) * mag * (P.speedMul || 1);
      if (onGround){
        /* uphill grade along move dir; >~50deg gets heavily slowed */
        var e = 0.4;
        var hx = (gh(pos[0] + e, pos[2]) - gh(pos[0] - e, pos[2])) / (2 * e);
        var hz = (gh(pos[0], pos[2] + e) - gh(pos[0], pos[2] - e)) / (2 * e);
        var uph = (dirX * hx + dirZ * hz) / mag;
        if (uph > STEEP_TAN){
          var kSlope = 1 - (uph - STEEP_TAN) * 1.4;  /* ~0.3 at 50deg grade */
          if (kSlope < 0.15) kSlope = 0.15;
          spd *= kSlope;
        }
      }
      var s = spd / mag;
      dvx = dirX * s; dvz = dirZ * s;
    }

    /* ---- accelerate toward desired horizontal velocity ---- */
    var ax = dvx - vel[0], az = dvz - vel[2];
    var al = Math.sqrt(ax * ax + az * az);
    var rate = hasMove ? (onGround ? ACCEL_GND : ACCEL_AIR)
                       : (onGround ? DECEL_GND : 0);
    if (al > 1e-6 && rate > 0){
      var step = rate * dt;
      if (step >= al){ vel[0] = dvx; vel[2] = dvz; }
      else { vel[0] += ax / al * step; vel[2] += az / al * step; }
    }

    /* ---- body yaw: face the aim while attacking, else face travel ----
     * A swing must land where the camera is pointing, so an attack overrides
     * the movement-facing and turns hard toward camYaw (JKO does the same). */
    var swinging = !!(JK.Rig && JK.Rig.swingPhase && JK.Rig.swingPhase() >= 0);
    var aiming = swinging || P.attackQueued;
    if (aiming || hasMove){
      var tYaw = aiming ? camYaw : Math.atan2(-dirX, -dirZ);  /* fwd(yaw)=(-sin,-cos) */
      var d = tYaw - yaw;
      d -= TWO_PI * Math.round(d / TWO_PI);
      var mt = (aiming ? ATTACK_TURN_RATE : TURN_RATE) * dt;
      if (d > mt) d = mt; else if (d < -mt) d = -mt;
      yaw += d;
      if (yaw > PI) yaw -= TWO_PI; else if (yaw < -PI) yaw += TWO_PI;
    }

    /* ---- jump / gravity / integrate ---- */
    P.jumped = false;
    if (st.jump && onGround){ vel[1] = JUMP_VY; onGround = false; P.jumped = true; }
    if (onGround) vel[1] = 0; else vel[1] -= GRAVITY * dt;
    pos[0] += vel[0] * dt;
    pos[1] += vel[1] * dt;
    pos[2] += vel[2] * dt;

    /* ---- world border: soft pushback at +/-SIZE ---- */
    var S = (JK.Terrain && JK.Terrain.SIZE) || 350;
    softEdge(0, S, dt);
    softEdge(2, S, dt);

    /* ---- push out of obstacle circles ---- */
    var obs = (JK.Terrain && JK.Terrain.obstacles) || EMPTY;
    for (i = 0; i < obs.length; i++){
      var o = obs[i];
      var dx = pos[0] - o.x, dz = pos[2] - o.z;
      var rr = o.r + BODY_R;
      var d2 = dx * dx + dz * dz;
      if (d2 < rr * rr){
        var dl = Math.sqrt(d2);
        var nx, nz;
        if (dl < 1e-4){ nx = 1; nz = 0; } else { nx = dx / dl; nz = dz / dl; }
        pos[0] = o.x + nx * rr;
        pos[2] = o.z + nz * rr;
        var vn = vel[0] * nx + vel[2] * nz;
        if (vn < 0){ vel[0] -= vn * nx; vel[2] -= vn * nz; }  /* slide */
      }
    }

    /* ---- ground collide / follow ---- */
    var gy = gh(pos[0], pos[2]);
    if (onGround){
      if (gy >= pos[1] - SNAP_DOWN) pos[1] = gy;     /* glue to the dunes */
      else onGround = false;                          /* crest launched us */
    } else if (pos[1] <= gy){
      pos[1] = gy; vel[1] = 0; onGround = true;       /* land: snap */
    }

    /* ---- derived: speed + anim hint ---- */
    speed2D = Math.sqrt(vel[0] * vel[0] + vel[2] * vel[2]);
    if (!onGround) anim = vel[1] > 0.5 ? 'jump' : 'fall';
    else if (speed2D > 6.2) anim = 'sprint';
    else if (speed2D > 0.6) anim = 'run';
    else anim = 'idle';

    /* ---- combat edges (do not consume beyond this) ---- */
    if (st.attack) P.attackQueued = true;             /* saber module clears */
    var stanceEdge;
    if (st.stanceTap !== undefined) stanceEdge = !!st.stanceTap;
    else stanceEdge = (st.stance | 0) !== lastStanceCt;
    lastStanceCt = st.stance | 0;
    if (stanceEdge){
      stanceIdx = (stanceIdx + 1) % 3;
      if (stanceEl) stanceEl.textContent = STANCE_NAMES[stanceIdx];
    }

    /* ---- camera: springy orbit, pulls back while sprinting ---- */
    var wantDist = speed2D > 6.2 ? CAM_DIST_SPRINT : CAM_DIST;
    camDist += (wantDist - camDist) * (1 - Math.exp(-DIST_SMOOTH * dt));
    placeCamera(dt, false);

    mirror(P);
    JK.GL.setCamera(camEye, camTarget, 72);           /* END of update */
  }
};
})();

/* JK.Rig — low-poly humanoid rig + procedural animation + lightsaber(s).
 * Owner: character agent.
 *
 * Shared geometry: ONE set of white part meshes built once (buildMeshes); every
 * instance draws them with per-instance palette tints — bots reuse everything.
 *
 * Instance API (consumed by sabers / ui / future bots):
 *   var rig = JK.Rig.create(palette);

 *     renders. Omit anim/phaseInfo to just render the current pose.

 *   rig.type ('single'|'dual'|'staff'), rig.lunge (current visual offset, m).
 *
 * JK.Rig itself is the player's bridge: init/update/draw run the player rig off
 * JK.Player state. Module-level mirrors of the player instance:
 *   JK.Rig.player, JK.Rig.blades, JK.Rig.tipPos/basePos (aliases),
 *   JK.Rig.setType / setSaber / playSwing / swingPhase / startSwing.

var M = JK.M;

/* ---------------- skeleton constants ---------------- */
var HIP_Y = 0.92;          /* pelvis height above feet */
var PELV2TORSO = 0.10, NECK_Y = 0.52;
var SH_X = 0.26, SH_Y = 0.44;      /* shoulder offset in torso frame */
var UARM = 0.30, LARM = 0.28;      /* arm segment lengths */
var HIP_X = 0.105, HIP_DY = -0.06; /* leg sockets in pelvis frame */
var ULEG = 0.42, LLEG = 0.38;
var HILT_TOP = 0.17, BLADE_LEN = 1.25;
var STAFF_TOP = 0.25;              /* staff hilt is 0.5 m; blades leave both ends */

var MAX_KEYS = 8;
var TWO_PI = Math.PI * 2;

var DEF_PAL = {
  skin:  [0.85, 0.64, 0.47],
  tunic: [0.76, 0.60, 0.38],
  pants: [0.38, 0.26, 0.17],
  boots: [0.16, 0.13, 0.11],
  belt:  [0.28, 0.19, 0.11],
  hair:  [0.33, 0.21, 0.11]

/* ---------------- shared meshes (built once, white; tinted per draw) -------- */
var MESH = null;
var TB = M.make();

function bladeSet(base, sgn){

  return {
    core: GL.mesh(bakedBox(0.04, BLADE_LEN, 0.04, 1,1,1, 0, sgn * mid, 0)),
    g1:   GL.mesh(bakedBox(0.11, BLADE_LEN + 0.08, 0.11, 1,1,1, 0, sgn * (mid + 0.02), 0)),
    g2:   GL.mesh(bakedBox(0.21, BLADE_LEN + 0.18, 0.21, 1,1,1, 0, sgn * (mid + 0.04), 0))
  };
}
function buildMeshes(){
  if (MESH) return;
  var G = JK.Geo, GL = JK.GL;
  MESH = {
    head: GL.mesh(G.merge([
      bakedBox(0.10, 0.10, 0.10, 1,1,1, 0, 0.03, 0),          /* neck */
      bakedBox(0.22, 0.26, 0.24, 1,1,1, 0, 0.17, 0.01)])),    /* skull */
    hair: GL.mesh(G.merge([
      bakedBox(0.24, 0.09, 0.26, 1,1,1, 0, 0.315, -0.005),    /* cap */
      bakedBox(0.24, 0.15, 0.05, 1,1,1, 0, 0.235, -0.145)])), /* back */
    torso: GL.mesh(bakedBox(0.40, 0.50, 0.24, 1,1,1, 0, 0.28, 0)),
    hips:  GL.mesh(bakedBox(0.32, 0.18, 0.21, 1,1,1, 0, -0.035, 0)),
    belt:  GL.mesh(bakedBox(0.36, 0.09, 0.25, 1,1,1, 0, 0.075, 0)),
    uarm:  GL.mesh(bakedBox(0.12, 0.34, 0.13, 1,1,1, 0, -0.13, 0)),
    larm:  GL.mesh(bakedBox(0.10, 0.30, 0.11, 1,1,1, 0, -0.12, 0)),
    hand:  GL.mesh(bakedBox(0.095, 0.11, 0.10, 1,1,1, 0, -0.01, 0)),
    uleg:  GL.mesh(bakedBox(0.15, 0.46, 0.16, 1,1,1, 0, -0.19, 0)),
    lleg:  GL.mesh(bakedBox(0.125, 0.42, 0.135, 1,1,1, 0, -0.17, 0)),
    boot: GL.mesh(G.merge([
      bakedBox(0.13, 0.16, 0.15, 1,1,1, 0, 0.03, 0),          /* shaft */
      bakedBox(0.135, 0.07, 0.26, 1,1,1, 0, -0.045, -0.055)])),/* toe fwd -Z */
    hilt: GL.mesh(G.merge([                                    /* baked colors */
      bakedBox(0.045, 0.24, 0.045, 0.60, 0.61, 0.65, 0, 0.02, 0),
      bakedBox(0.06, 0.05, 0.06, 0.18, 0.18, 0.21, 0, -0.115, 0),
      bakedBox(0.062, 0.07, 0.062, 0.42, 0.43, 0.48, 0, 0.14, 0)])),
    hiltS: GL.mesh(G.merge([                                   /* 0.5 m staff */
      bakedBox(0.045, 0.50, 0.045, 0.60, 0.61, 0.65, 0, 0, 0),
      bakedBox(0.06, 0.10, 0.06, 0.18, 0.18, 0.21, 0, 0, 0),   /* center grip */
      bakedBox(0.062, 0.06, 0.062, 0.42, 0.43, 0.48, 0, 0.22, 0),
      bakedBox(0.062, 0.06, 0.062, 0.42, 0.43, 0.48, 0, -0.22, 0)])),
    blade:  bladeSet(HILT_TOP, 1),   /* single / dual (from a hand hilt)  */
    bladeU: bladeSet(STAFF_TOP, 1),  /* staff up-blade                    */
    bladeD: bladeSet(STAFF_TOP, -1), /* staff down-blade                  */
    /* shadow: emissive dark-sand patch (core shader only blends in additive
       mode, so a thin "pre-shaded" opaque box reads as a shadow with zero
       core edits). */
    shadow: GL.mesh(bakedBox(0.95, 0.02, 1.05, 0.33, 0.25, 0.155, 0, 0, 0))
  };
}
var CORE_OPTS = { emissive: 1, nofog: true };
var SHADOW_OPTS = { emissive: 1 };

/* ---------------- def-swing machinery ----------------
 * Keys normalized at accept into preallocated Float32Array(9) records:
 *   [0]=t, [1]=sp, [2]=sy, [3]=sr, [4]=el, [5]=wr, [6]=ty, [7]=tp, [8]=lunge
 * Snapshots / procedural refs are Float32Array(8) in the same field order
 * (minus t). Left-arm records live in "authored" space: applied syL = -rec[1]
 * so one evaluator serves both sides. Zero alloc after create().            */
var SWR = new Float32Array(8), SWL = new Float32Array(8);
var PROCR = new Float32Array(8), PROCL = new Float32Array(8);
var EMPTY_KEY = {};

/* default slash (the classic iteration-1 swing, authored as a def) */
var DEFAULT_DEF = { dur: SWING_DUR, keys: [
  { t: 0.30, sp: 2.25, sy: 0.0, sr: -0.55, el: 1.00, wr: -0.35, ty: -0.45, tp: 0.08, lunge: 0.00 },
  { t: 0.62, sp: -0.55, sr: 0.95, el: 0.15, wr: 0.55, ty: 0.45, lunge: 0.20 },
  { t: 0.88, sp: 0.45, sr: 0.15, el: 0.60, wr: -0.60, ty: 0.00, tp: 0.04, lunge: 0.00 }
]};

function num(v, d){ return (typeof v === 'number' && v === v) ? v : d; }
function smooth(s){
  if (s < 0) s = 0; else if (s > 1) s = 1;
  return s * s * (3 - 2 * s);
}

/* sample the active swing for one side into out[8].
 * snap = pose at accept, proc = this frame's procedural targets. */
function swingSample(out, sw, snap, proc){
  var u = sw.t / sw.dur, keys = sw.keys, n = sw.n;
  var t0 = keys[0][0], tl = keys[n - 1][0];
  var a, b, ao, bo, s, j;
  if (u <= t0){                       /* blend in from the captured pose */
    a = snap; ao = 0; b = keys[0]; bo = 1;
    s = t0 > 1e-5 ? u / t0 : 1;
  } else if (u >= tl){                /* blend back out to procedural */
    a = keys[n - 1]; ao = 1; b = proc; bo = 0;
    s = (1 - tl) > 1e-5 ? (u - tl) / (1 - tl) : 1;
  } else {                            /* between two keys */
    var i = 0;
    while (i < n - 2 && u > keys[i + 1][0]) i++;
    a = keys[i]; ao = 1; b = keys[i + 1]; bo = 1;
    var span = b[0] - a[0];
    s = span > 1e-6 ? (u - a[0]) / span : 1;
  }
  s = smooth(s);
  for (j = 0; j < 8; j++) out[j] = a[ao + j] + (b[bo + j] - a[ao + j]) * s;
  return out;
}

function playSwing(def){
  var sw = this.swing, p = this.pose;
  if (sw.active && sw.t < sw.dur * CHAIN_FRAC) return false;   /* not chainable yet */
  if (!def || !def.keys || !def.keys.length) def = DEFAULT_DEF; /* defensive */

  /* snapshot current pose (authored space; left sy sign-flipped) */
  var sR = sw.snapR, sL = sw.snapL;
  sR[0] = p.aSwR; sR[1] = p.syR;  sR[2] = p.sprR; sR[3] = p.elbR;
  sR[4] = p.wrist; sR[5] = p.twist; sR[6] = p.lean; sR[7] = this.lunge;
  sL[0] = p.aSwL; sL[1] = -p.syL; sL[2] = p.sprL; sL[3] = p.elbL;
  sL[4] = p.wrL;  sL[5] = p.twist; sL[6] = p.lean; sL[7] = this.lunge;

  /* normalize keys into the preallocated records (missing fields inherit) */
  var n = def.keys.length; if (n > MAX_KEYS) n = MAX_KEYS;
  var prevT = 0;
  for (var i = 0; i < n; i++){
    var src = def.keys[i] || EMPTY_KEY;
    var k = sw.keys[i], pk = i > 0 ? sw.keys[i - 1] : null;
    var kt = num(src.t, i > 0 ? prevT + 0.15 : 0.25);
    if (kt > 1) kt = 1;
    if (i > 0 && kt <= prevT) kt = prevT + 1e-3;   /* keep strictly increasing */
    k[0] = kt; prevT = kt;
    k[1] = num(src.sp,    pk ? pk[1] : sR[0]);
    k[2] = num(src.sy,    pk ? pk[2] : sR[1]);
    k[3] = num(src.sr,    pk ? pk[3] : sR[2]);
    k[4] = num(src.el,    pk ? pk[4] : sR[3]);
    k[5] = num(src.wr,    pk ? pk[5] : sR[4]);
    k[6] = num(src.ty,    pk ? pk[6] : sR[5]);
    k[7] = num(src.tp,    pk ? pk[7] : sR[6]);
    k[8] = num(src.lunge, pk ? pk[8] : sR[7]);
  }
  sw.n = n;
  sw.dur = num(def.dur, SWING_DUR); if (sw.dur < 0.05) sw.dur = 0.05;
  sw.mirror = !!def.mirror;
  sw.t = 0; sw.active = true;
  this.swingT = 0;
  return true;
}

function swingPhase(){
  var sw = this.swing;
  return sw.active ? sw.t / sw.dur : -1;
}

function startSwing(){ return this.playSwing(DEFAULT_DEF); }

function setType(type){
  if (type !== 'dual' && type !== 'staff') type = 'single';
  if (type === this.type) return;
  this.type = type;
  var bl = this.blades;
  bl.length = 1;                       /* blades[0] entry never changes identity */
  if (type !== 'single') bl.push(this._blade2);
}

function setSaber(rgb, on){
  if (rgb){ this.saberCol[0] = rgb[0]; this.saberCol[1] = rgb[1]; this.saberCol[2] = rgb[2]; }
  if (on !== undefined) this.saberOn = !!on;
}

function max0(x){ return x > 0 ? x : 0; }
function ez(c, t, k){ return c + (t - c) * k; }

/* ---------------- per-instance animation step ---------------- */
function advance(dt, t, anim, speed){
  var p = this.pose;
  var sp = speed || 0;

  var stride = 2.2 + sp * 0.16;
  if (stride < 2.4) stride = 2.4; else if (stride > 3.6) stride = 3.6;
  this.phase += sp * dt * TWO_PI / stride;
  if (this.phase > TWO_PI) this.phase -= TWO_PI;
  var ph = this.phase;

  var lSwL, lSwR, kneeL, kneeR, aSwL, aSwR, sprL, sprR, elbL, elbR, wrist;
  var lean, twist, bob, head;
  var syR = 0, syL = 0, wrL = 0, wrr = 0;      /* new joints default neutral */

  if (anim === 'run' || anim === 'sprint'){
    var fast = anim === 'sprint';
    var A = fast ? 0.96 : 0.70;               /* +-55 deg / +-40 deg hips */
    var s1 = Math.sin(ph);
    var kAmp = fast ? 1.35 : 1.05;
    lSwL = A * s1;             lSwR = -A * s1;
    kneeL = -(0.22 + kAmp * max0(Math.cos(ph + 0.5)));
    kneeR = -(0.22 + kAmp * max0(-Math.cos(ph + 0.5)));
    aSwL = 0.06 - (fast ? 0.85 : 0.55) * s1;  /* counter-swing */
    aSwR = 0.35 + (fast ? 0.50 : 0.30) * s1;  /* saber arm swings less */
    sprL = 0.14; sprR = 0.16;
    elbL = 0.60; elbR = 0.55;
    wrist = -0.55;
    lean = fast ? 0.26 : 0.14;                /* ~15 / ~8 deg forward */
    bob = (fast ? 0.045 : 0.030) * (0.5 - 0.5 * Math.cos(2 * ph));
    twist = (fast ? 0.12 : 0.08) * s1;
    head = -lean * 0.6;
  } else if (anim === 'jump'){                /* tucked / trailing legs */
    lSwL = 0.55; lSwR = 0.10;
    kneeL = -1.50; kneeR = -0.75;
    aSwL = -0.55; aSwR = -0.35;               /* arms up-back */
    sprL = 0.85; sprR = 0.70;
    elbL = 0.45; elbR = 0.50;
    wrist = -0.35;
    lean = -0.06; bob = 0; twist = 0; head = 0.10;
  } else if (anim === 'fall'){                /* limbs spread */
    lSwL = 0.35; lSwR = -0.18;
    kneeL = -0.45; kneeR = -0.25;
    aSwL = -0.15; aSwR = -0.05;
    sprL = 1.05; sprR = 0.90;
    elbL = 0.35; elbR = 0.40;
    wrist = -0.50;
    lean = 0.07; bob = 0; twist = 0; head = 0.18;
  } else {                                    /* idle: breathe, saber relaxed */
    lSwL = 0.05; lSwR = -0.05;
    kneeL = -0.09; kneeR = -0.09;
    aSwL = 0.10; aSwR = 0.38;
    sprL = 0.10; sprR = 0.14;
    elbL = 0.28; elbR = 0.55;
    wrist = -0.60 + 0.05 * Math.sin(t * 1.1);
    lean = 0.04; twist = 0;
    bob = 0.013 * Math.sin(t * 1.7);
    head = 0.03 * Math.sin(t * 0.7);
  }

  /* ---- saber-type grip overrides (procedural layer) ---- */
  if (this.type === 'dual' && this.saberOn){
    /* left hand carries a live blade: raised guard, no floppy counter-swing */
    if (anim === 'run' || anim === 'sprint'){
      aSwL = 0.30 - 0.22 * Math.sin(ph);
      sprL = 0.30; elbL = 0.85; syL = 0.12; wrL = -0.50;
    } else if (anim === 'idle'){
      aSwL = 0.42; sprL = 0.32; elbL = 0.88; syL = 0.15;
      wrL = -0.55 + 0.05 * Math.sin(t * 1.3);
    }
  } else if (this.type === 'staff'){
    if (anim === 'idle'){                     /* Maul special: angled across body */
      aSwR = 0.80; syR = 0.45; sprR = 0.02; elbR = 0.70;
      wrist = -0.85; wrr = 0.85;
      twist += 0.12;
      aSwL = 0.28; sprL = 0.24; elbL = 0.55;  /* off hand up and ready */
    } else if (anim === 'run' || anim === 'sprint'){
      aSwR = 0.30 + 0.18 * Math.sin(ph);      /* calm carry, blade tilted */
      sprR = 0.10; elbR = 0.60; wrist = -0.70; wrr = 0.45;
    }
  }

  /* ---- def-swing lifecycle ---- */
  var sw = this.swing;
  if (sw.active){
    sw.t += dt;
    if (sw.t >= sw.dur) sw.active = false;
  }
  if (sw.active){
    wrr = 0;                                  /* both hands square on the hilt */
    if (!sw.mirror && !(this.type === 'dual' && this.saberOn))
      sprL += 0.25;                           /* off arm counterbalances */
  }

  /* exponential ease toward targets (~0.12 s blend) */
  var kA = 1 - Math.exp(-26 * dt);            /* limbs */
  var kB = 1 - Math.exp(-14 * dt);            /* body mass */
  var kR = sw.active ? 1 - Math.exp(-45 * dt) : kA;  /* saber arm snaps */
  p.lSwL = ez(p.lSwL, lSwL, kA);   p.lSwR = ez(p.lSwR, lSwR, kA);
  p.kneeL = ez(p.kneeL, kneeL, kA); p.kneeR = ez(p.kneeR, kneeR, kA);
  p.aSwL = ez(p.aSwL, aSwL, kA);   p.sprL = ez(p.sprL, sprL, kA);
  p.elbL = ez(p.elbL, elbL, kA);   p.syL = ez(p.syL, syL, kA);
  p.wrL = ez(p.wrL, wrL, kA);
  p.aSwR = ez(p.aSwR, aSwR, kR);   p.sprR = ez(p.sprR, sprR, kR);
  p.elbR = ez(p.elbR, elbR, kR);   p.wrist = ez(p.wrist, wrist, kR);
  p.syR = ez(p.syR, syR, kR);      p.wrr = ez(p.wrr, wrr, kR);
  p.bob = ez(p.bob, bob, kB);      p.lean = ez(p.lean, lean, kB);
  p.twist = ez(p.twist, twist, kR); p.head = ez(p.head, head, kB);

  /* ---- def-swing override: exact keyframed pose beats the eased targets ---- */
  if (sw.active){
    PROCR[0] = aSwR; PROCR[1] = syR;  PROCR[2] = sprR; PROCR[3] = elbR;
    PROCR[4] = wrist; PROCR[5] = twist; PROCR[6] = lean; PROCR[7] = 0;
    swingSample(SWR, sw, sw.snapR, PROCR);
    p.aSwR = SWR[0]; p.syR = SWR[1]; p.sprR = SWR[2]; p.elbR = SWR[3];
    p.wrist = SWR[4]; p.twist = SWR[5]; p.lean = SWR[6];
    this.lunge = SWR[7];
    if (sw.mirror){                           /* dual flurry: left arm mirrored */
      PROCL[0] = aSwL; PROCL[1] = -syL; PROCL[2] = sprL; PROCL[3] = elbL;
      PROCL[4] = wrL; PROCL[5] = twist; PROCL[6] = lean; PROCL[7] = 0;
      swingSample(SWL, sw, sw.snapL, PROCL);
      p.aSwL = SWL[0]; p.syL = -SWL[1]; p.sprL = SWL[2]; p.elbL = SWL[3];
      p.wrL = SWL[4];
    }
    this.swingT = sw.t;
  } else {
    this.swingT = -1;
    this.lunge = ez(this.lunge, 0, kB);       /* settle any leftover lunge */
  }
}

/* ---------------- render (module-scope matrix pool: zero alloc) ------------- */
var mRoot = M.make(), mPelv = M.make(), mTorso = M.make(), mA = M.make(), mS = M.make();
var mHR = M.make(), mHL = M.make();           /* hand frames kept for blade pass */

function renderRig(r, pos, yaw){
  var GL = JK.GL, p = r.pose;
  var dual = r.type === 'dual', staff = r.type === 'staff';

  /* lunge: shift the DRAWN body along facing (visual only; fwd = (-sin,-cos)) */
  var lun = r.lunge;
  var px = pos[0] - Math.sin(yaw) * lun;
  var pz = pos[2] - Math.cos(yaw) * lun;

  /* --- ground shadow first (also guarantees frame starts non-additive) --- */
  var gx = px, gz = pz, gy = 0, dhx = 0, dhz = 0, e = 0.6;
  if (JK.Terrain && JK.Terrain.height){
    gy = JK.Terrain.height(gx, gz);
    dhx = (JK.Terrain.height(gx + e, gz) - JK.Terrain.height(gx - e, gz)) / (2 * e);
    dhz = (JK.Terrain.height(gx, gz + e) - JK.Terrain.height(gx, gz - e)) / (2 * e);
  }
  var alt = pos[1] - gy; if (alt < 0) alt = 0;
  var shs = 1 - alt * 0.22; if (shs < 0.35) shs = 0.35;   /* shrinks mid-air */
  M.ident(mS); M.tr(mS, gx, gy + 0.03, gz);
  M.rx(mS, -Math.atan(dhz)); M.rz(mS, Math.atan(dhx));    /* hug the slope */
  M.sc(mS, shs, 1, shs);
  GL.draw(MESH.shadow, mS, SHADOW_OPTS);

  /* --- hierarchy --- */
  M.ident(mRoot); M.tr(mRoot, px, pos[1], pz); M.ry(mRoot, yaw);

  M.copy(mPelv, mRoot); M.tr(mPelv, 0, HIP_Y + p.bob, 0);
  GL.draw(MESH.hips, mPelv, r.oPants);
  GL.draw(MESH.belt, mPelv, r.oBelt);

  M.copy(mTorso, mPelv); M.tr(mTorso, 0, PELV2TORSO, 0);
  M.ry(mTorso, p.twist); M.rx(mTorso, p.lean);
  GL.draw(MESH.torso, mTorso, r.oTunic);

  /* head */
  M.copy(mA, mTorso); M.tr(mA, 0, NECK_Y, 0); M.rx(mA, p.head);
  GL.draw(MESH.head, mA, r.oSkin);
  GL.draw(MESH.hair, mA, r.oHair);

  /* left arm — hand frame kept in mHL for the dual blade pass */
  M.copy(mA, mTorso); M.tr(mA, -SH_X, SH_Y, 0);
  M.rz(mA, -p.sprL); M.ry(mA, p.syL); M.rx(mA, p.aSwL);
  GL.draw(MESH.uarm, mA, r.oTunic);
  M.tr(mA, 0, -UARM, 0); M.rx(mA, p.elbL);
  GL.draw(MESH.larm, mA, r.oTunic);
  M.tr(mA, 0, -LARM, 0); M.rx(mA, p.wrL);
  GL.draw(MESH.hand, mA, r.oSkin);
  if (dual){
    GL.draw(MESH.hilt, mA, null);
    M.copy(mHL, mA);
  }

  /* left leg */
  M.copy(mA, mPelv); M.tr(mA, -HIP_X, HIP_DY, 0); M.rx(mA, p.lSwL);
  GL.draw(MESH.uleg, mA, r.oPants);
  M.tr(mA, 0, -ULEG, 0); M.rx(mA, p.kneeL);
  GL.draw(MESH.lleg, mA, r.oPants);
  M.tr(mA, 0, -LLEG, 0); M.rx(mA, -(p.lSwL + p.kneeL) * 0.6);  /* fake ankle */
  GL.draw(MESH.boot, mA, r.oBoots);

  /* right leg */
  M.copy(mA, mPelv); M.tr(mA, HIP_X, HIP_DY, 0); M.rx(mA, p.lSwR);
  GL.draw(MESH.uleg, mA, r.oPants);
  M.tr(mA, 0, -ULEG, 0); M.rx(mA, p.kneeR);
  GL.draw(MESH.lleg, mA, r.oPants);
  M.tr(mA, 0, -LLEG, 0); M.rx(mA, -(p.lSwR + p.kneeR) * 0.6);
  GL.draw(MESH.boot, mA, r.oBoots);

  /* right (saber) arm — hand frame kept in mHR */
  M.copy(mA, mTorso); M.tr(mA, SH_X, SH_Y, 0);
  M.rz(mA, p.sprR); M.ry(mA, p.syR); M.rx(mA, p.aSwR);
  GL.draw(MESH.uarm, mA, r.oTunic);
  M.tr(mA, 0, -UARM, 0); M.rx(mA, p.elbR);
  GL.draw(MESH.larm, mA, r.oTunic);
  M.tr(mA, 0, -LARM, 0); M.rx(mA, p.wrist); M.rz(mA, p.wrr);
  GL.draw(MESH.hand, mA, r.oSkin);
  GL.draw(staff ? MESH.hiltS : MESH.hilt, mA, null);
  M.copy(mHR, mA);

  /* --- world blade ends for combat (valid every frame, on or off) --- */
  var b0 = r.blades[0], b1 = r.blades.length > 1 ? r.blades[1] : null;
  if (staff){
    M.xp(b0.base, mHR, 0, STAFF_TOP, 0);
    M.xp(b0.tip,  mHR, 0, STAFF_TOP + BLADE_LEN, 0);
    if (b1){
      M.xp(b1.base, mHR, 0, -STAFF_TOP, 0);
      M.xp(b1.tip,  mHR, 0, -STAFF_TOP - BLADE_LEN, 0);
    }
  } else {
    M.xp(b0.base, mHR, 0, HILT_TOP, 0);
    M.xp(b0.tip,  mHR, 0, HILT_TOP + BLADE_LEN, 0);
    if (dual && b1){
      M.xp(b1.base, mHL, 0, HILT_TOP, 0);
      M.xp(b1.tip,  mHL, 0, HILT_TOP + BLADE_LEN, 0);
    }
  }

  /* --- blade glow: always the LAST draws of the rig. Additive shells first,
     opaque cores LAST (final core draw restores blend/depthMask state). --- */
  if (r.saberOn){
    if (staff){
      GL.draw(MESH.bladeU.g2, mHR, r.oGlow2);
      GL.draw(MESH.bladeD.g2, mHR, r.oGlow2);
      GL.draw(MESH.bladeU.g1, mHR, r.oGlow1);
      GL.draw(MESH.bladeD.g1, mHR, r.oGlow1);
      GL.draw(MESH.bladeU.core, mHR, CORE_OPTS);
      GL.draw(MESH.bladeD.core, mHR, CORE_OPTS);
    } else {
      GL.draw(MESH.blade.g2, mHR, r.oGlow2);          /* faint outer shell */
      if (dual) GL.draw(MESH.blade.g2, mHL, r.oGlow2);
      GL.draw(MESH.blade.g1, mHR, r.oGlow1);          /* hot inner shell */
      if (dual) GL.draw(MESH.blade.g1, mHL, r.oGlow1);
      GL.draw(MESH.blade.core, mHR, CORE_OPTS);
      if (dual) GL.draw(MESH.blade.core, mHL, CORE_OPTS);
    }
  }
}

function instanceDraw(pos, yaw, anim, phaseInfo){
  if (phaseInfo){
    this.advance(phaseInfo.dt || 0, phaseInfo.t || 0, anim || 'idle',
      phaseInfo.speed !== undefined ? phaseInfo.speed : (phaseInfo.speed2D || 0));
  }
  renderRig(this, pos, yaw);
}

/* ---------------- factory ---------------- */
function col3(a, d){
  var o = new Float32Array(3);
  a = a || d;
  o[0] = a[0]; o[1] = a[1]; o[2] = a[2];
  return o;
}

function create(palette){
  buildMeshes();

  for (i = 0; i < MAX_KEYS; i++) kf.push(new Float32Array(9));

  };
  /* blades: entries preallocated once; blades[0] aliases basePos/tipPos and the
     array is mutated in place by setType (identity-stable for consumers). */
  rig.blades = [{ base: rig.basePos, tip: rig.tipPos }];
  rig._blade2 = { base: new Float32Array(3), tip: new Float32Array(3) };

  rig.oSkin  = { tint: col3(pal.skin,  DEF_PAL.skin)  };

  rig.oGlow2 = { emissive: 1, nofog: true, additive: true, alpha: 0.25, tint: rig.saberCol };

JK.Rig = {

 *
 * Three stances (JK.Player.stanceIdx): 0 LIGHT / 1 MEDIUM / 2 STRONG.

 *                  pb/pt = prev base/tip, cb/ct = cur base/tip — COPIES (never aliases
 *                  of rig.blades). First active frame: prev == cur (no teleport sweep).
