/* ---------------- persisted settings ---------------- */
function loadSettings(){
  var t = null, rgb = null, raw = null;
  try { t = localStorage.getItem(LS_TYPE); } catch (e) {}
  try {
    raw = localStorage.getItem(LS_RGB);
    if (raw) rgb = JSON.parse(raw);
  } catch (e) { rgb = null; }

  if (rgb && rgb.length === 3 &&
      typeof rgb[0] === 'number' && typeof rgb[1] === 'number' && typeof rgb[2] === 'number'){
    cur[0] = clamp255(rgb[0] * 255);
    cur[1] = clamp255(rgb[1] * 255);
    cur[2] = clamp255(rgb[2] * 255);
  } else {
    /* no stored color: mirror whatever the rig is currently wearing */
    var R = JK.Rig, sc = R && R.player && R.player.saberCol;
    if (sc){
      cur[0] = clamp255(sc[0] * 255);
      cur[1] = clamp255(sc[1] * 255);
      cur[2] = clamp255(sc[2] * 255);
    }
  }

  if (TYPES.indexOf(t) >= 0) curType = t;
  else {
    var R2 = JK.Rig;
    if (R2 && R2.player && TYPES.indexOf(R2.player.type) >= 0) curType = R2.player.type;
  }
}

/* ---------------- module ---------------- */
var Ui = JK.Ui = {
  init: function(){
    if (inited) return;
    inited = true;

    loadSettings();          /* read BEFORE build so sliders spawn at the value */
    build();
    applyType(curType, false);   /* Rig.init already ran (40 < 60 in SYSTEMS) */
    applyColor(false);
    setOpen(false);

    /* HUD hooks + baselines */
    hpEl = document.getElementById('hpFill');
    fpEl = document.getElementById('fpFill');
    cHp = cHpMax = cFp = cFpMax = -1;
    var ft = document.getElementById('forceTag');
    if (ft) ft.textContent = '';                  /* placeholder until Powers */
    var S = JK.Sabers;
    lastAtkId = S ? (S.attackId | 0) : 0;
    var lh = JK.Combat && JK.Combat.lastHit;      /* don't replay a stale hit */
    lastHitT = lh ? lh.t : null;
    lastHitD = lh ? lh.dmg : null;
  },

  update: function(dt, t){
    /* ---- bars: write width ONLY when the value changed ---- */
    var g = JK.game;
    if (g){
      if (hpEl && (g.hp !== cHp || g.hpMax !== cHpMax)){
        cHp = g.hp; cHpMax = g.hpMax;
        var wh = (cHpMax > 0 ? cHp / cHpMax : 0) * 100;
        if (!(wh > 0)) wh = 0; else if (wh > 100) wh = 100;
        hpEl.style.width = wh.toFixed(1) + '%';
      }
      if (fpEl && (g.force !== cFp || g.forceMax !== cFpMax)){
        cFp = g.force; cFpMax = g.forceMax;
        var wf = (cFpMax > 0 ? cFp / cFpMax : 0) * 100;
        if (!(wf > 0)) wf = 0; else if (wf > 100) wf = 100;
        fpEl.style.width = wf.toFixed(1) + '%';
      }
    }

    /* ---- attack name flash on new swing id ---- */
    var S = JK.Sabers;
    if (S && S.attackId !== lastAtkId){
      lastAtkId = S.attackId;
      if (feedName && S.attackName){
        feedName.textContent = S.attackName;
        flash(feedName);
      }
    }

    /* ---- gold damage pop on JK.Combat.lastHit change ---- */
    var lh = JK.Combat && JK.Combat.lastHit;
    if (lh && (lh.t !== lastHitT || lh.dmg !== lastHitD)){
      lastHitT = lh.t; lastHitD = lh.dmg;
      if (feedDmg){
        feedDmg.textContent = '-' + Math.round(lh.dmg || 0);
        flash(feedDmg);
      }
    }

    /* ---- standalone-test resilience: if the rig showed up late, push once ---- */
    if ((!typePushed || !colPushed) && JK.Rig){
      if (!typePushed) typePushed = rigSetType(curType);
      if (!colPushed){
        F3[0] = cur[0] / 255; F3[1] = cur[1] / 255; F3[2] = cur[2] / 255;
        colPushed = rigSetSaber(F3);
      }
    }
  },

  /* small conveniences for harnesses / future modules */
  isOpen: function(){ return open; },
  toggle: function(){ setOpen(!open); }
};

/* ===== 65_audio.js ===== */
/* JK.Audio — 100% procedural WebAudio (no samples, no network). Owner: audio agent.
 *
 * Every sound is synthesised from oscillators + three noise buffers built once at
 * init(). init() runs inside the ENTER-THE-DUNES tap, so the iOS AudioContext is
 * created and unlocked by a real user gesture; a self-removing touchend/mousedown
 * listener, an onstatechange hook and a 1 Hz poll in update() bring it back if
 * WebKit later parks it in 'suspended' OR 'interrupted' (call/Siri/alarm) — it
 * never resumes itself, and we schedule nothing at all while it is down.
 *
 * API (CONVENTIONS.md "ITERATION 3+4 CONTRACTS"):
 *   JK.Audio.play(name, opt)   opt = {pos:[x,y,z], vol, rate}
 *       pos  -> distance attenuation (silent past 55 m) + stereo pan derived from
 *               JK.GL.eye and JK.Player.camYaw (StereoPannerNode, graceful
 *               fallback to plain gain on old iOS).
 *       vol  -> 0..1 multiplier on the sound's authored level.
 *       rate -> pitch/speed multiplier (used by 'swing' for the doppler whoosh).
 *       Unknown names, muted, no-WebAudio, a down context or NaN pos/vol =>
 *       silent no-op, never throws.
 *   JK.Audio.hum(on, intensity)  the ONE persistent saber drone voice.
 *   JK.Audio.setMute(b) / toggle() / .muted / .enabled / .ctx / .stopAll()
 *
 * Names implemented: saberOn saberOff swing clash hit blaster boltHit deflect
 *   jump land hurt die botDie push pull lightning grip speed forceFail select
 *
 * SELF-DRIVEN (the frozen iteration-1/2 modules predate audio and never call us,
 * so we read their public state instead of editing them): saber ignite/extinguish,
 * swing whooshes (JK.Sabers.attackId), saber hits (JK.Combat.lastHit + hitPos),
 * jump/land (JK.Player.jumped / onGround edge), hurt/die (JK.game.hp, JK.Hero.dead),
 * stance blips, and the hum intensity (swing phase + ground speed). Powers / Blaster
 * / Bots call play() themselves; a per-sound retrigger gap dedupes any overlap.
 *
 * Budget: ONE persistent hum graph + 16 persistent voice slots (gain[+panner]).
 * One-shots create only their own short-lived source/filter/env nodes, are reaped
 * by time in update(), and the quietest voice is dropped when the pool is full.
 */
(function(){
'use strict';

/* ============================== tuning ================================= */
var MAXV      = 16;      /* hard cap on simultaneous one-shot voices */
var NMAX      = 16;      /* nodes tracked per voice */
var MASTER_V  = 0.85;
var ROLLOFF   = 55.0;    /* metres to silence */
var REF_D     = 12.0;    /* metres where the 1/(1+d) curve is half */
var PAN_W     = 0.85;    /* max |pan| */
var LOOKAHEAD = 0.004;   /* s — never schedule exactly at currentTime */

/* ============================== state ================================== */
var ctx = null, master = null, comp = null;
var ok = false, muted = false, hasPan = false;
var bufW = null, bufP = null, bufC = null;      /* white / pink / crackle */
var voices = [];
var btn = null;

/* hum graph (persistent) */
var humO1 = null, humO2 = null, humO3 = null, humLP = null, humWob = null, humG = null;
var humOn = false, humGain = -1, humFc = -1, humF0 = -1, humDet = -1;

/* self-drive edge trackers */
var lastAtkId = 0, wasLit = false, wasGround = true, prevVy = 0;
var lastHp = -1, wasDead = false, lastStance = -1, lastHitT = -1e9;
var resumeTry = 0, wasRun = false;

/* scratch opt for our own self-driven play() calls: zero allocation per event */
var SOPT = { pos: null, vol: 1, rate: 1 };
function so(pos, vol, rate){
  SOPT.pos = pos || null;
  SOPT.vol = vol === undefined ? 1 : vol;
  SOPT.rate = rate || 1;
  return SOPT;
}

/* ============================ tiny helpers ============================= */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* iOS/WebKit has THREE non-running states: 'suspended' (never unlocked, or we
 * suspended it ourselves), 'closed', and the WebKit-only 'interrupted' (phone
 * call, Siri, alarm, another app grabbing the audio session). None of them ever
 * self-resume, and while any of them is in effect ctx.currentTime is FROZEN —
 * scheduling into it piles every sound up at the same timestamp so they all fire
 * in one blast the moment audio comes back. Old engines have no .state at all. */
function running(){
  if (!ctx) return false;
  var s = ctx.state;
  return s === undefined || s === 'running';
}

function trk(v, n){ if (v.nc < NMAX) v.n[v.nc++] = n; return n; }

/* oscillator: lives `life` s, frequency f0 -> f1 over `ramp` s (exp by default) */
function osc(v, type, t0, life, f0, f1, ramp, lin){
  var o = ctx.createOscillator();
  try { o.type = type; } catch (e) { o.type = 'square'; }
  if (f0 < 1) f0 = 1;
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== undefined && f1 !== null && f1 !== f0){
    if (f1 < 1) f1 = 1;
    if (lin) o.frequency.linearRampToValueAtTime(f1, t0 + (ramp || life));
    else o.frequency.exponentialRampToValueAtTime(f1, t0 + (ramp || life));
  }
  o.start(t0);
  o.stop(t0 + life + 0.02);
  return trk(v, o);
}

/* looping noise source, random start offset so repeats never phase-lock */
function noz(v, buf, t0, life, rate){
  var s = ctx.createBufferSource();
  s.buffer = buf;
  s.loop = true;
  if (rate && rate !== 1) s.playbackRate.value = rate;
  var off = Math.random() * (buf.duration - 0.02);
  if (off < 0) off = 0;
  s.start(t0, off);
  s.stop(t0 + life + 0.02);
  return trk(v, s);
}

function flt(v, type, t0, ramp, f0, f1, q){
  var f = ctx.createBiquadFilter();
  f.type = type;
  if (q) f.Q.value = q;
  if (f0 < 20) f0 = 20;
  f.frequency.setValueAtTime(f0, t0);
  if (f1 !== undefined && f1 !== null && f1 !== f0){
    if (f1 < 20) f1 = 20;
    f.frequency.exponentialRampToValueAtTime(f1, t0 + ramp);
  }
  return trk(v, f);
}

/* attack / (hold) / exponential decay envelope */
function env(v, t0, peak, a, d, hold){
  var g = ctx.createGain(), p = g.gain;
  if (peak < 0.0004) peak = 0.0004;
  if (a < 0.001) a = 0.001;
  p.setValueAtTime(0.0001, t0);
  p.linearRampToValueAtTime(peak, t0 + a);
  var te = t0 + a;
  if (hold){ te += hold; p.setValueAtTime(peak, te); }
  p.exponentialRampToValueAtTime(0.0001, te + d);
  return trk(v, g);
}

/* ============================ noise buffers ============================ */
function mkWhite(sec){
  var n = Math.floor(ctx.sampleRate * sec) || 1;
  var b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), i;
  for (i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function mkPink(sec){                      /* Paul Kellet's economy pink filter */
  var n = Math.floor(ctx.sampleRate * sec) || 1;
  var b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  var b0 = 0, b1 = 0, b2 = 0, i, w;
  for (i = 0; i < n; i++){
    w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.28;
  }
  return b;
}
function mkCrackle(sec){                   /* sparse decaying impulses: electric */
  var n = Math.floor(ctx.sampleRate * sec) || 1;
  var b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  var i, amp = 0, dec = 0;
  for (i = 0; i < n; i++){
    if (amp < 0.02 && Math.random() < 0.010){       /* strike */
      amp = 0.55 + Math.random() * 0.45;
      dec = 0.9985 - Math.random() * 0.0035;
    }
    d[i] = amp > 0.001 ? (Math.random() * 2 - 1) * amp : 0;
    amp *= dec;
  }
  return b;
}

/* ======================= sound generators (2002 flavour) ==============
 * Each returns its total duration in seconds. `v.out` is the voice output. */

function sSaberOn(v, t0){                  /* rising whoosh + ignition snap */
  noz(v, bufP, t0, 0.42, 1)
    .connect(flt(v, 'bandpass', t0, 0.30, 190, 1600, 1.4))
    .connect(env(v, t0, 0.50, 0.06, 0.40)).connect(v.out);
  osc(v, 'sawtooth', t0, 0.34, 70, 320, 0.28)
    .connect(flt(v, 'lowpass', t0, 0.28, 280, 1500, 2.0))
    .connect(env(v, t0, 0.30, 0.05, 0.36)).connect(v.out);
  var ts = t0 + 0.23;                      /* the SNAP */
  noz(v, bufW, ts, 0.06, 1)
    .connect(flt(v, 'highpass', ts, 0.05, 1200, 1200, 0.8))
    .connect(env(v, ts, 0.45, 0.003, 0.07)).connect(v.out);
  return 0.55;
}

function sSaberOff(v, t0){                 /* falling whoosh, power-down thud */
  noz(v, bufP, t0, 0.40, 1)
    .connect(flt(v, 'bandpass', t0, 0.32, 1500, 190, 1.4))
    .connect(env(v, t0, 0.42, 0.02, 0.40)).connect(v.out);
  osc(v, 'sawtooth', t0, 0.36, 300, 70, 0.30)
    .connect(flt(v, 'lowpass', t0, 0.30, 1400, 220, 2.0))
    .connect(env(v, t0, 0.26, 0.02, 0.34)).connect(v.out);
  osc(v, 'sine', t0 + 0.20, 0.22, 92, 44, 0.20)
    .connect(env(v, t0 + 0.20, 0.30, 0.01, 0.20)).connect(v.out);
  return 0.48;
}

function sSwing(v, t0, r){                 /* doppler whoosh; r = swing speed */
  var d = 0.30 / r;
  var f = flt(v, 'bandpass', t0, d * 0.45, 330 * r, 1500 * r, 2.4);
  f.frequency.exponentialRampToValueAtTime(390 * r, t0 + d);   /* pass-by fall */
  noz(v, bufW, t0, d, 1).connect(f)
    .connect(env(v, t0, 0.52, d * 0.34, d * 0.80)).connect(v.out);
  osc(v, 'sine', t0, d * 0.9, 150 * r, 88 * r, d * 0.9)
    .connect(env(v, t0, 0.13, d * 0.3, d * 0.6)).connect(v.out);
  return d + 0.10;
}

function sClash(v, t0, r){                 /* bright inharmonic metal ring */
  var f1 = 1150 * r, f2 = 1723 * r, f3 = 2490 * r;
  osc(v, 'triangle', t0, 0.38, f1, f1 * 0.94, 0.36)
    .connect(env(v, t0, 0.20, 0.003, 0.36)).connect(v.out);
  osc(v, 'square', t0, 0.28, f2, f2 * 0.95, 0.26)
    .connect(env(v, t0, 0.10, 0.003, 0.26)).connect(v.out);
  osc(v, 'sine', t0, 0.20, f3, f3 * 0.93, 0.18)
    .connect(env(v, t0, 0.09, 0.002, 0.18)).connect(v.out);
  noz(v, bufW, t0, 0.07, 1)                /* strike transient */
    .connect(flt(v, 'highpass', t0, 0.06, 2400, 2400, 0.8))
    .connect(env(v, t0, 0.50, 0.002, 0.07)).connect(v.out);

}

  p.setValueAtTime(0.30, t0 + 0.06);
  p.linearRampToValueAtTime(0.10, t0 + 0.085);
  p.linearRampToValueAtTime(0.28, t0 + 0.105);
  p.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  trk(v, g).connect(v.out);
  osc(v, 'square', t0, 0.26, 118, 92, 0.24)
    .connect(flt(v, 'lowpass', t0, 0.20, 380, 300, 1.0)).connect(g);
  osc(v, 'sine', t0, 0.24, 59, 47, 0.22).connect(g);
  return 0.30;

/* ============================ sound table ============================== */
/* vol: authored level. gap: minimum retrigger interval (floods are dropped —
 * this also silently dedupes a sibling module playing what we self-drive).
 * pri: importance when the 16-voice pool has to shed something. */
function D(fn, vol, gap, pri){ return { fn: fn, vol: vol, gap: gap, pri: pri, last: -1e9 }; }
var DEFS = {
  saberOn:   D(sSaberOn,   0.90, 0.30, 1.00),
  saberOff:  D(sSaberOff,  0.85, 0.30, 1.00),
  swing:     D(sSwing,     0.80, 0.06, 0.80),
  clash:     D(sClash,     0.95, 0.05, 0.95),
  hit:       D(sHit,       0.90, 0.05, 0.90),
  blaster:   D(sBlaster,   0.70, 0.03, 0.60),
  boltHit:   D(sBoltHit,   0.70, 0.04, 0.55),
  deflect:   D(sDeflect,   0.95, 0.05, 0.95),
  jump:      D(sJump,      0.55, 0.12, 0.60),
  land:      D(sLand,      0.65, 0.12, 0.60),
  hurt:      D(sHurt,      0.85, 0.14, 0.85),
  die:       D(sDie,       1.00, 0.80, 1.00),
  botDie:    D(sBotDie,    0.85, 0.10, 0.90),
  push:      D(sPush,      0.95, 0.12, 0.95),
  pull:      D(sPull,      0.90, 0.12, 0.95),
  lightning: D(sLightning, 0.75, 0.09, 0.90),
  grip:      D(sGrip,      0.80, 0.35, 0.85),
  speed:     D(sSpeed,     0.75, 0.40, 0.80),
  forceFail: D(sForceFail, 0.70, 0.25, 0.50),
  select:    D(sSelect,    0.55, 0.05, 0.45)
};

/* ============================ voice pool =============================== */
function makeVoices(){
  for (var i = 0; i < MAXV; i++){
    var out = ctx.createGain();
    out.gain.value = 0;
    var pan = null;
    if (hasPan){
      pan = ctx.createStereoPanner();
      out.connect(pan); pan.connect(master);
    } else {
      out.connect(master);              /* graceful fallback: gain only, no pan */
    }
    voices.push({ out: out, pan: pan, busy: false, end: 0, score: 0,
                  n: new Array(NMAX), nc: 0 });
  }
}

function release(v){
  for (var i = 0; i < v.nc; i++){
    var n = v.n[i];
    if (n){
      if (typeof n.stop === 'function'){ try { n.stop(0); } catch (e){} }
      try { n.disconnect(); } catch (e2){}
      v.n[i] = null;
    }
  }
  v.nc = 0; v.busy = false; v.end = 0; v.score = 0;
  try { v.out.gain.cancelScheduledValues(0); } catch (e3){}
  v.out.gain.value = 0;
}

/* free slot, else steal the quietest/soonest-finished voice if we outrank it */
function alloc(score, now){
  var i, v, worst = null, ws = 1e9;
  for (i = 0; i < voices.length; i++){
    v = voices[i];
    if (!v.busy) return v;
    if (v.end <= now){ release(v); return v; }
    var s = v.score * ((v.end - now) < 0.16 ? 0.35 : 1);
    if (s < ws){ ws = s; worst = v; }
  }
  if (worst && score > ws){ release(worst); return worst; }
  return null;                            /* pool full of louder things: drop */
}

/* ========================= positional maths ============================ */
var SPG = 1, SPP = 0;
function spatial(pos){
  SPG = 1; SPP = 0;
  var eye = JK.GL && JK.GL.eye;
  if (!eye || !pos) return;
  var dx = pos[0] - eye[0], dy = pos[1] - eye[1], dz = pos[2] - eye[2];
  var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (!(d < ROLLOFF)){ SPG = 0; return; }  /* also catches NaN/short pos arrays */
  var fade = 1 - d / ROLLOFF;              /* linear taper to true silence */
  SPG = (REF_D / (REF_D + d)) * fade * 1.1;
  if (SPG > 1) SPG = 1;
  var hl = Math.sqrt(dx * dx + dz * dz);
  if (hl < 0.001) return;
  var cy = (JK.Player && JK.Player.camYaw) || 0;
  /* camera right = fwd x up, fwd = (-sin cy, 0, -cos cy) => right = (cos, 0, -sin) */
  var p = (dx * Math.cos(cy) - dz * Math.sin(cy)) / hl;
  if (d < 2) p *= d * 0.5;                /* don't hard-pan things in your face */
  SPP = clamp(p, -1, 1) * PAN_W;
}

/* ============================== hum ==================================== */
function buildHum(){
  humG = ctx.createGain();   humG.gain.value = 0;
  humWob = ctx.createGain(); humWob.gain.value = 1;
  humLP = ctx.createBiquadFilter();
  humLP.type = 'lowpass'; humLP.frequency.value = 360; humLP.Q.value = 3.5;

  humO1 = ctx.createOscillator(); humO1.type = 'sawtooth'; humO1.frequency.value = 61;
  humO2 = ctx.createOscillator(); humO2.type = 'sawtooth'; humO2.frequency.value = 61;
  humO2.detune.value = 11;
  humO3 = ctx.createOscillator(); humO3.type = 'triangle'; humO3.frequency.value = 122;
  var g3 = ctx.createGain(); g3.gain.value = 0.35;

  humO1.connect(humLP); humO2.connect(humLP); humO3.connect(g3); g3.connect(humLP);
  humLP.connect(humWob); humWob.connect(humG); humG.connect(master);

  /* amplitude wobble rides on humWob so a zero humG is truly silent */
  var lfoA = ctx.createOscillator(); lfoA.type = 'sine'; lfoA.frequency.value = 5.3;
  var lfoAg = ctx.createGain(); lfoAg.gain.value = 0.11;
  lfoA.connect(lfoAg); lfoAg.connect(humWob.gain);
  /* slow filter drift keeps the drone alive */
  var lfoB = ctx.createOscillator(); lfoB.type = 'sine'; lfoB.frequency.value = 0.7;
  var lfoBg = ctx.createGain(); lfoBg.gain.value = 30;
  lfoB.connect(lfoBg); lfoBg.connect(humLP.detune);

  var t = ctx.currentTime;
  humO1.start(t); humO2.start(t); humO3.start(t); lfoA.start(t); lfoB.start(t);
}

function hum(on, intensity){
  if (!ok || !humG) return;
  humOn = !!on;
  if (!running()) return;    /* frozen clock — re-applied when audio comes back */
  var i = intensity;
  if (!(i >= 0)) i = 0; else if (i > 2) i = 2;
  var t = ctx.currentTime;
  var wantG = (humOn && !muted) ? (0.048 + 0.070 * i) : 0;
  var wantF = 320 + 640 * i;
  var wantP = 61 + 10 * i;
  var wantD = 9 + 26 * i;
  if (Math.abs(wantG - humGain) > 0.0035 || (wantG === 0) !== (humGain === 0)){
    humGain = wantG;
    humG.gain.setTargetAtTime(wantG, t, 0.055);
  }
  if (Math.abs(wantF - humFc) > 12){
    humFc = wantF;
    humLP.frequency.setTargetAtTime(wantF, t, 0.05);
  }
  if (Math.abs(wantP - humF0) > 0.4){
    humF0 = wantP;
    humO1.frequency.setTargetAtTime(wantP, t, 0.06);
    humO2.frequency.setTargetAtTime(wantP, t, 0.06);
    humO3.frequency.setTargetAtTime(wantP * 2, t, 0.06);
  }
  if (Math.abs(wantD - humDet) > 1.5){
    humDet = wantD;
    humO2.detune.setTargetAtTime(wantD, t, 0.06);
  }
}

/* ============================== play =================================== */
function play(name, opt){
  if (!ok || muted || !running()) return;
  /* own-property + callable test: DEFS['toString'] etc. inherit from
   * Object.prototype and would otherwise sail past a plain truthiness check. */
  var def = DEFS.hasOwnProperty(name) ? DEFS[name] : null;
  if (!def || typeof def.fn !== 'function') return;   /* unknown name: no-op */
  var now = ctx.currentTime;
  if (now - def.last < def.gap) return;    /* flood guard / cross-module dedupe */

  var vol = def.vol, rate = 1, pan = 0;
  if (opt){
    if (opt.vol !== undefined && opt.vol !== null) vol *= opt.vol;
    if (opt.rate > 0) rate = clamp(opt.rate, 0.35, 3);
    if (opt.pos){
      spatial(opt.pos);
      vol *= SPG; pan = SPP;
      if (vol < 0.004) return;             /* out of earshot */
    }
  }
  /* NaN-safe: a bad pos/vol from a sibling must go silent, never throw an
   * AudioParam TypeError up through update() into the game loop. */
  if (!(vol > 0)) return;
  if (vol > 1.4) vol = 1.4;
  if (!(pan >= -1 && pan <= 1)) pan = 0;

  var v = alloc(vol * def.pri, now);
  if (!v) return;
  def.last = now;
  v.busy = true; v.nc = 0; v.score = vol * def.pri;
  v.out.gain.cancelScheduledValues(now);
  v.out.gain.setValueAtTime(vol, now);
  if (v.pan) v.pan.pan.setValueAtTime(pan, now);

  var t0 = now + LOOKAHEAD, dur;
  try {
    dur = def.fn(v, t0, rate);
  } catch (e){
    release(v);
    return;
  }
  v.end = t0 + (dur || 0.3) + 0.08;
}

function reap(){
  var now = ctx.currentTime;
  for (var i = 0; i < voices.length; i++){
    var v = voices[i];
    if (v.busy && v.end <= now) release(v);
  }
}

/* ============================ mute button ============================== */
var CSS =
'#jkaBtn{position:absolute;z-index:6;width:44px;height:44px;border-radius:50%;' +
'right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));' +
'border:2px solid rgba(200,210,170,.35);background:rgba(20,26,12,.35);' +
'color:rgba(220,228,190,.85);font:700 9px/40px "Trebuchet MS","Verdana",sans-serif;' +
'text-align:center;letter-spacing:.06em;pointer-events:auto;touch-action:none;' +
'text-shadow:1px 1px 0 #000;-webkit-user-select:none;user-select:none;}' +
'#jkaBtn.dn{transform:scale(.92);background:rgba(160,200,90,.25);' +

'#jkaBtn.off{color:#e08a6a;border-color:rgba(224,138,106,.45);' +
'background:rgba(42,16,10,.42);}';

function applyMute(){
  if (master){
    var t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(muted ? 0 : MASTER_V, t, 0.03);
  }
  if (muted && humG){ humGain = 0; humG.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
  if (btn){
    btn.textContent = muted ? 'MUTE' : 'SND';
    if (muted) btn.classList.add('off'); else btn.classList.remove('off');
  }
  Audio.muted = muted;
  try { window.localStorage.setItem('jk_mute', muted ? '1' : '0'); } catch (e){}
}

function setMute(m){
  m = !!m;
  if (m === muted){ applyMute(); return; }
  muted = m;
  if (muted) stopAll();
  else prime();          /* don't replay everything that happened while muted */
  applyMute();
}

function onDown(e){
  if (e.preventDefault) e.preventDefault();
  if (e.stopPropagation) e.stopPropagation();
  btn.classList.add('dn');
}
function onUp(e){
  if (e.preventDefault) e.preventDefault();
  if (e.stopPropagation) e.stopPropagation();
  btn.classList.remove('dn');
  setMute(!muted);
  if (!muted) play('select');
}
function onCancel(e){
  if (e.stopPropagation) e.stopPropagation();
  btn.classList.remove('dn');
}

function buildDom(){
  if (btn || !document.body) return;
  var st = document.createElement('style');
  st.id = 'jkaCss';
  st.appendChild(document.createTextNode(CSS));
  document.head.appendChild(st);
  btn = document.createElement('div');
  btn.id = 'jkaBtn';
  btn.textContent = 'SND';
  document.body.appendChild(btn);
  btn.addEventListener('touchstart', onDown, { passive: false });
  btn.addEventListener('touchend', onUp, { passive: false });
  btn.addEventListener('touchcancel', onCancel, { passive: false });
  btn.addEventListener('mousedown', function(e){ if (e.button === 0) onDown(e); });
  btn.addEventListener('mouseup', function(e){ if (e.button === 0) onUp(e); });
  btn.addEventListener('mouseleave', onCancel);
  btn.addEventListener('click', function(e){ e.stopPropagation(); e.preventDefault(); });
}

/* ======================= context unlock / lifecycle ==================== */
function nop(){}
function tryResume(){
  if (!ctx || running() || ctx.state === 'closed') return;
  try {
    var pr = ctx.resume();               /* 'suspended' AND WebKit 'interrupted' */
    /* resume() rejects when Safari refuses outside a gesture; an unhandled
     * rejection would spam the console (and any unhandledrejection handler). */
    if (pr && pr['catch']) pr['catch'](nop);
  } catch (e){}
}
function onState(){                      /* WebKit fires this when a call ends */
  if (!document.hidden) tryResume();
}
function unlock(){
  tryResume();
  if (!ctx || running()){
    document.removeEventListener('touchend', unlock, true);
    document.removeEventListener('mousedown', unlock, true);
  }
}
function onVis(){
  if (!ctx) return;
  if (document.hidden){ try { ctx.suspend(); } catch (e){} }
  else tryResume();
}

/* Snapshot every sibling value the self-drive edges compare against, so a gap in
 * our service (boot, unmute, an audio interruption) never dumps a pile of stale
 * events into one frame. wasLit stays false on purpose: the saber SHOULD ignite
 * audibly the first frame we can actually be heard. */
function prime(){
  var P = JK.Player;
  lastStance = P ? (P.stanceIdx | 0) : 1;
  wasGround  = P ? !!P.onGround : true;
  prevVy     = (P && P.vel) ? (P.vel[1] || 0) : 0;
  lastHp     = (JK.game && typeof JK.game.hp === 'number') ? JK.game.hp : -1;
  wasDead    = !!(JK.Hero && JK.Hero.dead);
  lastAtkId  = (JK.Sabers && JK.Sabers.attackId) || 0;
  lastHitT   = (JK.Combat && JK.Combat.lastHit) ? JK.Combat.lastHit.t : -1e9;
  wasLit     = false;
}

function stopAll(){
  if (!ok) return;
  for (var i = 0; i < voices.length; i++) if (voices[i].busy) release(voices[i]);
  if (humG){ humGain = 0; humG.gain.setTargetAtTime(0, ctx.currentTime, 0.03); }
  humOn = false;
}

/* ============================== module ================================= */
var Audio = JK.Audio = {
  enabled: false,
  muted: false,
  ctx: null,
  play: play,
  hum: hum,
  setMute: setMute,
  toggle: function(){ setMute(!muted); },
  stopAll: stopAll,

  init: function(){
    if (ok) return;
    try { muted = window.localStorage.getItem('jk_mute') === '1'; } catch (e){}
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;                       /* no WebAudio: whole module no-ops */
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : MASTER_V;
      try {                                /* glue + clip guard, optional */
        comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 7;
        comp.attack.value = 0.004; comp.release.value = 0.20;
        master.connect(comp); comp.connect(ctx.destination);
      } catch (e2){
        master.connect(ctx.destination);
      }
      hasPan = typeof ctx.createStereoPanner === 'function';
      bufW = mkWhite(1.0);
      bufP = mkPink(1.5);
      bufC = mkCrackle(0.9);
      makeVoices();
      buildHum();
      /* iOS: a one-sample silent source inside the gesture finishes the unlock */
      try {
        var s = ctx.createBufferSource();
        s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
        s.connect(ctx.destination);
        s.start(0);
      } catch (e3){}
      tryResume();
    } catch (err){
      ok = false; ctx = null;
      return;
    }
    ok = true;
    Audio.enabled = true;
    Audio.ctx = ctx;
    buildDom();
    applyMute();
    document.addEventListener('touchend', unlock, true);
    document.addEventListener('mousedown', unlock, true);
    document.addEventListener('visibilitychange', onVis);
    try { ctx.onstatechange = onState; } catch (e4){}  /* instant un-interrupt */
    /* prime the edge trackers so boot doesn't fire a burst of stale events */
    prime();
    wasRun = running();
  },

  /* Reads sibling state and fires the sounds the frozen modules never ask for.
   * Every read is feature-detected; every write is a play()/hum() call. */
  update: function(dt, t){
    if (!ok) return;
    /* Context down ('suspended' after a background, or WebKit 'interrupted'
     * after a call/Siri): keep asking it to come back — nothing else will — and
     * schedule NOTHING meanwhile, because currentTime is frozen and every voice
     * would queue on the same timestamp and detonate together on resume. */
    if (!running()){
      wasRun = false;
      if (!document.hidden){
        resumeTry -= dt;
        if (resumeTry <= 0){ resumeTry = 1.0; tryResume(); }
      }
      return;
    }
    if (!wasRun){ wasRun = true; prime(); }   /* audio is back: no stale edges */
    reap();
    if (muted) return;

    var P = JK.Player, R = JK.Rig, rp = R && R.player;
    var G = JK.game, S = JK.Sabers, C = JK.Combat, H = JK.Hero;
    var i;

    /* ---- saber ignite / extinguish + the persistent hum ---- */
    var lit = rp ? !!rp.saberOn : false;
    if (lit !== wasLit){
      wasLit = lit;
      play(lit ? 'saberOn' : 'saberOff');
    }
    if (lit){
      var inten = 0.10 + Math.min(1, ((P && P.speed2D) || 0) / 9) * 0.34;
      var ph = (rp && rp.swingPhase) ? rp.swingPhase() : -1;
      if (ph >= 0) inten += Math.sin(Math.PI * ph) * 0.95;
      hum(true, inten);
    } else {
      hum(false, 0);
    }

    /* ---- swing whoosh, pitched by stance (LIGHT fast, STRONG heavy) ---- */
    if (S && typeof S.attackId === 'number' && S.attackId !== lastAtkId){
      lastAtkId = S.attackId;
      if (lastAtkId > 0){
        var si = P ? (P.stanceIdx | 0) : 1;
        play('swing', so(null, 1, si === 0 ? 1.30 : (si === 2 ? 0.72 : 1.0)));
      }
    }

    /* ---- saber connecting with something ---- */
    if (C && C.lastHit && C.lastHit.t !== lastHitT){
      lastHitT = C.lastHit.t;
      play('hit', C.hitPos ? so(C.hitPos, 1, 1) : null);
    }

    /* ---- jump / land ---- */
    if (P){
      if (P.jumped) play('jump');
      var g = !!P.onGround;
      if (g && !wasGround){
        var iv = prevVy < 0 ? -prevVy : 0;
        play('land', so(null, clamp(0.25 + iv / 12, 0.25, 1), 1));
      }
      wasGround = g;
      prevVy = P.vel ? P.vel[1] : 0;

      var sc = P.stanceIdx | 0;
      if (sc !== lastStance){ lastStance = sc; play('select', so(null, 0.75, 1)); }
    }

    /* ---- hurt / die (Hero owns hp; it never calls us) ---- */
    if (G){
      if (lastHp < 0) lastHp = G.hp;
      if (G.hp < lastHp - 0.75)
        play('hurt', so(null, clamp(0.5 + (lastHp - G.hp) / 40, 0.5, 1), 1));
      lastHp = G.hp;
    }
    if (H){
      var dead = !!H.dead;
      if (dead && !wasDead) play('die');
      wasDead = dead;
    }
  }
};
})();

/* ===== 70_powers.js ===== */
/* JK.Powers — the FIVE force powers, the force pool, and the power selector.
 * Owner: powers agent (70_powers.js). Implements the ITERATION 3+4 contract.
 *
 * FORCE POOL (owned here): JK.game.force / JK.game.forceMax (100). Regen 14/s,
 * starting 0.8 s after the last spend (channelling spends every frame, so it
 * never regens mid-channel).
 *
 * POWER TABLE
 *   0 PUSH      25      instant   10 m / 75 deg cone   onForce('push', dir, 9)
 *                                                      + JK.Blaster.repel + droid onHit(10)
 *   1 PULL      20      instant   10 m / 75 deg cone   onForce('pull', dir, 7) + droid onHit(6)
 *   2 SPEED     10/s    channel   self                 JK.Player.speedMul = 1.75
 *   3 LIGHTNING 26/s    channel   14 m / 45 deg, x3    onForce('lightning', dir, 55*dt)
 *   4 GRIP      20/s    channel   12 m / 45 deg, x1    'grip' -> 'gripHold' 14*dt ->
 *                                                      'gripRelease' 12 (throw along camera)
 *   PUSH/PULL share a 0.55 s per-power cooldown. Not enough force (or no grip
 *   target) => JK.Audio.play('forceFail') + the selected slot flashes red.
 *   Entities WITHOUT onForce (the training droids) still react: push/pull knock
 *   them via onHit(10 / 6, dir, 'force'), lightning and grip choke them through
 *   onHit as well — GRIP prefers an onForce target and only falls back to a
 *   plain one when the cone holds nothing liftable.
 *
 * AIMING: everything aims down the CAMERA yaw (JK.Player.camYaw), not the body
 * yaw — you throw people where you are LOOKING, which is what JKO feels like.
 * Cone tests are horizontal (chest-to-chest for the direction handed to bots).
 *
 * INPUT: JK.Input.state.forceTap (or the forceSel counter) cycles the selection
 * (desktop R / wheel; this module also binds 1..5 for direct picks);
 * state.force (edge) casts an instant power / STARTS a channel; state.forceHeld
 * keeps a channel alive. A channel ends on release, on empty force, when the
 * power is switched, or when JK.Hero dies — every exit path restores
 * JK.Player.speedMul = 1 and sends exactly one 'gripRelease'.
 *
 * UI: this module builds its OWN DOM (a 5-slot chunky strip on the right edge,
 * above #btnForce; it never touches template.html or 60_ui.js) plus a <style>.
 * On a SHORT LANDSCAPE viewport there is no room above #btnForce for five
 * slots, so the strip hangs from the top of the right edge instead, inboard of
 * the button column — see the media query for the arithmetic.
 * It also mirrors "FORCE PUSH  25" into #forceTag. DOM is written ONLY on change.
 *
 * EXPORTS
 *   init() / update(dt, t)                (no draw — JK.ForceFx renders)
 *   POWERS   [{id,name,label,cost,channel,range,cone,cd}]  (read-only table)
 *   NAMES    ['PUSH','PULL','SPEED','LIGHTNING','GRIP']
 *   sel      int 0..4 currently selected   select(i) / cycle(d)
 *   canCast(i) -> bool                     cast(i) -> bool (fire/start now)
 *   stop()   ends any channel cleanly      channelling / channelT / gripTarget

 *

 */

var REGEN_RATE   = 14;      /* force / s */
var REGEN_DELAY  = 0.8;     /* s after the last spend */

var CHEST_FRAC   = 0.55;    /* target chest = pos[1] + height*0.55 (contract) */

var SPEED_MUL    = 1.75;
var PUSH_POWER   = 9;       /* onForce scalar (m/s of impulse for bots) */
var PULL_POWER   = 7;
var PUSH_DMG     = 10;      /* droids: no onForce, so they take a knock instead */
var PULL_DMG     = 6;
var LIGHT_DPS    = 55;      /* damage / s per target */
var LIGHT_MAX    = 3;       /* simultaneous lightning targets */

  { id:1, name:'PULL',      label:'PULL',  cost:20, channel:false, range:10, cone:75, cd:0.55 },
  { id:2, name:'SPEED',     label:'SPEED', cost:10, channel:true,  range:0,  cone:0,  cd:0 },

function game(){

}

}

/* ============================ aiming / targeting ============================ */
/* Camera yaw forward, horizontal. Player camYaw: fwd = (-sin, 0, -cos). */
function updateAim(){
  var cy = (PL && PL.camYaw) || 0;
  FWD[0] = -Math.sin(cy); FWD[1] = 0; FWD[2] = -Math.cos(cy);
  ORIGIN[0] = PL.pos[0];
  ORIGIN[1] = PL.pos[1] + CHEST;
  ORIGIN[2] = PL.pos[2];
}

/* Full camera forward (with pitch) + a lift bias — the grip throw vector. */
function throwDir(out){
  var cy = (PL && PL.camYaw) || 0, cp = (PL && PL.camPitch) || 0;
  var cc = Math.cos(cp);
  var x = -Math.sin(cy) * cc, y = Math.sin(cp) + GRIP_LIFT, z = -Math.cos(cy) * cc;
  var l = Math.sqrt(x * x + y * y + z * z) || 1;
  out[0] = x / l; out[1] = y / l; out[2] = z / l;
  return out;
}

/* Unit direction from the caster's chest to the entity's chest (contract dir3). */
function dirTo(e, out){
  var ey = e.pos[1] + (e.height || 1.8) * CHEST_FRAC;
  var dx = e.pos[0] - ORIGIN[0], dy = ey - ORIGIN[1], dz = e.pos[2] - ORIGIN[2];
  var l = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (l < 1e-4){ out[0] = FWD[0]; out[1] = 0; out[2] = FWD[2]; return out; }
  out[0] = dx / l; out[1] = dy / l; out[2] = dz / l;
  return out;
}
function chestOf(e, out){
  out[0] = e.pos[0];
  out[1] = e.pos[1] + (e.height || 1.8) * CHEST_FRAC;
  out[2] = e.pos[2];
  return out;
}
/* Horizontal distance from the caster to an entity. */
function distTo(e){
  var dx = e.pos[0] - ORIGIN[0], dz = e.pos[2] - ORIGIN[2];
  return Math.sqrt(dx * dx + dz * dz);
}

/* Fill HITS/HITD with live non-player entities inside range + cone.
 * RANGE is the true chest-to-chest distance (3D): a horizontal-only test would
 * let a 10 m push hit a sith hanging 30 m overhead mid-force-jump. The CONE
 * stays horizontal on purpose (you shove whatever is in front of you, up or
 * down a dune alike). HITD keeps the SQUARED 3D distance — it is only ever
 * compared, never read out, so the sort needs no extra sqrt. */
function scan(range, cosHalf, needForce){
  nHits = 0;
  var C = JK.Combat, ents = C && C.ents;
  if (!ents || !ents.length) return 0;
  var r2 = range * range;
  for (var i = 0; i < ents.length; i++){
    if (nHits >= 32) break;
    var e = ents[i];
    if (!e || !e.pos || e.team === 'player') continue;
    if (!(e.hp > 0)) continue;                       /* dead things are skipped */
    if (needForce && typeof e.onForce !== 'function') continue;
    var dx = e.pos[0] - ORIGIN[0], dz = e.pos[2] - ORIGIN[2];
    var dy = e.pos[1] + (e.height || 1.8) * CHEST_FRAC - ORIGIN[1];
    var d2 = dx * dx + dz * dz;                      /* horizontal, for the cone */
    var s2 = d2 + dy * dy;                           /* true range, for the reach */
    if (s2 > r2) continue;
    var d = Math.sqrt(d2);
    if (d > 0.25 && (dx * FWD[0] + dz * FWD[2]) / d < cosHalf) continue;
    HITS[nHits] = e; HITD[nHits] = s2; nHits++;
  }
  return nHits;
}

/* Is this entity still a live member of the registry? A bot that JK.Bots
 * unregistered (death, wave clear, pool recycle) must not stay gripped — the
 * hp test alone cannot see it, and a recycled record can come back alive. */
function registered(e){
  var C = JK.Combat, l = C && C.ents;
  if (!l) return true;                               /* no registry: trust the caller */
  return l.indexOf(e) >= 0;
}

/* Partial selection sort: the k nearest hits end up at the front of HITS. */
function nearestFirst(k){
  if (k > nHits) k = nHits;
  for (var a = 0; a < k; a++){
    var best = a;
    for (var b = a + 1; b < nHits; b++) if (HITD[b] < HITD[best]) best = b;
    if (best !== a){
      var te = HITS[a]; HITS[a] = HITS[best]; HITS[best] = te;
      var td = HITD[a]; HITD[a] = HITD[best]; HITD[best] = td;
    }
  }
}

/* Where the lightning leaves the body: the saber hand if the rig has drawn a
 * sane blade this frame, otherwise a point off the chest. */
function handPoint(out){
  var R = JK.Rig, b = R && R.blades && R.blades[0] && R.blades[0].base;
  if (b){
    var dx = b[0] - PL.pos[0], dy = b[1] - PL.pos[1], dz = b[2] - PL.pos[2];
    if (dy > 0.2 && dy < 2.6 && dx * dx + dz * dz < 4){
      out[0] = b[0]; out[1] = b[1]; out[2] = b[2];
      return out;
    }
  }
  var rx = -FWD[2], rz = FWD[0];                     /* right = fwd x up */
  out[0] = PL.pos[0] + FWD[0] * 0.28 + rx * 0.32;
  out[1] = PL.pos[1] + 1.30;
  out[2] = PL.pos[2] + FWD[2] * 0.28 + rz * 0.32;
  return out;
}

/* ============================ the powers ============================ */
function castPush(){
  var i, e, F = fxOn();
  spend(POWERS[PUSH].cost);
  cool[PUSH] = POWERS[PUSH].cd;
  snd('push');
  if (F && F.push) F.push(ORIGIN, FWD);
  if (JK.Blaster && typeof JK.Blaster.repel === 'function') JK.Blaster.repel(ORIGIN, FWD);
  scan(POWERS[PUSH].range, COS_WIDE, false);
  for (i = 0; i < nHits; i++){
    e = HITS[i];
    dirTo(e, DIR);
    if (typeof e.onForce === 'function') e.onForce('push', DIR, PUSH_POWER);
    else if (typeof e.onHit === 'function') e.onHit(PUSH_DMG, DIR, 'force');
    HITS[i] = null;
  }
  nHits = 0;
  return true;
}

function castPull(){
  var i, e, F = fxOn();
  spend(POWERS[PULL].cost);
  cool[PULL] = POWERS[PULL].cd;
  snd('pull');
  if (F && F.pull) F.pull(ORIGIN, FWD);
  scan(POWERS[PULL].range, COS_WIDE, false);
  for (i = 0; i < nHits; i++){
    e = HITS[i];
    dirTo(e, DIR);
    if (typeof e.onForce === 'function') e.onForce('pull', DIR, PULL_POWER);
    else if (typeof e.onHit === 'function') e.onHit(PULL_DMG, DIR, 'force');
    HITS[i] = null;
  }
  nHits = 0;
  return true;
}

function setSpeed(on){
  var F = fxOn();
  if (on === speedOn){
    if (on && PL) PL.speedMul = SPEED_MUL;           /* re-assert every frame */
    return;
  }
  speedOn = on;
  if (PL) PL.speedMul = on ? SPEED_MUL : 1;
  if (F && F.speed) F.speed(on);
}

/* Lock the nearest gripable entity in front. Returns it or null. */
function acquireGrip(){
  scan(POWERS[GRIP].range, COS_NARROW, true);
  if (!nHits){
    /* nothing with onForce: allow anything solid (droids just get shaken) */
    scan(POWERS[GRIP].range, COS_NARROW, false);
  }
  if (!nHits) return null;
  nearestFirst(1);
  var e = HITS[0];
  for (var i = 0; i < nHits; i++) HITS[i] = null;
  nHits = 0;
  return e;
}

function releaseGrip(){
  var e = gripTarget;
  gripTarget = null;
  Powers.gripTarget = null;
  if (e && gripSent){
    throwDir(THROW);
    if (typeof e.onForce === 'function') e.onForce('gripRelease', THROW, GRIP_THROW);
  }
  gripSent = false;
}

/* Start a channelled power. Returns true if it took. */
function startChannel(p){
  if (p === GRIP){
    var tgt = acquireGrip();
    if (!tgt) return false;                          /* nothing to choke: fail */
    gripTarget = tgt;
    Powers.gripTarget = tgt;
    gripSent = false;
  }
  mode = p;
  channelT = 0;
  Powers.channelling = true;
  Powers.channelT = 0;
  if (p === SPEED){ setSpeed(true); snd('speed'); }
  else if (p === LIGHTNING){ snd('lightning'); lightSnd = LIGHT_RETRIG; }
  else if (p === GRIP){ snd('grip'); }
  refreshSlots();
  return true;
}

/* End the active channel. ALWAYS restores speedMul and sends one gripRelease. */
function endChannel(){
  if (mode < 0){
    if (speedOn) setSpeed(false);                    /* paranoia: never stick */
    return;
  }
  var p = mode;
  mode = -1;
  channelT = 0;
  Powers.channelling = false;
  Powers.channelT = 0;
  if (p === SPEED) setSpeed(false);
  if (p === GRIP) releaseGrip();
  if (speedOn) setSpeed(false);
  refreshSlots();
}

/* One frame of the active channel. Returns false when it should end. */
function tickChannel(dt, t){
  var g = game(), F = fxOn(), i, e, d;
  var p = mode;
  var rate = POWERS[p].cost;

  if (g.force <= 0) return false;
  spend(rate * dt);
  channelT += dt;
  Powers.channelT = channelT;

  if (p === SPEED){
    setSpeed(true);
    return true;
  }

  if (p === LIGHTNING){
    lightSnd -= dt;
    if (lightSnd <= 0){ snd('lightning'); lightSnd = LIGHT_RETRIG; }
    handPoint(FROM);
    scan(POWERS[LIGHTNING].range, COS_NARROW, false);
    var n = nHits < LIGHT_MAX ? nHits : LIGHT_MAX;
    if (n > 0){
      nearestFirst(n);
      for (i = 0; i < n; i++){
        e = HITS[i];
        dirTo(e, DIR);
        d = LIGHT_DPS * dt;
        if (typeof e.onForce === 'function') e.onForce('lightning', DIR, d);
        else if (typeof e.onHit === 'function') e.onHit(d, DIR, 'force');
        if (F && F.lightning){ chestOf(e, TO); F.lightning(FROM, TO); }
      }
    } else if (F && F.lightning){                    /* crackle into the dunes */
      TO[0] = ORIGIN[0] + FWD[0] * LIGHT_FALL;
      TO[1] = ORIGIN[1] + 0.15;
      TO[2] = ORIGIN[2] + FWD[2] * LIGHT_FALL;
      F.lightning(FROM, TO);
    }
    for (i = 0; i < nHits; i++) HITS[i] = null;
    nHits = 0;
    return true;
  }

  /* GRIP: stay on the SAME entity even if it leaves the cone. */
  e = gripTarget;
  if (!e || !e.pos || !(e.hp > 0)) return false;
  if (!registered(e)) return false;                  /* never choke a stale record */
  if (distTo(e) > GRIP_BREAK) return false;
  dirTo(e, DIR);
  if (typeof e.onForce === 'function'){
    if (!gripSent){ e.onForce('grip', DIR, 0); gripSent = true; }
    e.onForce('gripHold', DIR, GRIP_DPS * dt);
  } else if (typeof e.onHit === 'function'){
    gripSent = true;                                 /* so release still fires */
    e.onHit(GRIP_DPS * dt, DIR, 'force');
  }
  if (F && F.grip){
    chestOf(e, GPOS);
    GPOS.radius = e.radius || 0.55;
    GPOS.height = e.height || 1.8;
    F.grip(GPOS, t);
  }
  return true;
}

/* Fire the selected power (instant) or start its channel. */
function fire(p){
  if (p < 0 || p >= NPOW) return false;
  /* cast() is public, so a caller can arrive outside update(): make sure the
   * aim/origin scratch belongs to THIS moment before anything is thrown. */
  if (!PL || !PL.pos) PL = JK.Player || null;
  if (!PL || !PL.pos) return false;
  updateAim();
  var d = POWERS[p];
  if (heroDead()) return false;
  if (cool[p] > 0){ failFlash(p); return false; }
  if (!affords(p)){ failFlash(p); snd('forceFail'); return false; }
  if (d.channel){
    if (mode === p) return true;
    if (mode >= 0) endChannel();
    if (!startChannel(p)){ failFlash(p); snd('forceFail'); return false; }
    return true;
  }
  if (mode >= 0) endChannel();
  return p === PUSH ? castPush() : castPull();
}

/* ============================ selector UI ============================ */
var bar = null;
var slots = [null, null, null, null, null];
var stKey = [-1, -1, -1, -1, -1];    /* cached visual state bitmask per slot */
var dn  = [false, false, false, false, false];
var lo  = [false, false, false, false, false];
var flT = [0, 0, 0, 0, 0];           /* fail-flash timers, s */
var tagEl = null, tagText = '';

var CSS = [
'#jkpBar { position:absolute; z-index:5; width:58px; pointer-events:auto;',
'  right:calc(14px + env(safe-area-inset-right));',
'  bottom:calc(276px + env(safe-area-inset-bottom));',
'  font:700 9px/1 "Trebuchet MS","Verdana",sans-serif; letter-spacing:.06em;',
'  text-shadow:1px 1px 0 #000; touch-action:none;',
'  -webkit-user-select:none; user-select:none; }',
'.jkp-s { position:relative; height:40px; margin-bottom:3px; background:#1d2412;',
'  border:2px solid; border-color:#8a9070 #3a4030 #3a4030 #8a9070; color:#c8d0b0;',
'  text-align:center; box-shadow:1px 1px 0 rgba(0,0,0,.5); cursor:pointer; }',
'.jkp-s:last-child { margin-bottom:0; }',
'.jkp-n { position:absolute; left:3px; top:2px; font-size:8px; color:#7a8064; }',
'.jkp-l { display:block; padding-top:10px; font-size:9px; letter-spacing:.08em; }',
'.jkp-c { display:block; margin-top:4px; font-size:8px; color:#8ad4ff; opacity:.8; }',
'.jkp-s.sel { background:#3a2e14; color:#ffd76a;',
'  border-color:#ffd76a #8a6a20 #8a6a20 #ffd76a;',
'  box-shadow:0 0 10px rgba(255,190,60,.35), 1px 1px 0 rgba(0,0,0,.5); }',
'.jkp-s.sel .jkp-n { color:#c8a860; }',
'.jkp-s.lo { opacity:.4; }',
'.jkp-s.dn { transform:scale(.94); }',
'.jkp-s.act { background:#123a3a; color:#9fe8ff;',
'  border-color:#9fe8ff #206070 #206070 #9fe8ff;',
'  box-shadow:0 0 14px rgba(120,220,255,.5), 1px 1px 0 rgba(0,0,0,.5); }',
'.jkp-s.fail { animation:jkpFail .45s ease-out; }',
'@keyframes jkpFail { 0% { background:#5a1810; border-color:#ff8a6a;',
'    box-shadow:0 0 14px rgba(255,90,50,.7); }',
'  100% { background:#1d2412; box-shadow:1px 1px 0 rgba(0,0,0,.5); } }',
/* LANDSCAPE PHONE: there is no room left above #btnForce. That button's top
 * edge sits 266px + safe area off the bottom, so on a 390pt-tall iPhone only
 * ~100px remain — five slots need 160, and the strip used to run 71px OFF THE
 * TOP of the screen with PUSH and PULL completely unreachable. The strip is
 * the ONLY force selector a touch device has (the template ships no select
 * button; forceTap is R / wheel), so that was two dead powers.
 * Fix: on short landscape viewports the strip hangs from the TOP of the right
 * edge instead, inboard of the #btnForce/#btnJump column (they start at
 * right 16-20, w 56-64 => clear of right 84 + 52) and below JK.Audio's 44px
 * mute button in the corner. Everything else keeps the tall-screen layout. */
'@media (max-height:620px) and (orientation:landscape) {',
'  #jkpBar { top:calc(6px + env(safe-area-inset-top)); bottom:auto;',
'    right:calc(84px + env(safe-area-inset-right)); width:52px; }',
'  .jkp-s { height:30px; margin-bottom:2px; }',
'  .jkp-l { padding-top:5px; font-size:8px; } .jkp-c { margin-top:1px; } }'
].join('\n');

function mk(tag, cls2, parent){
  var el = document.createElement(tag);
  if (cls2) el.className = cls2;
  if (parent) parent.appendChild(el);
  return el;
}
function stopOnly(e){ e.stopPropagation(); }
function eat(e){ e.stopPropagation(); if (e.cancelable) e.preventDefault(); }

/* Keep every menu touch away from 20_input.js's document/window handlers. */
function shield(el){
  var i;
  var tev = ['touchstart', 'touchmove', 'touchend', 'touchcancel'];
  for (i = 0; i < tev.length; i++) el.addEventListener(tev[i], stopOnly, {passive:false});
  var mev = ['mousedown', 'mousemove', 'mouseup', 'click', 'wheel'];
  for (i = 0; i < mev.length; i++) el.addEventListener(mev[i], stopOnly, {passive:false});
}

/* Slot visuals are keyed by a 5-bit mask so the per-frame refresh compares INTS
 * (no string built, no DOM written) unless something actually changed.
 * The FAIL bit must live in the mask: a fail happens mid-update (inside fire())
 * and the update's own trailing refreshSlots() runs before the browser paints,
 * so a flash held outside the mask is erased in the same frame — the player
 * would only ever hear 'forceFail', never see it. */
function slotKey(i){
  return (i === sel ? 1 : 0) | (mode === i ? 2 : 0) | (lo[i] ? 4 : 0) |
         (dn[i] ? 8 : 0) | (flT[i] > 0 ? 16 : 0);
}
function slotClass(k){
  var s = 'jkp-s';
  if (k & 1) s += (k & 2) ? ' sel act' : ' sel';
  if (k & 4) s += ' lo';
  if (k & 8) s += ' dn';
  if (k & 16) s += ' fail';
  return s;
}
function refreshSlots(){
  for (var i = 0; i < NPOW; i++){
    var el = slots[i];
    if (!el) continue;
    var k = slotKey(i);
    if (k !== stKey[i]){ stKey[i] = k; el.className = slotClass(k); }
  }
}
function failFlash(i){
  if (i < 0 || i >= NPOW) return;
  flT[i] = FAIL_T;
  var el = slots[i];
  if (!el) return;
  var k = slotKey(i);
  el.className = slotClass(k & ~16);       /* drop it ... */
  void el.offsetWidth;                     /* ... reflow: restart the one-shot anim */
  el.className = slotClass(k);
  stKey[i] = k;                            /* keyed, so refreshSlots keeps the flash */
}

function syncTag(){
  var d = POWERS[sel];
  tagText = 'FORCE ' + d.name + '  ' + d.cost + (d.channel ? '/S' : '');
  if (tagEl && tagEl.textContent !== tagText) tagEl.textContent = tagText;
}

/* A mouse press that starts on a slot and is released ANYWHERE else never
 * reaches the slot's own mouseup, so the pressed look would stick forever.
 * One window-level release clears the lot (the slot handler stops propagation,
 * so an on-slot release still only runs once). */
function clearDown(){
  var ch = false;
  for (var i = 0; i < NPOW; i++) if (dn[i]){ dn[i] = false; ch = true; }
  if (ch) refreshSlots();
}

function bindSlot(el, i){
  el.addEventListener('touchstart', function(e){ eat(e); dn[i] = true; refreshSlots(); }, {passive:false});
  el.addEventListener('touchend', function(e){ eat(e); dn[i] = false; select(i); }, {passive:false});
  el.addEventListener('touchcancel', function(e){ stopOnly(e); dn[i] = false; refreshSlots(); }, {passive:false});
  el.addEventListener('mousedown', function(e){ stopOnly(e); dn[i] = true; refreshSlots(); });
  el.addEventListener('mouseup', function(e){ stopOnly(e); dn[i] = false; refreshSlots(); });
  el.addEventListener('click', function(e){ eat(e); select(i); });
}

function build(){
  var d = document, i;
  if (d.getElementById('jkpBar')) return;
  var style = d.createElement('style');
  style.textContent = CSS;
  (d.head || d.getElementsByTagName('head')[0]).appendChild(style);

  bar = mk('div', null, d.body);
  bar.id = 'jkpBar';
  shield(bar);
  for (i = 0; i < NPOW; i++){
    var s = mk('div', 'jkp-s', bar);
    mk('span', 'jkp-n', s).textContent = '' + (i + 1);
    mk('span', 'jkp-l', s).textContent = POWERS[i].label;
    mk('span', 'jkp-c', s).textContent = POWERS[i].channel
      ? POWERS[i].cost + '/S' : '' + POWERS[i].cost;
    slots[i] = s;
    stKey[i] = -1;
    bindSlot(s, i);
  }

  /* desktop nicety: 1..5 pick a power directly (20_input.js leaves these free) */
  if (typeof window !== 'undefined' && window.addEventListener){
    window.addEventListener('keydown', function(e){
      var k = e.keyCode;
      if (k >= 49 && k <= 53) select(k - 49);
    });
    window.addEventListener('mouseup', clearDown);
  }
}

function select(i){
  i = i | 0;
  if (i < 0) i = 0; else if (i >= NPOW) i = NPOW - 1;
  if (i !== sel){
    if (mode >= 0) endChannel();       /* switching cancels the channel cleanly */
    sel = i;
    Powers.sel = sel;
    snd('select');
    syncTag();
  }
  refreshSlots();
  return sel;
}

/* ============================ module ============================ */
var Powers = JK.Powers = {
  POWERS: POWERS,
  NAMES: NAMES,
  sel: 0,
  channelling: false,
  channelT: 0,
  gripTarget: null,
  aim: FWD,                            /* read-only scratch */
  origin: ORIGIN,                      /* read-only scratch */

  init: function(){
    var g = game();
    if (!(g.forceMax > 0)) g.forceMax = FORCE_MAX;
    g.force = g.forceMax;
    sinceSpend = 99;

    PL = JK.Player || null;
    if (PL) PL.speedMul = 1;           /* never boot with a stuck multiplier */
    speedOn = false;

    mode = -1; channelT = 0; gripTarget = null; gripSent = false;
    Powers.channelling = false; Powers.channelT = 0; Powers.gripTarget = null;
    for (var i = 0; i < NPOW; i++){
      cool[i] = 0; lo[i] = false; dn[i] = false; flT[i] = 0; stKey[i] = -1;
    }
    nHits = 0;
    for (i = 0; i < 32; i++) HITS[i] = null;   /* drop any entity refs we held */

    sel = 0; Powers.sel = 0;
    var st = JK.Input && JK.Input.state;
    lastSelCt = st ? (st.forceSel | 0) : 0;

    if (!inited){ build(); inited = true; }
    tagEl = document.getElementById('forceTag');
    syncTag();
    refreshSlots();
  },

  update: function(dt, t){
    var g = game(), i;
    if (!PL || !PL.pos) PL = JK.Player || null;
    if (!PL || !PL.pos) return;        /* player module not up yet: nothing to aim */
    var st = (JK.Input && JK.Input.state) || NULL_STATE;

    updateAim();

    /* ---- cooldowns + fail flashes + regen (all in SECONDS, never frames) ---- */
    for (i = 0; i < NPOW; i++){
      if (cool[i] > 0){ cool[i] -= dt; if (cool[i] < 0) cool[i] = 0; }
      if (flT[i] > 0){ flT[i] -= dt; if (flT[i] < 0) flT[i] = 0; }
    }
    sinceSpend += dt;
    if (sinceSpend >= REGEN_DELAY && g.force < g.forceMax){
      g.force += REGEN_RATE * dt;
      if (g.force > g.forceMax) g.force = g.forceMax;
    }

    /* ---- selection: forceTap edge (or the forceSel counter) ---- */
    var selEdge;
    if (st.forceTap !== undefined) selEdge = !!st.forceTap;
    else { selEdge = (st.forceSel | 0) !== lastSelCt; }

/* JK.ForceFx — the visual language of the Force. Owner: forcefx agent.

 * PURE SPECTACLE. No gameplay logic, no input reads, no damage, no audio.
 * JK.Powers (70_powers.js) drives every effect; this module only draws.
 *
 * PUBLIC API (the ITERATION 3+4 contract)
 *   JK.ForceFx.push(origin3, dir3)   expanding shockwave ring, 0.45 s, additive
 *   JK.ForceFx.pull(origin3, dir3)   converging tangential streaks, 0.45 s
 *   JK.ForceFx.lightning(from3, to3) ONE frame of a jagged arc — call EVERY
 *                                    frame while channelling (up to 4 at once)
 *   JK.ForceFx.grip(target, t)       swirling aura around a lifted target — call
 *                                    EVERY frame; target may be a vec3 (chest
 *                                    point) OR a JK.Combat entity ({pos,height})

 *   init() / update(dt, t) / draw()  lifecycle (90_main SYSTEMS slot 'ForceFx')
 *   clear()                          drop every live effect (respawn / tests)
 *   active()                         live effect count (harnesses)

 *     precision loss, no allocation), re-rolled every frame so it crackles.
 *

 *   PUSH      castPush()   -> push(ORIGIN, FWD)          once per cast
 *   PULL      castPull()   -> pull(ORIGIN, FWD)          once per cast

 *                            cone is empty

var RING_SEG   = 16;     /* shards per wave (contract: ~16 thin boxes) */

var PULL_DUR   = 0.45;

var PUSH_ADV   = 2.7;    /* m: how far the wave flies down the push dir */
var PULL_R     = 3.9;    /* m: radius the streaks start at */
var PULL_ADV   = 3.6;    /* m: how far out in front they start */

var ARC_LINKS  = 9;      /* chain links (contract: ~10 short segments) */

var GRIP_HOLD  = 0.16;   /* s a grip aura survives without a refresh */

var PZ = new Float32Array(3);                    /* perpendicular basis Z */

var gT   = new Float32Array(GHOSTS);

var gLx = 0, gLy = 0, gLz = 0, gHave = false;   /* last SAMPLED position */

function frame(dx, dy, dz){

  m[8] = PZ[0] * w; m[9] = PZ[1] * w; m[10] = PZ[2] * w; m[11] = 0;

    bx(0.54, 0.70, 0.32, 0, 1.22, 0),          /* torso */
    bx(0.28, 0.28, 0.26, 0, 1.71, 0),          /* head */
    bx(0.15, 0.62, 0.17,  0.34, 1.24, 0),      /* arm R */
    bx(0.15, 0.62, 0.17, -0.34, 1.24, 0)       /* arm L */
  ]));

}
function bx(sx, sy, sz, x, y, z){

}

 * value with zero lag. Falls back to a chest-height point off the player's
 * right shoulder when the rig has not drawn yet (boot, harnesses). */

    var dy = b[1] - P.pos[1];
    var dx = b[0] - P.pos[0], dz = b[2] - P.pos[2];
    if (dy > 0.2 && dy < 2.8 && dx * dx + dz * dz < 4.0){
      out[0] = b[0]; out[1] = b[1]; out[2] = b[2];
      return true;
    }
  }
  if (!P || !P.pos){ out[0] = 0; out[1] = 1.3; out[2] = 0; return false; }

  var fx = -Math.sin(y), fz = -Math.cos(y);

    rad = 0.55 + PUSH_R * e;                     /* born as a ring, not a dot */
    adv = 0.55 + PUSH_ADV * e;                   /* clear of the player's chest */
    alpha = ip * ip;
    stretch = 0.80;
    w = 0.055 + 0.085 * ip;
  } else {
    e = p * p * (3 - 2 * p);                     /* smoothstep inward */
    rad = 0.25 + PULL_R * (1 - e);
    adv = PULL_ADV * (1 - e) + 0.25;
    alpha = p < 0.16 ? p / 0.16 : ip / 0.84;
    stretch = 0.75 + 2.4 * e;                    /* streaks smear tangentially */

    var cy = r.oy + r.dy * adv + (r.uy * ca + r.vy * sa) * rr;
    var cz = r.oz + r.dz * adv + (r.uz * ca + r.vz * sa) * rr;

    var ty = -r.uy * sa + r.vy * ca;
    var tz = -r.uz * sa + r.vz * ca;

}

/* ============================== lightning =========================== */
/* Fill `out` with n+1 jittered nodes from a->b. The jitter is perpendicular to
 * the axis (basis from frame()), enveloped so the ends stay pinned to the hand
 * and the victim, with a standing wave mixed in so it reads as a BOLT rather
 * than noise. Re-rolled every frame => it crackles. */
function jag(out, n, ax, ay, az, bx, by, bz, amp, phase){
  var dx = bx - ax, dy = by - ay, dz = bz - az;

  var vx = PZ[0], vy = PZ[1], vz = PZ[2];
  for (var j = 0; j <= n; j++){
    var s = j / n;
    var env = Math.sin(s * PI);
    env = env * (0.45 + 0.55 * env);             /* fat in the middle, pinned ends */
    var o1 = srnd() * amp * env + Math.sin(s * 9.2 + phase) * amp * env * 0.55;
    var o2 = srnd() * amp * env + Math.cos(s * 6.7 - phase) * amp * env * 0.45;

    out[k]     = ax + dx * s + ux * o1 + vx * o2;
    out[k + 1] = ay + dy * s + uy * o1 + vy * o2;
    out[k + 2] = az + dz * s + uz * o1 + vz * o2;

}

function drawChain(nodes, n, w, glowK, core, glow, a){

    JK.GL.draw(mSeg, MTX, OPT);
    if (glowK > 0){
      widen(MTX, glowK);
      tint(glow); OPT.alpha = a * 0.30;
