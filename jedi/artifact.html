<title>DUNE RAIDER</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none;
    overscroll-behavior:none; position:fixed; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud { position:absolute; inset:0; pointer-events:none; z-index:3;
    font:700 12px/1.3 "Trebuchet MS","Verdana",sans-serif; color:#d8e0c8;
    text-shadow:1px 1px 0 #000, 0 0 6px rgba(0,0,0,.8); letter-spacing:.06em; }
  /* --- 2000s LucasArts-ish HUD corners --- */
  #hpBox { position:absolute; left:calc(12px + env(safe-area-inset-left));
    bottom:calc(12px + env(safe-area-inset-bottom)); }
  #fpBox { position:absolute; right:calc(12px + env(safe-area-inset-right));
    bottom:calc(12px + env(safe-area-inset-bottom)); text-align:right; }
  .bar { width:120px; height:10px; border:2px solid #6a705a; background:#101408; margin-top:3px; }
  .bar > i { display:block; height:100%; background:linear-gradient(#aef07a,#4f9f2f); }
  #fpBox .bar > i { background:linear-gradient(#8ad4ff,#2f6f9f); }
  #stanceTag { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); font-size:11px; color:#e8d9a0; opacity:.9; }
  #forceTag { position:absolute; top:calc(28px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); font-size:10px; color:#9fd4ff; opacity:.85; }
  #msg { position:absolute; top:30%; left:0; right:0; text-align:center; font-size:14px;
    color:#f0e6c0; opacity:0; transition:opacity .5s; }
  #msg.on { opacity:1; }
  /* --- touch controls --- */
  .tbtn { position:absolute; z-index:4; width:64px; height:64px; border-radius:50%;
    border:2px solid rgba(200,210,170,.35); background:rgba(20,26,12,.35);
    color:rgba(220,228,190,.85); font:700 10px/60px "Trebuchet MS",sans-serif;
    text-align:center; letter-spacing:.08em; pointer-events:auto;
    -webkit-user-select:none; user-select:none; }
  .tbtn.held { background:rgba(160,200,90,.25); border-color:rgba(200,240,140,.7); }
  #btnJump  { right:calc(16px + env(safe-area-inset-right)); bottom:calc(120px + env(safe-area-inset-bottom)); }
  #btnAtk   { right:calc(96px + env(safe-area-inset-right)); bottom:calc(48px + env(safe-area-inset-bottom)); width:76px; height:76px; line-height:72px; }
  #btnForce { right:calc(20px + env(safe-area-inset-right)); bottom:calc(210px + env(safe-area-inset-bottom)); width:56px; height:56px; line-height:52px; }
  #btnStance{ left:calc(16px + env(safe-area-inset-left)); bottom:calc(150px + env(safe-area-inset-bottom)); width:52px; height:52px; line-height:48px; font-size:9px; }
  #stickL { position:absolute; z-index:2; left:0; bottom:0; width:45%; height:70%; pointer-events:auto; }
  #stickUI { position:absolute; z-index:3; width:96px; height:96px; border:2px solid rgba(200,210,170,.25);
    border-radius:50%; display:none; pointer-events:none; }
  #stickUI > b { position:absolute; width:40px; height:40px; left:26px; top:26px; border-radius:50%;
    background:rgba(200,210,170,.25); border:2px solid rgba(200,210,170,.4); }
  /*INPUT-CSS*/
  #gl, #stickL, #stickUI, .tbtn { touch-action:none; }
  #gl { cursor:crosshair; }
  #stickUI { left:0; top:0; will-change:transform; }
  #stickUI.on { display:block; }
  #stickUI > b { will-change:transform; }
  #stickUI.run { border-color:rgba(255,215,106,.65); box-shadow:0 0 14px rgba(255,190,80,.3); }
  #stickUI.run > b { background:rgba(255,215,106,.45); border-color:rgba(255,225,140,.85); }
  .tbtn.held { transform:scale(.92); }
  #btnAtk.held { background:rgba(220,120,60,.3); border-color:rgba(255,170,90,.75); }
  /* --- start screen --- */
  #start { position:absolute; inset:0; z-index:10; background:
    radial-gradient(ellipse at 50% 30%, #3a2c18 0%, #120d06 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#e8dcb0; font:700 13px/1.8 "Trebuchet MS","Verdana",sans-serif; letter-spacing:.1em;
    text-align:center; padding:0 8%; transition:opacity .8s; }
  #start.gone { opacity:0; pointer-events:none; }
  #start h1 { font-size:34px; letter-spacing:.3em; text-indent:.3em; color:#ffd76a;
    text-shadow:2px 2px 0 #000, 0 0 18px rgba(255,180,60,.35); margin-bottom:6px; }
  #start .sub { font-size:11px; color:#b8a878; margin-bottom:30px; }
  #start .hint { font-size:10px; color:#8f8464; line-height:2; font-weight:400; }
  #begin { margin-top:34px; padding:14px 46px; border:2px solid #8f8050; background:#241c0e;
    color:#ffe9a8; font:700 13px "Trebuchet MS",sans-serif; letter-spacing:.3em; text-indent:.3em;
    cursor:pointer; }
  #begin:active { background:#3a2e14; }
  #err { position:absolute; inset:0; display:none; z-index:20; background:#000; color:#a99;
    font:400 13px/1.8 sans-serif; padding:20%; text-align:center; }
</style>

<script>
/* ===== 00_math.js ===== */
/* JK.M — column-major mat4 + vec3 helpers. Owner: core. */
var JK = window.JK = window.JK || {};
(function(){
'use strict';
var TMP = new Float32Array(16);

function make(){ var m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function ident(m){ for(var i=0;i<16;i++) m[i]=0; m[0]=m[5]=m[10]=m[15]=1; return m; }
function copy(o,a){ o.set(a); return o; }

/* o = a * b  (safe if o aliases a or b) */
function mul(o,a,b){
  for(var c=0;c<4;c++){
    var b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    TMP[c*4]  =a[0]*b0+a[4]*b1+a[8]*b2 +a[12]*b3;
    TMP[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2 +a[13]*b3;
    TMP[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    TMP[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;
  }
  o.set(TMP); return o;
}

/* in-place post-multiply composers: m = m * X. Natural for parent->child builds. */
var B = make();
function tr(m,x,y,z){ ident(B); B[12]=x; B[13]=y; B[14]=z; return mul(m,m,B); }
function sc(m,x,y,z){ ident(B); B[0]=x; B[5]=y; B[10]=z; return mul(m,m,B); }
function rx(m,a){ var c=Math.cos(a),s=Math.sin(a); ident(B); B[5]=c; B[6]=s; B[9]=-s; B[10]=c; return mul(m,m,B); }
function ry(m,a){ var c=Math.cos(a),s=Math.sin(a); ident(B); B[0]=c; B[2]=-s; B[8]=s; B[10]=c; return mul(m,m,B); }
function rz(m,a){ var c=Math.cos(a),s=Math.sin(a); ident(B); B[0]=c; B[1]=s; B[4]=-s; B[5]=c; return mul(m,m,B); }

function persp(o,fovy,aspect,near,far){
  var f=1/Math.tan(fovy/2), nf=1/(near-far);
  o[0]=f/aspect; o[1]=0; o[2]=0; o[3]=0;
  o[4]=0; o[5]=f; o[6]=0; o[7]=0;
  o[8]=0; o[9]=0; o[10]=(far+near)*nf; o[11]=-1;
  o[12]=0; o[13]=0; o[14]=2*far*near*nf; o[15]=0;
  return o;
}

function lookAt(o,eye,ctr,up){
  var zx=eye[0]-ctr[0], zy=eye[1]-ctr[1], zz=eye[2]-ctr[2];
  var l=1/(Math.sqrt(zx*zx+zy*zy+zz*zz)||1); zx*=l; zy*=l; zz*=l;
  var xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  l=1/(Math.sqrt(xx*xx+xy*xy+xz*xz)||1); xx*=l; xy*=l; xz*=l;
  var yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
  o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
  o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
  o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  o[15]=1;
  return o;
}

/* transform point [x,y,z,1] by m -> out3 */
function xp(o,m,x,y,z){
  o[0]=m[0]*x+m[4]*y+m[8]*z+m[12];
  o[1]=m[1]*x+m[5]*y+m[9]*z+m[13];
  o[2]=m[2]*x+m[6]*y+m[10]*z+m[14];
  return o;
}
/* transform direction (no translation) */
function xd(o,m,x,y,z){
  o[0]=m[0]*x+m[4]*y+m[8]*z;
  o[1]=m[1]*x+m[5]*y+m[9]*z;
  o[2]=m[2]*x+m[6]*y+m[10]*z;
  return o;
}

JK.M = { make:make, ident:ident, copy:copy, mul:mul, tr:tr, sc:sc, rx:rx, ry:ry, rz:rz,
  persp:persp, lookAt:lookAt, xp:xp, xd:xd };

JK.V = {
  set:function(o,x,y,z){ o[0]=x; o[1]=y; o[2]=z; return o; },
  copy:function(o,a){ o[0]=a[0]; o[1]=a[1]; o[2]=a[2]; return o; },
  add:function(o,a,b){ o[0]=a[0]+b[0]; o[1]=a[1]+b[1]; o[2]=a[2]+b[2]; return o; },
  sub:function(o,a,b){ o[0]=a[0]-b[0]; o[1]=a[1]-b[1]; o[2]=a[2]-b[2]; return o; },
  scale:function(o,a,s){ o[0]=a[0]*s; o[1]=a[1]*s; o[2]=a[2]*s; return o; },
  dot:function(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; },
  cross:function(o,a,b){ var x=a[1]*b[2]-a[2]*b[1], y=a[2]*b[0]-a[0]*b[2], z=a[0]*b[1]-a[1]*b[0];
    o[0]=x; o[1]=y; o[2]=z; return o; },
  len:function(a){ return Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]); },
  norm:function(o,a){ var l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1;
    o[0]=a[0]/l; o[1]=a[1]/l; o[2]=a[2]/l; return o; },
  lerp:function(o,a,b,t){ o[0]=a[0]+(b[0]-a[0])*t; o[1]=a[1]+(b[1]-a[1])*t; o[2]=a[2]+(b[2]-a[2])*t; return o; },
  dist:function(a,b){ var x=a[0]-b[0],y=a[1]-b[1],z=a[2]-b[2]; return Math.sqrt(x*x+y*y+z*z); }
};
})();

/* ===== 05_gl.js ===== */
/* JK.GL + JK.Geo — WebGL1 renderer with one gouraud/fog shader. Owner: core. */
(function(){
'use strict';
var M = JK.M;
var gl = null, prog = null, canvas = null, dpr = 1;
var loc = {};
var proj = M.make(), view = M.make(), IDENT = M.make();
var sunDir = new Float32Array([0.45, 0.75, 0.35]);
var sunCol = new Float32Array([1.0, 0.93, 0.78]);
var amb    = new Float32Array([0.38, 0.34, 0.30]);
var fogCol = new Float32Array([0.86, 0.72, 0.52]);
var fogDen = 0.0035;
var curBlend = false;
/* ---------------------------------------------------------------------------
   WHY THIS RENDERER IS SHAPED LIKE THIS: on iOS Safari every WebGL entry point
   is marshalled across a process boundary, so the number of GL CALLS dominates
   frame time far more than triangle throughput. Three measured stages, counted
   by wrapping every entry point of the live context and dividing by frames — one
   hand-composed frame at a fixed 120-particle load, then the same build under
   the 12 s busy-combat benchmark (bots + bolts + force fx, so it runs higher):

                                                    120-part frame   busy combat
     per-mesh buffers, one draw per particle             1204            1553
     + static meshes packed into shared PAGES             639             586
     + the particle pool collapsed into ONE batch         279             489

   Draw calls over the same three stages: 201 -> 201 -> 79 at 120 particles.

   The page trick is the big one. Every mesh in the game uses the identical
   vertex layout, so instead of one vertex+normal+colour+index buffer per mesh
   (7 binding calls whenever the mesh changes) we suballocate meshes out of a
   few large interleaved buffers. Meshes sharing a page need NO binding calls at
   all — just drawElements at the right index offset. That removed ~7 calls from
   every one of the ~140 draws a busy frame issues.

   Consequences to respect if you touch this file:
   - Nothing outside this module touches GL state (verified by grep), so the
     redundant-state caches below are safe.
   - Uniform caches are per-program and survive across frames; only beginFrame's
     blend/depth reset and mesh()/dynamic() (which leave bindings dangling)
     invalidate anything.
   - Model matrices are caller-owned mutable scratch, so ONLY the identity model
     may be cached by reference.
   --------------------------------------------------------------------------- */
var curBind = null;      /* page (or dynamic handle) whose buffers are bound */
var uEm = -1, uAl = -1, uNf = -1, uTr = -1, uTg = -1, uTb = -1;
var uMIdent = false;     /* is uModel currently the identity? */
var lightDirty = true;   /* sun/fog uniforms need re-upload */

/* interleaved vertex layout shared by every mesh, page and dynamic batch:
   [px,py,pz, nx,ny,nz, r,g,b] — 9 floats, 36 bytes */
var VSTRIDE = 36, VFLOATS = 9;
var NOOPTS = {};         /* draw()'s default opts — never written, never leaked */

var VS =
'attribute vec3 aP; attribute vec3 aN; attribute vec3 aC;\n'+
'uniform mat4 uProj, uView, uModel;\n'+
'uniform vec3 uSunDir, uSunCol, uAmb, uTint;\n'+
'uniform float uEmissive;\n'+
'varying vec3 vCol; varying float vDist;\n'+
'void main(){\n'+
'  vec4 wp = uModel * vec4(aP, 1.0);\n'+
'  mat3 nm = mat3(uModel[0].xyz, uModel[1].xyz, uModel[2].xyz);\n'+
'  vec3 n = normalize(nm * aN);\n'+
'  float d = max(dot(n, uSunDir), 0.0);\n'+
'  vec3 base = aC * uTint;\n'+
'  vec3 lit = (uAmb + uSunCol * d) * base;\n'+
'  vCol = mix(lit, base, uEmissive);\n'+
'  vec4 vp = uView * wp;\n'+
'  vDist = length(vp.xyz);\n'+
'  gl_Position = uProj * vp;\n'+
'}';
var FS =
'precision mediump float;\n'+
'varying vec3 vCol; varying float vDist;\n'+
'uniform vec3 uFogCol; uniform float uFogDen; uniform float uAlpha; uniform float uNoFog;\n'+
'void main(){\n'+
'  float f = exp(-uFogDen * uFogDen * vDist * vDist * 1.442695);\n'+
'  f = clamp(max(f, uNoFog), 0.0, 1.0);\n'+
'  gl_FragColor = vec4(mix(uFogCol, vCol, f), uAlpha);\n'+
'}';

function sh(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}

var GL = JK.GL = {
  gl: null, eye: new Float32Array(3), aspect: 1, w: 0, h: 0,

  /* read-only diagnostics: page count should settle to a small constant after
     boot. If it keeps climbing, something is calling mesh() every frame.
     `clamped` counts batch draws that asked for more than the batch holds — it
     must stay 0; anything else means a pool cap and its batch have drifted. */
  stats: { meshes: 0, verts: 0, pages: 0, batches: 0, clamped: 0 },

  init: function(cv){
    canvas = cv;
    gl = cv.getContext('webgl', {antialias:false, alpha:false, depth:true,
      powerPreference:'high-performance'}) || cv.getContext('experimental-webgl');
    if (!gl) return false;
    GL.gl = gl;
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.bindAttribLocation(prog, 0, 'aP');
    gl.bindAttribLocation(prog, 1, 'aN');
    gl.bindAttribLocation(prog, 2, 'aC');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error('link: ' + gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    ['uProj','uView','uModel','uSunDir','uSunCol','uAmb','uTint','uEmissive',
     'uFogCol','uFogDen','uAlpha','uNoFog'].forEach(function(n){ loc[n] = gl.getUniformLocation(prog, n); });
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.disable(gl.CULL_FACE);
    gl.enableVertexAttribArray(0);
    gl.enableVertexAttribArray(1);
    gl.enableVertexAttribArray(2);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    return true;
  },

  fog: function(col, den){ fogCol.set(col); fogDen = den; lightDirty = true; },
  sun: function(dir, col, ambient){
    var l = Math.sqrt(dir[0]*dir[0]+dir[1]*dir[1]+dir[2]*dir[2]) || 1;
    sunDir[0]=dir[0]/l; sunDir[1]=dir[1]/l; sunDir[2]=dir[2]/l;
    sunCol.set(col); amb.set(ambient); lightDirty = true;
  },

  beginFrame: function(r, g, b){
    var w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
    GL.w = w; GL.h = h; GL.aspect = w / (h || 1);
    gl.viewport(0, 0, w, h);
    gl.clearColor(r, g, b, 1);
    /* Additive draws leave BLEND on and depthMask(false), and a masked depth
       buffer silently IGNORES gl.clear(DEPTH_BUFFER_BIT). Restoring the opaque
       state here makes the clear correct no matter who drew last, so effect
       modules no longer need a degenerate "reset" draw at the end of draw(). */
    if (curBlend){ gl.disable(gl.BLEND); gl.depthMask(true); curBlend = false; }
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    if (lightDirty){          /* uniforms persist; only re-send on change */
      gl.uniform3fv(loc.uSunDir, sunDir);
      gl.uniform3fv(loc.uSunCol, sunCol);
      gl.uniform3fv(loc.uAmb, amb);
      gl.uniform3fv(loc.uFogCol, fogCol);
      gl.uniform1f(loc.uFogDen, fogDen);
      lightDirty = false;
    }
  },

  setCamera: function(eye, target, fovDeg){
    GL.eye[0]=eye[0]; GL.eye[1]=eye[1]; GL.eye[2]=eye[2];
    M.persp(proj, (fovDeg||70) * Math.PI/180, GL.aspect, 0.1, 2000);
    M.lookAt(view, eye, target, [0,1,0]);
    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);
  },

  /* geo: {pos,nrm,col:Float32Array, idx:Uint16Array}
     Suballocated out of a shared page — see the header note. The returned handle
     is opaque; nothing outside this file may read its fields. */
  mesh: function(geo){
    var nv = geo.pos.length / 3, ni = geo.idx.length, i, j;
    if (nv > 65536) throw new Error('GL.mesh: ' + nv + ' verts > 65536');
    var pg = pageFor(nv, ni);
    var base = pg.nv;
    var v = new Float32Array(nv * VFLOATS);    /* init-time only, not per frame */
    var P = geo.pos, N = geo.nrm, C = geo.col;
    for (i = 0; i < nv; i++){
      var o = i * VFLOATS; j = i * 3;
      v[o]   = P[j]; v[o+1] = P[j+1]; v[o+2] = P[j+2];
      v[o+3] = N[j]; v[o+4] = N[j+1]; v[o+5] = N[j+2];
      v[o+6] = C[j]; v[o+7] = C[j+1]; v[o+8] = C[j+2];
    }
    var idx = new Uint16Array(ni);              /* rebased into the page */
    for (i = 0; i < ni; i++) idx[i] = geo.idx[i] + base;
    gl.bindBuffer(gl.ARRAY_BUFFER, pg.vb);
    gl.bufferSubData(gl.ARRAY_BUFFER, base * VSTRIDE, v);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, pg.ib);
    gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, pg.ni * 2, idx);
    var m = { page: pg, first: pg.ni, count: ni };
    pg.nv += nv; pg.ni += ni;
    GL.stats.meshes++; GL.stats.verts += nv; GL.stats.pages = pages.length;
    curBind = null;               /* uploading left bindings/pointers stale */
    return m;
  },

  /* DYNAMIC batch — see the note above dynamic()'s helpers below. */
  dynamic: function(maxVerts, opt){
    opt = opt || {};
    if (maxVerts > 65536) throw new Error('GL.dynamic: ' + maxVerts + ' verts > 65536');
    var h = {
      _dyn: true,
      max: maxVerts,
      v: new Float32Array(maxVerts * VFLOATS),  /* interleaved, stride 9 */
      idx: opt.idx || new Uint16Array(opt.maxIdx || maxVerts * 3),
      n: 0,                      /* vertices written this frame */
      ni: 0,                     /* indices to draw this frame  */
      staticIdx: !!opt.idx,
      vb: gl.createBuffer(), ib: gl.createBuffer()
    };
    /* Draw ceiling, precomputed so the per-frame clamp in drawDynamic is two
       compares: whole triangles only, so an over-full batch loses a primitive
       rather than half of one. */
    h.maxI = h.idx.length - (h.idx.length % 3);
    gl.bindBuffer(gl.ARRAY_BUFFER, h.vb);
    gl.bufferData(gl.ARRAY_BUFFER, h.v.byteLength, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, h.ib);
    if (h.staticIdx) gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, h.idx, gl.STATIC_DRAW);
    else gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, h.idx.byteLength, gl.DYNAMIC_DRAW);
    h.vv = mkViews(h.v, VBUCKET * VFLOATS);
    h.vi = mkViews(h.idx, IBUCKET);
    GL.stats.batches++;
    curBind = null;              /* buffer creation left bindings dangling */
    return h;
  },

  reset: function(h){ h.n = 0; h.ni = 0; },

  draw: function(mesh, model, opts){
    opts = opts || NOOPTS;        /* shared: `opts || {}` allocated every frame */
    if (mesh._dyn){ drawDynamic(mesh, model, opts); return; }
    applyState(model, opts);
    if (mesh.page !== curBind) bindUnit(mesh.page);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, mesh.first * 2);
  }
};

/* ---- shared static-geometry pages ------------------------------------------
 * One page holds many meshes in one interleaved vertex buffer + one index
 * buffer, so switching between meshes on the same page costs ZERO GL calls.
 * Indices are rebased at upload time (WebGL1 has no baseVertex), which is why a
 * page can never exceed the 16-bit index range. A geo too big for a fresh page
 * gets a page sized exactly to it (the 129x129 terrain grid: 16641 verts /
 * 98304 indices), and small meshes keep filling the general pages after it. */
var PAGE_V = 16384, PAGE_I = 32768;
var pages = [];

function newPage(capV, capI){
  var p = { vb: gl.createBuffer(), ib: gl.createBuffer(),
            capV: capV, capI: capI, nv: 0, ni: 0 };
  gl.bindBuffer(gl.ARRAY_BUFFER, p.vb);
  gl.bufferData(gl.ARRAY_BUFFER, capV * VSTRIDE, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, p.ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, capI * 2, gl.STATIC_DRAW);
  pages.push(p);
  return p;
}

function pageFor(nv, ni){
  for (var i = 0; i < pages.length; i++){
    var p = pages[i];
    if (p.nv + nv <= p.capV && p.ni + ni <= p.capI) return p;
  }
  if (nv > PAGE_V || ni > PAGE_I) return newPage(nv, ni);   /* exact-fit page */
  return newPage(PAGE_V, PAGE_I);
}

/* Bind a page or a dynamic handle. Both use the same interleaved layout, so the
 * three attrib pointers are identical — but WebGL1 has no VAOs, so a pointer
 * always re-captures whatever is bound and must be re-issued on a switch. */
function bindUnit(u){
  gl.bindBuffer(gl.ARRAY_BUFFER, u.vb);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, VSTRIDE, 0);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, VSTRIDE, 12);
  gl.vertexAttribPointer(2, 3, gl.FLOAT, false, VSTRIDE, 24);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, u.ib);
  curBind = u;
}

/* ---- per-draw uniform + blend state, shared by both draw paths -------------
 * Only the IDENTITY model matrix is cached: callers hand us mutable scratch
 * matrices (M.ident(MTX); M.tr(MTX,...) then draw), so a by-reference compare
 * on a real model matrix would be wrong. null/IDENT is safe and is what the
 * batched path normally passes (its vertices are already in world space) — but
 * a batch handed a model matrix honours it like any other mesh, so the two draw
 * paths cannot disagree about what argument 2 means. */
function applyState(model, opts){
  if (model && model !== IDENT){
    gl.uniformMatrix4fv(loc.uModel, false, model); uMIdent = false;
  } else if (!uMIdent){
    gl.uniformMatrix4fv(loc.uModel, false, IDENT); uMIdent = true;
  }
  var v = opts.emissive || 0;
  if (v !== uEm){ gl.uniform1f(loc.uEmissive, v); uEm = v; }
  v = opts.alpha !== undefined ? opts.alpha : 1;
  if (v !== uAl){ gl.uniform1f(loc.uAlpha, v); uAl = v; }
  v = opts.nofog ? 1 : 0;
  if (v !== uNf){ gl.uniform1f(loc.uNoFog, v); uNf = v; }
  var t = opts.tint;
  var tr = t ? t[0] : 1, tg = t ? t[1] : 1, tb = t ? t[2] : 1;
  if (tr !== uTr || tg !== uTg || tb !== uTb){
    gl.uniform3f(loc.uTint, tr, tg, tb); uTr = tr; uTg = tg; uTb = tb;
  }
  var add = !!opts.additive;
  if (add !== curBlend){
    curBlend = add;
    if (add){ gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.depthMask(false); }
    else { gl.disable(gl.BLEND); gl.depthMask(true); }
  }
}

/* ---- DYNAMIC batched geometry ----------------------------------------------
 * WHY: JK.Fx used to issue ONE gl.drawElements per live particle — 150+
 * back-to-back draws of the same unit cube in a spark burst. Every WebGL call
 * on iOS Safari is marshalled across a process boundary, so the call COUNT, not
 * the triangle count, was the frame-time spike. CPU-transforming a cube into a
 * shared vertex buffer is ~30 float ops; a driver call is far more expensive.
 *
 * USAGE (WebGL1, no extensions, no VAOs; coexists with the static mesh path):
 *   var h = JK.GL.dynamic(maxVerts, {idx: template});
 *   // once: write the normals into h.v[o+3..o+5] for every slot
 *   JK.GL.reset(h);
 *   ... for each primitive, write WORLD-space verts into h.v at stride 9
 *       (pos at o..o+2, colour at o+6..o+8), advancing h.n;
 *       set h.ni = number of indices to draw ...
 *   if (h.ni) JK.GL.draw(h, null, opts);      // ONE bufferSubData + ONE
 *                                             // drawElements, total
 * opt.idx     Uint16Array index template uploaded once as STATIC_DRAW. Use it
 *             when the batch is N copies of one primitive packed from slot 0
 *             (then ni = count * indicesPerPrimitive). Omit to rewrite h.idx
 *             every frame (opt.maxIdx sizes it).
 *
 * The counts are the ONLY thing that decides what is drawn, so a frame with
 * fewer primitives than the last can never show leftovers — set them every
 * frame (or JK.GL.reset(h)) and never leave last frame's ni behind. Asking for
 * more than the batch holds is clamped to whole triangles and counted in
 * stats.clamped; it is a bug in the producer, not a licence to overfill.
 *
 * Vertices are interleaved exactly like a static page, so constant attributes
 * (normals for emissive draws) are written once at build time and simply ride
 * along in the upload — that costs bandwidth, never a call.
 *
 * Per-draw uniforms (emissive/alpha/tint/nofog/blend) are shared by the whole
 * batch, so fold anything that varies per primitive into the VERTEX COLOUR.
 * For additive+nofog+emissive draws that is exact: the shader reduces to
 * dst += aC*uTint*uAlpha, so aC = colour*alpha with uTint=1, uAlpha=1 is
 * bit-identical to one draw per primitive. Deliberately goes through draw() so
 * a batch counts as exactly one draw call in the profiler — which is the truth.
 *
 * bufferSubData needs a typed-array view; making one per frame would allocate,
 * so views are precut at build time in VBUCKET-vertex steps and reused. */
var VBUCKET = 64, IBUCKET = 288;

function mkViews(arr, bucket){
  var v = [arr.subarray(0, 0)];         /* [0] unused: an empty batch never draws */
  for (var k = 1; ; k++){
    var e = k * bucket;
    if (e >= arr.length){ v.push(arr); break; }
    v.push(arr.subarray(0, e));
  }
  v.bucket = bucket;
  return v;
}
function pick(v, elems){
  var k = Math.ceil(elems / v.bucket);
  if (k < 1) k = 1;
  if (k >= v.length) k = v.length - 1;
  return v[k];
}

function drawDynamic(h, model, opts){
  var ni = h.ni, n = h.n;
  /* CLAMP, never overrun. A producer that writes more primitives than its batch
     was sized for has already had its surplus vertices silently swallowed by the
     Float32Array (typed-array stores past the end are dropped, not memory
     corruption) — but drawElements with a count past the index buffer is
     INVALID_OPERATION, which drops the WHOLE batch and spams the error log every
     frame. Clamping degrades to "you get the first maxI/3 triangles" instead,
     and stats.clamped makes the drift visible in the profiler. */
  if (ni > h.maxI){ ni = h.maxI; GL.stats.clamped++; }
  if (n > h.max) n = h.max;
  if (ni <= 0) return;                      /* empty batch: not a single GL call */
  applyState(model, opts);                  /* batches pass null: world space */
  if (h !== curBind) bindUnit(h);           /* leaves both of h's buffers bound */
  else gl.bindBuffer(gl.ARRAY_BUFFER, h.vb);          /* rebind for the upload */
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, pick(h.vv, n * VFLOATS));
  if (!h.staticIdx)                         /* ELEMENT buffer is already bound */
    gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, 0, pick(h.vi, ni));
  gl.drawElements(gl.TRIANGLES, ni, gl.UNSIGNED_SHORT, 0);
}

/* ---- CPU geometry builders ---- */
var Geo = JK.Geo = {
  box: function(sx, sy, sz, r, g, b){
    var x = sx/2, y = sy/2, z = sz/2;
    var P = [], N = [], C = [], I = [];
    var faces = [
      [[ 1,0,0],[[ x,-y,-z],[ x, y,-z],[ x, y, z],[ x,-y, z]]],
      [[-1,0,0],[[-x,-y, z],[-x, y, z],[-x, y,-z],[-x,-y,-z]]],
      [[0, 1,0],[[-x, y,-z],[-x, y, z],[ x, y, z],[ x, y,-z]]],
      [[0,-1,0],[[-x,-y, z],[-x,-y,-z],[ x,-y,-z],[ x,-y, z]]],
      [[0,0, 1],[[-x,-y, z],[ x,-y, z],[ x, y, z],[-x, y, z]]],
      [[0,0,-1],[[ x,-y,-z],[-x,-y,-z],[-x, y,-z],[ x, y,-z]]]
    ];
    for (var f = 0; f < 6; f++){
      var n = faces[f][0], vs = faces[f][1], base = P.length/3;
      for (var v = 0; v < 4; v++){
        P.push(vs[v][0], vs[v][1], vs[v][2]);
        N.push(n[0], n[1], n[2]);
        C.push(r, g, b);
      }
      I.push(base, base+1, base+2, base, base+2, base+3);
    }
    return { pos:new Float32Array(P), nrm:new Float32Array(N),
             col:new Float32Array(C), idx:new Uint16Array(I) };
  },

  tf: function(geo, m){
    var n = geo.pos.length/3;
    var pos = new Float32Array(geo.pos.length), nrm = new Float32Array(geo.nrm.length);
    var p = [0,0,0];
    for (var i = 0; i < n; i++){
      M.xp(p, m, geo.pos[i*3], geo.pos[i*3+1], geo.pos[i*3+2]);
      pos[i*3]=p[0]; pos[i*3+1]=p[1]; pos[i*3+2]=p[2];
      M.xd(p, m, geo.nrm[i*3], geo.nrm[i*3+1], geo.nrm[i*3+2]);
      var l = Math.sqrt(p[0]*p[0]+p[1]*p[1]+p[2]*p[2]) || 1;
      nrm[i*3]=p[0]/l; nrm[i*3+1]=p[1]/l; nrm[i*3+2]=p[2]/l;
    }
    return { pos:pos, nrm:nrm, col:new Float32Array(geo.col), idx:new Uint16Array(geo.idx) };
  },

  merge: function(list){
    var vTot = 0, iTot = 0, i, g;
    for (i = 0; i < list.length; i++){ vTot += list[i].pos.length/3; iTot += list[i].idx.length; }
    if (vTot > 65535) throw new Error('Geo.merge: ' + vTot + ' verts > 65535');
    var pos = new Float32Array(vTot*3), nrm = new Float32Array(vTot*3),
        col = new Float32Array(vTot*3), idx = new Uint16Array(iTot);
    var vo = 0, io = 0;
    for (i = 0; i < list.length; i++){
      g = list[i];
      pos.set(g.pos, vo*3); nrm.set(g.nrm, vo*3); col.set(g.col, vo*3);
      for (var j = 0; j < g.idx.length; j++) idx[io+j] = g.idx[j] + vo;
      vo += g.pos.length/3; io += g.idx.length;
    }
    return { pos:pos, nrm:nrm, col:col, idx:idx };
  }
};
})();

/* JK.Terrain — open desert: analytic dune heightfield, rocks, mesas, wreck, sun.
   Owner: terrain agent. */
(function(){
'use strict';
var M = JK.M, Geo = JK.Geo;

/* ---------- deterministic PRNG (mulberry32) ---------- */
var SEED = 0x0DE5E27; /* fixed seed: same dunes every load */
function mulberry32(a){
  a = a >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- smooth value noise on a hashed lattice ---------- */
var PERM = new Uint8Array(512);
var VALS = new Float32Array(256);
(function(){
  var r = mulberry32(SEED), i, j, t;
  for (i = 0; i < 256; i++){ PERM[i] = i; VALS[i] = r(); }
  for (i = 255; i > 0; i--){
    j = (r() * (i + 1)) | 0;
    t = PERM[i]; PERM[i] = PERM[j]; PERM[j] = t;
  }
  for (i = 0; i < 256; i++) PERM[i + 256] = PERM[i];
})();

/* value noise, returns 0..1, C1-continuous (smoothstep-interpolated) */
function vn(x, z){
  var ix = Math.floor(x), iz = Math.floor(z);
  var fx = x - ix, fz = z - iz;
  ix &= 255; iz &= 255;
  var ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  var p0 = PERM[ix], p1 = PERM[ix + 1];
  var a = VALS[PERM[p0 + iz]], b = VALS[PERM[p1 + iz]];
  var c = VALS[PERM[p0 + iz + 1]], d = VALS[PERM[p1 + iz + 1]];
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}

/* ---------- THE contract: analytic ground height ----------
   Long rolling dune ridges (two rotated sine trains, wavelengths ~90-150m,
   phase-warped so crests wander) + broad value noise + fine ripple.
   Relief ~= +/-5m, slopes gentle enough to sprint over. */
function height(x, z){
  var u = x * 0.831 + z * 0.556;        /* rotated dune-ridge axes */
  var v = z * 0.831 - x * 0.556;
  var h = 2.6 * Math.sin(u * 0.0430 + 1.6 * Math.sin(v * 0.0110 + 0.7));
  h += 1.35 * Math.sin(v * 0.0700 + 2.1 + 0.8 * Math.sin(u * 0.0170 + 3.0));
  h += 3.9  * (vn(x * 0.0082 + 91.3, z * 0.0082 + 47.8) - 0.5);
  h += 1.7  * (vn(x * 0.0270 + 13.1, z * 0.0270 + 71.7) - 0.5);
  h += 0.45 * (vn(x * 0.0900 + 55.5, z * 0.0900 + 23.9) - 0.5);
  return h;
}

/* ---------- module state ---------- */
var terrainMesh = null, sceneryMesh = null, sunMesh = null, haloMesh = null;

var HALO_OPTS = { emissive: 1, nofog: true, additive: true, alpha: 0.45 };

var SAND_HI = [0.824, 0.667, 0.427];

/* ---------- terrain grid: 128x128 quads over 760x760m ----------
   Mesh samples height() exactly => visuals == collision. */
function buildTerrainGeo(){
  var N = 128, V = N + 1, EXT = 760, half = EXT / 2, step = EXT / N;
  var pos = new Float32Array(V * V * 3);
  var nrm = new Float32Array(V * V * 3);
  var col = new Float32Array(V * V * 3);
  var idx = new Uint16Array(N * N * 6);
  var jr = mulberry32(SEED ^ 0x51AB);
  var e = 2.0;

  for (gz = 0; gz < V; gz++){
    z = -half + gz * step;
    for (gx = 0; gx < V; gx++){
      x = -half + gx * step;
      y = height(x, z);
      i3 = (gz * V + gx) * 3;
      pos[i3] = x; pos[i3 + 1] = y; pos[i3 + 2] = z;

      /* central-difference normal from the same height() */
      nx = height(x - e, z) - height(x + e, z);
      nz = height(x, z - e) - height(x, z + e);
      ny = 2 * e;
      il = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx *= il; ny *= il; nz *= il;
      nrm[i3] = nx; nrm[i3 + 1] = ny; nrm[i3 + 2] = nz;

      /* two-tone banding by height, pushed darker on slopes, quantized retro */
      t = (y + 5.5) / 11;
      if (t < 0) t = 0; else if (t > 1) t = 1;
      slopeK = (1 - ny) * 26;
      if (slopeK < 0) slopeK = 0; else if (slopeK > 1) slopeK = 1;
      t -= slopeK * 0.45;
      if (t < 0) t = 0;
      t = Math.round(t * 4) / 4;          /* 5 hard bands */
      j = (jr() - 0.5) * 0.05;            /* deterministic grain */
      col[i3]     = SAND_LO[0] + (SAND_HI[0] - SAND_LO[0]) * t + j;
      col[i3 + 1] = SAND_LO[1] + (SAND_HI[1] - SAND_LO[1]) * t + j;
      col[i3 + 2] = SAND_LO[2] + (SAND_HI[2] - SAND_LO[2]) * t + j * 0.8;
    }
  }

  io = 0;
  for (gz = 0; gz < N; gz++){
    for (gx = 0; gx < N; gx++){
      a = gz * V + gx; b = a + 1; c = a + V; d = c + 1;
      if ((gx + gz) & 1){  /* alternate the diagonal — chunkier dune shading */
        idx[io++] = a; idx[io++] = c; idx[io++] = b;
        idx[io++] = b; idx[io++] = c; idx[io++] = d;
      } else {
        idx[io++] = a; idx[io++] = c; idx[io++] = d;
        idx[io++] = a; idx[io++] = d; idx[io++] = b;
      }
    }
  }
  return { pos: pos, nrm: nrm, col: col, idx: idx };
}

    M.ident(PM); M.tr(PM, wx, wy, wz); M.ry(PM, yaw);
    M.rx(PM, 0.16 + rand() * 0.08); M.rz(PM, (rand() - 0.5) * 0.5);

    var hull = [];
    var scale = (i === 0) ? 1 : 0.7;
    hull.push(Geo.tf(Geo.box(8 * scale, 6.5 * scale, 34 * scale, 0.45, 0.47, 0.50), M.make()));
    M.ident(TM); M.tr(TM, 0, 3.2 * scale, -2 * scale);
    hull.push(Geo.tf(Geo.box(5 * scale, 2.4 * scale, 19 * scale, 0.38, 0.40, 0.43), TM));
    M.ident(TM); M.tr(TM, 0, 7 * scale, 12 * scale); M.rx(TM, -0.15);
    hull.push(Geo.tf(Geo.box(0.9 * scale, 10 * scale, 7 * scale, 0.40, 0.42, 0.46), TM)); /* fin */
    M.ident(TM); M.tr(TM, 0, 0, 17.5 * scale);
    hull.push(Geo.tf(Geo.box(6.6 * scale, 4.2 * scale, 4.5 * scale, 0.24, 0.25, 0.28), TM)); /* engines */
    if (i === 0){ /* torn-off nose chunk a bit ahead */
      M.ident(TM); M.tr(TM, 3, -1.2, -24); M.ry(TM, 0.7); M.rz(TM, 0.4);
      hull.push(Geo.tf(Geo.box(6, 4.5, 8, 0.42, 0.44, 0.47), TM));
    }
    for (k = 0; k < hull.length; k++) parts.push(Geo.tf(hull[k], PM));

    /* collision circles: 4 along the hull axis (spaced/sized to reach the
       4x17m half-extent corners), plus engine block, plus torn-off nose */
    for (k = 0; k < 4; k++){
      M.xp(P3, PM, 0, 0, (k * 9.5 - 14.25) * scale);
      OBST.push({ x: P3[0], z: P3[2], r: 6.25 * scale });
    }
    M.xp(P3, PM, 0, 0, 17.5 * scale);
    OBST.push({ x: P3[0], z: P3[2], r: 4.6 * scale });
    if (i === 0){
      M.xp(P3, PM, 3, -1.2, -24);
      OBST.push({ x: P3[0], z: P3[2], r: 5.4 });
    }
  }

  return Geo.merge(parts);
}

/* ---------- sky dome ----------
   Without this the top half of the screen is one flat clear-colour rectangle,
   which on a phone held in portrait is ~45% of the picture. A vertex-coloured
   dome parented to the eye costs ONE draw call and 170 verts, needs no shader
   change (emissive + nofog = the vertex colour straight through), and its
   bottom ring is painted exactly the fog colour so the horizon join is
   invisible. Radius sits between the 1400 m sun billboard and the far plane so
   it never occludes the sun. */
var SKY_STOPS = [
  [0.00, 0.86, 0.72, 0.52],   /* horizon = JK.GL.fog() colour: seamless join */
  [0.13, 0.86, 0.74, 0.57],
  [0.40, 0.77, 0.73, 0.67],
  [1.00, 0.53, 0.62, 0.79]    /* zenith: dusty desert blue */
];
function skyCol(t, o){
  if (t < 0) t = 0; else if (t > 1) t = 1;
  for (var i = 1; i < SKY_STOPS.length; i++){
    var b = SKY_STOPS[i];
    if (t <= b[0] || i === SKY_STOPS.length - 1){
      var a = SKY_STOPS[i - 1];
      var u = (t - a[0]) / ((b[0] - a[0]) || 1);
      if (u < 0) u = 0; else if (u > 1) u = 1;
      u = u * u * (3 - 2 * u);
      o[0] = a[1] + (b[1] - a[1]) * u;
      o[1] = a[2] + (b[2] - a[2]) * u;
      o[2] = a[3] + (b[3] - a[3]) * u;
      return o;
    }
  }
  return o;
}
function buildSkyGeo(){
  var SEG = 24, RING = 7, P = [], N = [], C = [], I = [], c = [0, 0, 0], i, j;
  for (j = 0; j <= RING; j++){
    var t = j / RING;
    /* start 12 deg BELOW the horizon so pitching the camera down never
       exposes a gap between the dome's rim and the dunes */
    var el = (-0.135 + 1.135 * t) * Math.PI * 0.5;
    var y = Math.sin(el) * SKY_R, rr = Math.cos(el) * SKY_R;
    skyCol(t, c);
    for (i = 0; i < SEG; i++){
      var a = i / SEG * Math.PI * 2;
      P.push(Math.cos(a) * rr, y, Math.sin(a) * rr);
      N.push(0, 1, 0);
      C.push(c[0], c[1], c[2]);
    }
  }
  for (j = 0; j < RING; j++){
    for (i = 0; i < SEG; i++){
      var n = (i + 1) % SEG, r0 = j * SEG, r1 = (j + 1) * SEG;
      I.push(r0 + i, r1 + i, r1 + n);
      I.push(r0 + i, r1 + n, r0 + n);
    }
  }
  return { pos: new Float32Array(P), nrm: new Float32Array(N),
           col: new Float32Array(C), idx: new Uint16Array(I) };
}

/* ---------- JK.Terrain ---------- */
JK.Terrain = {
  SIZE: 350,                 /* playable half-extent; player/bots clamp to this */
  height: height,            /* analytic, continuous, cheap */
  obstacles: OBST,           /* [{x,z,r}, ...] filled during init */

  init: function(){
    terrainMesh = JK.GL.mesh(buildTerrainGeo());
    sceneryMesh = JK.GL.mesh(buildSceneryGeo());
    skyMesh     = JK.GL.mesh(buildSkyGeo());

    /* sun billboard blob 1400m out along SUN_DIR (already unit length) */
    var sp = [SUN_DIR[0] * 1400, SUN_DIR[1] * 1400, SUN_DIR[2] * 1400];
    M.ident(TM); M.tr(TM, sp[0], sp[1], sp[2]); M.ry(TM, 0.5); M.rz(TM, 0.4);
    sunMesh = JK.GL.mesh(Geo.tf(Geo.box(58, 58, 58, 1.0, 0.97, 0.86), TM));
    M.ident(TM); M.tr(TM, sp[0], sp[1], sp[2]); M.ry(TM, 1.1); M.rx(TM, 0.6);
    haloMesh = JK.GL.mesh(Geo.tf(Geo.box(125, 125, 125, 1.0, 0.80, 0.52), TM));

    /* warm desert atmosphere: visibility ~400-600m, mesas hazy on the horizon */
    JK.GL.fog([0.86, 0.72, 0.52], 0.0016);
    JK.GL.sun(SUN_DIR, [1.0, 0.92, 0.74], [0.42, 0.36, 0.30]);
  },

  draw: function(){
    var e = JK.GL.eye;                       /* dome rides with the camera */
    M.ident(mSky); M.tr(mSky, e[0], e[1], e[2]);
    JK.GL.draw(skyMesh, mSky, SKY_OPTS);
    JK.GL.draw(terrainMesh, null);
    JK.GL.draw(sceneryMesh, null);
    JK.GL.draw(sunMesh, null, SUN_OPTS);
    JK.GL.draw(haloMesh, null, HALO_OPTS);
  }
};
})();

/* ===== 20_input.js ===== */
/* JK.Input — touch-first controls + desktop fallback. Owner: input agent.
 *
 * FINAL STATE SHAPE — JK.Input.state, snapshotted exactly once per update(dt).
 * Consumers read it after Input.update has run for the frame (main runs Input
 * before Player). Same object identity forever — safe to cache a reference.
 *
 *   {
 *     moveX, moveY   // -1..1 virtual stick. moveY = +1 means FORWARD (away
 *                    //   from camera). Keyboard diagonals are normalized.
 *     lookDX, lookDY // look-drag pixels accumulated since the LAST update,
 *                    //   then reset each snapshot. +DX = drag right, +DY = drag down.
 *     jump,          // edge: TRUE only on the first frame after a press
 *     attack,        //   (touch button touchstart / key down / mouse down;
 *     force,         //   never repeat-fires while held)
 *     stanceTap,     // edge: stance-cycle tap (Q / #btnStance)
 *     forceTap,      // edge: force-select tap (R / mousewheel)
 *     attackHeld,    // held: TRUE while #btnAtk is touched or LMB is down
 *     forceHeld,     // held: TRUE while #btnForce is touched or E is down
 *     runHeld,       // held: TRUE while sprinting (stick deflection > 0.92
 *                    //   of radius, or Shift on desktop)
 *     run,           // legacy alias, always === runHeld
 *     stance,        // running tap counter for stance cycling (consumers
 *     forceSel       //   take modulo; monotonically increasing ints)
 *   }
 *
 * Touch: #stickL (left 45%) = dynamic virtual stick (origin where the finger
 * lands, #stickUI shown there). Right half of the canvas = look drag. Buttons
 * #btnJump #btnAtk #btnForce #btnStance. Multi-touch tracked by identifier so
 * move + look + ATK all work at once. Desktop: WASD/arrows, Shift run,
 * Space jump, mouse-drag look, LMB attack, E force, Q stance, R/wheel force-select.
 */
(function(){
'use strict';

var RADIUS = 48;          /* stick radius, px */
var RUN_FRAC = 0.92;      /* deflection fraction beyond which we sprint */
var KNOB_SCALE = 28 / 48; /* knob visual travel so it stays inside the ring */
var WHEEL_MS = 200;       /* mousewheel forceTap throttle */

var state = {
  moveX: 0, moveY: 0,
  lookDX: 0, lookDY: 0,
  jump: false, attack: false, force: false, stanceTap: false, forceTap: false,
  attackHeld: false, runHeld: false, forceHeld: false,
  run: false,
  stance: 0, forceSel: 0
};

/* --- pending edges: set by events, copied into state then cleared each update --- */
var pJump = false, pAttack = false, pForce = false, pStance = false, pForceTap = false;
var accDX = 0, accDY = 0;           /* look pixels accumulated between updates */
var cStance = 0, cForceSel = 0;     /* running tap counters */

/* --- touch stick --- */
var stickId = null, stickOX = 0, stickOY = 0;
var stickMX = 0, stickMY = 0, stickRun = false;
/* --- touch look --- */
var lookId = null, lookLX = 0, lookLY = 0;
/* --- touch buttons (attack hold) --- */
var touchAtk = false;
var touchForce = false;   /* #btnForce held (channelled force powers) */
var btns = [];  /* {el, tid, mdown, down, up} */
/* --- mouse --- */
var mouseLook = false, mouseLX = 0, mouseLY = 0, mouseAtk = false;
var lastWheel = 0;
/* --- keyboard --- */
var kFwd = false, kBack = false, kLeft = false, kRight = false, kShift = false;
var kForce = false;       /* E held */
var keyHeld = {};   /* keyCode -> bool, our own repeat guard */

var elStick = null, elUI = null, elKnob = null, elCanvas = null, elStart = null;

function overlayUp(){
  return !!(elStart && !elStart.classList.contains('gone'));
}

/* Did this Touch actually land on el? Guards against same-event multi-touch:
 * when two fingers start in one touchstart, changedTouches can contain BOTH,
 * and claiming ts[0] blindly can steal another zone's finger (e.g. #btnAtk
 * grabbing the stick finger's identifier => stuck button + stuck attackHeld). */
function ownsTouch(el, t){
  var n = t.target;
  if (!n) return true;  /* ancient UA without Touch.target: trust dispatch */
  return n === el || !!(el.contains && el.contains(n));
}

/* ---------- touch: virtual stick ---------- */
function stickStart(e){
  if (overlayUp()) return;
  e.preventDefault();
  var ts = e.changedTouches;
  for (var i = 0; i < ts.length; i++){
    var t = ts[i];
    if (stickId === null && ownsTouch(elStick, t)){
      stickId = t.identifier;
      stickOX = t.clientX; stickOY = t.clientY;
      stickMX = 0; stickMY = 0; stickRun = false;
      if (elUI){
        elUI.style.transform = 'translate(' + (stickOX - 48) + 'px,' + (stickOY - 48) + 'px)';
        elUI.classList.add('on');
        elUI.classList.remove('run');
        if (elKnob) elKnob.style.transform = 'translate(0px,0px)';
      }
    }
  }
}

/* ---------- touch: look drag (right half of canvas, not on a button) ---------- */
function lookStart(e){
  if (overlayUp()) return;
  e.preventDefault();
  var ts = e.changedTouches;
  for (var i = 0; i < ts.length; i++){
    var t = ts[i];
    if (lookId === null && t.clientX >= window.innerWidth * 0.5 && ownsTouch(elCanvas, t)){
      lookId = t.identifier;
      lookLX = t.clientX; lookLY = t.clientY;
    }
  }
}

/* ---------- document-level move/end routing by touch identifier ---------- */
function touchMove(e){
  if (overlayUp()) return;
  if (e.cancelable) e.preventDefault();
  var ts = e.changedTouches;
  for (var i = 0; i < ts.length; i++){
    var t = ts[i];
    if (t.identifier === stickId){
      var dx = t.clientX - stickOX, dy = t.clientY - stickOY;
      var len = Math.sqrt(dx * dx + dy * dy);
      var cl = len > RADIUS ? RADIUS / len : 1;
      var cx = dx * cl, cy = dy * cl;
      stickMX = cx / RADIUS;
      stickMY = -cy / RADIUS;          /* drag up = forward = +1 */
      stickRun = len > RADIUS * RUN_FRAC;
      if (elKnob) elKnob.style.transform =
        'translate(' + (cx * KNOB_SCALE) + 'px,' + (cy * KNOB_SCALE) + 'px)';
      if (elUI){
        if (stickRun) elUI.classList.add('run');
        else elUI.classList.remove('run');
      }
    } else if (t.identifier === lookId){
      accDX += t.clientX - lookLX;
      accDY += t.clientY - lookLY;
      lookLX = t.clientX; lookLY = t.clientY;
    }
  }
}

function touchEnd(e){
  if (overlayUp()) return;
  if (e.cancelable) e.preventDefault();
  var ts = e.changedTouches;
  for (var i = 0; i < ts.length; i++){
    var id = ts[i].identifier;
    if (id === stickId){
      stickId = null;
      stickMX = 0; stickMY = 0; stickRun = false;
      if (elUI){ elUI.classList.remove('on'); elUI.classList.remove('run'); }
    } else if (id === lookId){
      lookId = null;
    } else {
      for (var b = 0; b < btns.length; b++){
        if (btns[b].tid === id){
          btns[b].tid = null;
          if (!btns[b].mdown) btns[b].el.classList.remove('held');
          if (btns[b].up) btns[b].up();
        }
      }
    }
  }
}

/* ---------- touch buttons ---------- */
function bindBtn(el, down, up){
  if (!el) return;
  var b = { el: el, tid: null, mdown: false, down: down, up: up };
  btns.push(b);
  el.addEventListener('touchstart', function(e){
    if (overlayUp()) return;
    e.preventDefault();               /* kills iOS synthetic click / text select */
    if (b.tid !== null) return;
    var ts = e.changedTouches;
    for (var i = 0; i < ts.length; i++){
      if (ownsTouch(el, ts[i])){ b.tid = ts[i].identifier; break; }
    }
    if (b.tid === null) return;       /* none of the new touches landed on us */
    el.classList.add('held');
    if (down) down();
  }, {passive:false});
  /* desktop nicety: buttons also clickable with the mouse (LMB only) */
  el.addEventListener('mousedown', function(e){
    if (overlayUp() || e.button !== 0) return;
    e.preventDefault();
    if (b.mdown) return;
    b.mdown = true;
    el.classList.add('held');
    if (down) down();
  });
}

/* ---------- desktop mouse (down-drag look on canvas) ---------- */
function mouseDown(e){
  if (overlayUp()) return;
  e.preventDefault();
  mouseLook = true;
  mouseLX = e.clientX; mouseLY = e.clientY;
  if (e.button === 0){ pAttack = true; mouseAtk = true; }
}
function mouseMove(e){
  if (!mouseLook) return;
  accDX += e.clientX - mouseLX;
  accDY += e.clientY - mouseLY;
  mouseLX = e.clientX; mouseLY = e.clientY;
}
function mouseUp(e){
  mouseLook = false;
  if (e.button !== 0) return;         /* buttons are LMB-only, matching mousedown */
  mouseAtk = false;
  for (var i = 0; i < btns.length; i++){
    if (btns[i].mdown){
      btns[i].mdown = false;
      if (btns[i].tid === null) btns[i].el.classList.remove('held');
      if (btns[i].up) btns[i].up();
    }
  }
}
function wheel(e){
  e.preventDefault();
  if (overlayUp()) return;
  var now = Date.now();
  if (now - lastWheel < WHEEL_MS) return;
  lastWheel = now;
  pForceTap = true; cForceSel++;
}

/* ---------- keyboard ---------- */
function keyDown(e){
  var k = e.keyCode;
  var eat = (k === 32 || (k >= 37 && k <= 40));
  if (keyHeld[k]){ if (eat) e.preventDefault(); return; }  /* repeat guard */
  keyHeld[k] = true;
  switch (k){
    case 87: case 38: kFwd = true; break;    /* W / Up */
    case 83: case 40: kBack = true; break;   /* S / Down */
    case 65: case 37: kLeft = true; break;   /* A / Left */
    case 68: case 39: kRight = true; break;  /* D / Right */
    case 16: kShift = true; break;           /* Shift = run */
    case 32: if (!overlayUp()) pJump = true; break;                    /* Space */
    case 69: if (!overlayUp()){ pForce = true; kForce = true; } break;   /* E */
    case 81: if (!overlayUp()){ pStance = true; cStance++; } break;    /* Q */
    case 82: if (!overlayUp()){ pForceTap = true; cForceSel++; } break;/* R */
  }
  if (eat) e.preventDefault();
}
function keyUp(e){
  var k = e.keyCode;
  keyHeld[k] = false;
  switch (k){
    case 87: case 38: kFwd = false; break;
    case 83: case 40: kBack = false; break;
    case 65: case 37: kLeft = false; break;
    case 68: case 39: kRight = false; break;
    case 16: kShift = false; break;
    case 69: kForce = false; break;          /* E */
  }
}

/* ---------- safety: drop everything held when we lose focus ---------- */
function releaseAll(){
  var k;
  for (k in keyHeld) keyHeld[k] = false;
  kFwd = kBack = kLeft = kRight = kShift = false;
  mouseLook = false; mouseAtk = false; touchAtk = false;
  touchForce = false; kForce = false;
  stickId = null; stickMX = 0; stickMY = 0; stickRun = false;
  lookId = null;
  /* rAF is paused while hidden — drop pending edges + look deltas so the
   * player doesn't get a phantom jump/attack/camera-jerk on refocus */
  pJump = pAttack = pForce = pStance = pForceTap = false;
  accDX = 0; accDY = 0;
  if (elUI){ elUI.classList.remove('on'); elUI.classList.remove('run'); }
  for (var i = 0; i < btns.length; i++){
    btns[i].tid = null; btns[i].mdown = false;
    btns[i].el.classList.remove('held');
  }
}

JK.Input = {
  state: state,

  init: function(){
    elCanvas = document.getElementById('gl');
    elStick  = document.getElementById('stickL');
    elUI     = document.getElementById('stickUI');
    elKnob   = elUI ? elUI.getElementsByTagName('b')[0] : null;
    elStart  = document.getElementById('start');

    if (elStick) elStick.addEventListener('touchstart', stickStart, {passive:false});
    if (elCanvas) elCanvas.addEventListener('touchstart', lookStart, {passive:false});
    document.addEventListener('touchmove', touchMove, {passive:false});
    document.addEventListener('touchend', touchEnd, {passive:false});
    document.addEventListener('touchcancel', touchEnd, {passive:false});

    bindBtn(document.getElementById('btnJump'),
      function(){ pJump = true; }, null);
    bindBtn(document.getElementById('btnAtk'),
      function(){ pAttack = true; touchAtk = true; },
      function(){ touchAtk = false; });
    bindBtn(document.getElementById('btnForce'),
      function(){ pForce = true; touchForce = true; },
      function(){ touchForce = false; });
    bindBtn(document.getElementById('btnStance'),
      function(){ pStance = true; cStance++; }, null);

    if (elCanvas) elCanvas.addEventListener('mousedown', mouseDown);
    window.addEventListener('mousemove', mouseMove);
    window.addEventListener('mouseup', mouseUp);
    window.addEventListener('wheel', wheel, {passive:false});

    window.addEventListener('keydown', keyDown);
    window.addEventListener('keyup', keyUp);
    window.addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', function(){
      if (document.hidden) releaseAll();
    });
  },

  update: function(dt, t){
    /* move: touch stick wins while active, else keyboard */
    var mx, my;
    if (stickId !== null){
      mx = stickMX; my = stickMY;
    } else {
      mx = (kRight ? 1 : 0) - (kLeft ? 1 : 0);
      my = (kFwd ? 1 : 0) - (kBack ? 1 : 0);
      if (mx !== 0 && my !== 0){ mx *= 0.7071; my *= 0.7071; }
    }
    state.moveX = mx;
    state.moveY = my;

    /* holds */
    state.runHeld = stickRun || kShift;
    state.run = state.runHeld;                 /* legacy alias */
    state.attackHeld = touchAtk || mouseAtk;
    state.forceHeld = touchForce || kForce;

    /* edges: pending -> state, then clear */
    state.jump = pJump;
    state.attack = pAttack;
    state.force = pForce;
    state.stanceTap = pStance;
    state.forceTap = pForceTap;
    pJump = pAttack = pForce = pStance = pForceTap = false;

    /* look: accumulated pixels since last snapshot, then reset */
    state.lookDX = accDX;
    state.lookDY = accDY;
    accDX = 0; accDY = 0;

    /* running tap counters */
    state.stance = cStance;
    state.forceSel = cForceSel;
  }
};
})();

/* ===== 30_player.js ===== */
/* JK.Player — third-person movement physics + orbit camera. Owner: player agent.
 *
 * EXPORTS (stable identities — other modules read these every frame):
 *   pos [x,y,z]      FEET position, meters (same array object forever)
 *   yaw              facing, radians, 0 = -Z (character model heading)
 *   vel [x,y,z]      velocity m/s (same array object forever)
 *   onGround         bool
 *   speed2D          horizontal speed m/s
 *   anim             'idle' | 'run' | 'sprint' | 'jump' | 'fall'
 *   camEye/camTarget vec3 arrays (reused, never reallocated)
 *   camYaw/camPitch  camera orbit angles, radians (for aiming modules)
 *   stanceIdx        0 LIGHT / 1 MEDIUM / 2 STRONG (cycled by stance tap)
 *   attackQueued     set true on attack edge; saber module consumes+clears.
 *
 * Feel: JK2-ish — fast accel, heroic 8.5 m/s jump under 22 m/s^2 gravity,
 * camera-relative stick, body turns toward travel at 12 rad/s.
 *
 * ===========================================================================
 * AUTO-FOLLOW CAMERA — the geometry, and why this scheme cannot spiral
 * ===========================================================================
 * Movement is camera-relative. With a basis yaw B and stick (mx,my) the world
 * direction we accelerate toward is
 *
 *     dir = fwd(B)*my + right(B)*mx,
 *     fwd(B) = (-sinB, 0, -cosB),  right(B) = fwd x up = (cosB, 0, -sinB)
 *
 * Write the stick as a polar angle s = atan2(mx, my) (0 = forward, +right) and
 * expand: -dirX = r*sin(B - s), -dirZ = r*cos(B - s). The world heading of the
 * stick, h = atan2(-dirX,-dirZ), therefore collapses to a single line:
 *
 *     h = B - s                                                        (1)
 *
 * THE SPIRAL TRAP. If the basis is the raw camera yaw (B = camYaw) and we ease
 * camYaw toward h, then by (1) h moves lock-step with camYaw: dh = dcamYaw. The
 * error h - camYaw is CONSTANT, the camera chases a heading that runs away from
 * it at exactly its own rate, and the player orbits forever. Hold the stick left
 * and you drive a circle. That is the default outcome, and it is why "ease camYaw
 * toward the travel direction" — the obvious implementation — is simply wrong.
 *
 * THE FIX. Split camYaw into the part the PLAYER asked for and the part the
 * camera took by itself. `autoAccum` is the running total of AUTOMATIC yaw
 * applied since the stick was pressed, and the movement basis is
 *
 *     B = camYaw - autoAccum                                           (2)
 *
 * Automatic rotation adds the same delta to camYaw and to autoAccum, so B — and
 * hence h — is EXACTLY invariant under it (not approximately: the two terms are
 * the same number). The player keeps running a straight world line while the
 * camera slides around behind them. Manual look adds to camYaw only, so dragging
 * still steers you 1:1, which is what a third-person player expects.
 *
 * WHY IT CONVERGES. Substituting (2) into (1), the alignment error is
 *
 *     e = h - camYaw = (camYaw - autoAccum - s) - camYaw = -autoAccum - s   (3)
 *
 * It does not contain camYaw at all. Easing e to zero just means driving
 * autoAccum -> -s: the camera rotates by exactly the stick angle and stops. It
 * is a first-order system with a fixed point, not a chase. Since every step is
 * clamped to the remaining error, overshoot is impossible, so it cannot ring.
 * When the stick returns to neutral autoAccum is cleared, so the next push is
 * always plain camera-relative — no offset survives a stick release.
 *
 * MANUAL DRAGS DRAIN THE ACCUMULATOR. A drag that opposes the automatic rotation
 * cancels it in the basis as well as in camYaw, so pulling the camera back to
 * where it started also restores the control frame it had there — the auto-follow
 * becomes exactly undoable. Only the part of a drag beyond the accumulated
 * automatic rotation steers the player. Drags that go the same way as the
 * automatic rotation steer 1:1 as usual.
 *
 * NO HARD EDGES: `autoBlend`. Every condition that switches the auto-follow on
 * (speed passing the threshold, the look grace expiring, a swing ending) is a
 * step function, and multiplying a 72 deg/s correction by a step function is a
 * LURCH — the camera sits dead still and then, one frame later, is sweeping at
 * full rate. Measured on the naive gate: 0 -> 71.6 deg/s in a single frame the
 * instant the grace period ran out. So the gate drives a 0..1 blend instead:
 * it fades in over ~0.3 s with a smoothstep (zero slope at both ends, so the
 * angular VELOCITY starts and stops smoothly, not just the angle), and falls
 * ~3x faster when the auto-follow is called off. A finger on the look control
 * is absolute and zeroes the blend outright, so the camera can never take even
 * one frame away from the player's thumb.
 */
(function(){
'use strict';

/* ---------------- tuning ---------------- */
var WALK_SPEED   = 5.0;    /* m/s */
var SPRINT_SPEED = 8.0;    /* m/s */
var ACCEL_GND    = 40;     /* m/s^2 toward desired vel on ground */
var ACCEL_AIR    = 12;     /* ~30% air control */
var DECEL_GND    = 30;     /* m/s^2 friction when no input on ground */
var TURN_RATE    = 12;     /* rad/s body yaw toward move dir */
var ATTACK_TURN_RATE = 26; /* rad/s — snap to the aim when swinging */
var GRAVITY      = 22;     /* m/s^2 */
var JUMP_VY      = 8.5;    /* m/s — heroic */
var BODY_R       = 0.55;   /* player capsule radius vs obstacle circles */
var SNAP_DOWN    = 0.6;    /* max ground drop we glue to before going airborne */
var STEEP_TAN    = 0.7;    /* uphill grade where slow-down starts (~35 deg) */
var LOOK_SENS    = 0.0045; /* rad per pixel */
var PITCH_MIN    = -1.1, PITCH_MAX = 0.5;
var CAM_DIST     = 4.2, CAM_DIST_SPRINT = 4.8;
var CAM_UP       = 1.55;   /* target height above feet */
var CAM_SMOOTH   = 10;     /* /s exp smoothing on eye */
var DIST_SMOOTH  = 4;      /* /s easing on orbit distance */
var CAM_CLEAR    = 0.35;   /* eye min height above terrain */
var EDGE_SPRING  = 10;     /* /s soft pushback at world border */
var PI = Math.PI, TWO_PI = PI * 2;

/* --- auto-follow tuning (see the header derivation) ---
 * The rate is ERROR-PROPORTIONAL (gentle when nearly aligned, firm when the
 * player is running hard away from the camera) and SPEED-SCALED (a sprint pulls
 * the camera behind roughly 2.4x faster than a trudge), then hard-capped so a
 * single frame can never snap. The cap is a RATE, so 20 fps and 60 fps travel
 * the same arc per second; AUTO_MAX_RATE * the 0.05 s dt clamp = 3.6 deg, which
 * stays under the probe's 4 deg/frame ceiling even on the worst allowed frame. */
var AUTO_MIN_SPD  = 1.5;   /* m/s — below this the camera never moves by itself */
var AUTO_DEAD     = 0.175; /* rad (10 deg) deadzone: no micro-jitter when aligned */
/* GAIN vs CAP — they buy different things, so tune them apart.
 * A recentre is two phases: a CAPPED sweep while the error is large (rate =
 * AUTO_MAX_RATE, this is the part the eye reads as "the camera is moving"),
 * then an EXPONENTIAL settle once AUTO_GAIN*err drops under the cap. Measured
 * on a 74 deg manual-drag recovery at gain 3.0: 0.4 s of sweep and 1.06 s of
 * settle — the tail was two thirds of the wait, and it is the phase where the
 * camera is barely moving, so it just reads as "not there yet". Raising the
 * gain shortens that tail (time constant 1/gain) and CANNOT make the camera
 * faster: the cap clamps every step regardless, so "never snaps" is untouched.
 * Nor can it overshoot at any dt — the step is a fraction of the error left. */
var AUTO_GAIN     = 4.5;   /* 1/s error-proportional gain at full sprint */
var AUTO_MAX_RATE = 1.25;  /* rad/s ceiling at full sprint (~72 deg/s) */
var AUTO_SLOW     = 0.42;  /* gain+cap scale at AUTO_MIN_SPD (1.0 at sprint) */
var AUTO_RISE     = 3.2;   /* 1/s — auto-follow fades IN over ~0.31 s, never steps on */
var AUTO_FALL     = 9.0;   /* 1/s — and out ~3x faster when it is called off */
var LOOK_GRACE    = 0.9;   /* s hands-off after the last manual look pixel */
var PITCH_NEUTRAL = -0.2;  /* rad — framing that shows the ground ahead */
var PITCH_GAIN    = 1.1;   /* 1/s easing toward PITCH_NEUTRAL */
var PITCH_RATE    = 0.45;  /* rad/s cap on the levelling */
var PITCH_DEAD    = 0.05;  /* rad — leave small manual pitches alone */

/* ---------------- exported arrays (allocated once) ---------------- */
var pos = [0, 0, 6];
var vel = [0, 0, 0];
var camEye = [0, 3, 11];
var camTarget = [0, 1.55, 6];

/* ---------------- internal state ---------------- */
var yaw = 0, camYaw = 0, camPitch = -0.26, camDist = CAM_DIST;
/* autoAccum: total AUTOMATIC camera yaw applied since the stick was pressed.
 * The movement basis is camYaw - autoAccum, so automatic rotation is invisible
 * to the stick and the player's world heading is preserved (see header). */
var autoAccum = 0;
/* autoBlend: 0..1 authority of the auto-follow this frame. Ramped, never gated,
 * so no condition change can hand the camera a step in angular velocity. */
var autoBlend = 0;
var lookIdle = 99;              /* s since the player last moved the camera */
var onGround = true, speed2D = 0, anim = 'idle';
var stanceIdx = 1;              /* template default: MEDIUM */
var lastStanceCt = 0;
var stanceEl = null;
var STANCE_NAMES = ['LIGHT STANCE', 'MEDIUM STANCE', 'STRONG STANCE'];
var EMPTY = [];
var NULL_STATE = { moveX: 0, moveY: 0, lookDX: 0, lookDY: 0,
  jump: false, attack: false, force: false, run: false, stance: 0 };
var DES_EYE = [0, 0, 0];        /* scratch: desired eye before smoothing */

/* ---------------- helpers ---------------- */
/* Fold any angle into [-PI, PI]. Must NOT be a single +/-2PI nudge: lookDX is
 * pixels accumulated since the previous update, so one long mouse flick across a
 * dropped frame is easily worth more than a full turn (2PI / LOOK_SENS = 1396 px)
 * and a one-shot nudge leaves camYaw permanently out of range for every module
 * that reads it (Audio pans off it, Powers casts along it). Round-based, so it is
 * exact in one step whatever the input, and allocation-free. */
function wrapPi(a){ return a - TWO_PI * Math.round(a / TWO_PI); }

function gh(x, z){                       /* defensive ground height */
  var T = JK.Terrain;
  return (T && T.height) ? T.height(x, z) : 0;
}

function softEdge(i, S, dt){             /* soft pushback on axis i (0 or 2) */
  var p = pos[i], over = 0;
  if (p > S) over = p - S; else if (p < -S) over = p + S;
  if (over !== 0){
    var k = EDGE_SPRING * dt; if (k > 1) k = 1;
    pos[i] = p - over * k;
    if (over * vel[i] > 0) vel[i] *= 1 - k;         /* bleed outward speed */
    if (pos[i] > S + 8) pos[i] = S + 8;             /* hard sanity cap */
    else if (pos[i] < -S - 8) pos[i] = -S - 8;

/* camera pose from camYaw/camPitch/camDist. snap=true skips smoothing. */
function placeCamera(dt, snap){
  camTarget[0] = pos[0];
  camTarget[1] = pos[1] + CAM_UP;
  camTarget[2] = pos[2];

  var fx = -Math.sin(camYaw) * cp, fy = sp, fz = -Math.cos(camYaw) * cp;

  DES_EYE[1] = camTarget[1] - fy * camDist;

  P.camYaw = camYaw; P.camPitch = camPitch; P.stanceIdx = stanceIdx;
}

/* ---------------- module ---------------- */
JK.Player = {
  pos: pos, yaw: 0, vel: vel, onGround: true, speed2D: 0, anim: 'idle',
  camEye: camEye, camTarget: camTarget,
  camYaw: 0, camPitch: -0.26,
  stanceIdx: 1,
  attackQueued: false,

  jumped: false,
  impulse: function(vx, vy, vz){

    if (vy > 0){ onGround = false; pos[1] += 0.02; }
  },

  init: function(){
    pos[0] = 0; pos[2] = 6;                      /* spawn facing origin (-Z) */
    pos[1] = gh(pos[0], pos[2]);                 /* ground at the ACTUAL spawn xz */
    vel[0] = 0; vel[1] = 0; vel[2] = 0;
    yaw = 0; camYaw = 0; camPitch = -0.26; camDist = CAM_DIST;
    autoAccum = 0; autoBlend = 0; lookIdle = 99;
    onGround = true; speed2D = 0; anim = 'idle';
    stanceIdx = 1; this.attackQueued = false;
    this.speedMul = 1; this.jumped = false;
    stanceEl = document.getElementById('stanceTag');
    if (stanceEl) stanceEl.textContent = STANCE_NAMES[stanceIdx];
    var st = JK.Input && JK.Input.state;
    lastStanceCt = st ? (st.stance | 0) : 0;
    placeCamera(0, true);
    mirror(this);
    JK.GL.setCamera(camEye, camTarget, 72);

  update: function(dt, t){

    var st = (JK.Input && JK.Input.state) || NULL_STATE;
    var i;

     * A manual drag owns the camera outright, and it first DRAINS the
     * auto-follow accumulator: dragging back against an automatic rotation
     * undoes it in the control basis too (so the drag lands you exactly where
     * you would have been had the camera never recentred), and only the part
     * of the drag beyond that accumulated rotation steers the player. */

     * the basis is plain camera-relative again, so a fresh push always runs
     * away from the camera and nothing carries over between holds. */
    if (!hasMove) autoAccum = 0;
    var baseYaw = camYaw - autoAccum;              /* == camYaw when converged-from-rest */
    var fwdX = -Math.sin(baseYaw), fwdZ = -Math.cos(baseYaw);
    /* right = fwd x up = (-fwdZ, 0, fwdX) */
    var dirX = fwdX * my - fwdZ * mx;
    var dirZ = fwdZ * my + fwdX * mx;

    var dvx = 0, dvz = 0;
    if (hasMove){
      var spd = (sprinting ? SPRINT_SPEED : WALK_SPEED) * mag * (P.speedMul || 1);
      if (onGround){
        /* uphill grade along move dir; >~50deg gets heavily slowed */
        var e = 0.4;
        var hx = (gh(pos[0] + e, pos[2]) - gh(pos[0] - e, pos[2])) / (2 * e);
        var hz = (gh(pos[0], pos[2] + e) - gh(pos[0], pos[2] - e)) / (2 * e);
        var uph = (dirX * hx + dirZ * hz) / mag;

    var aiming = swinging || P.attackQueued;

    pos[1] += vel[1] * dt;

    var S = (JK.Terrain && JK.Terrain.SIZE) || 350;
    softEdge(0, S, dt);
    softEdge(2, S, dt);

    /* ---- push out of obstacle circles ---- */
    var obs = (JK.Terrain && JK.Terrain.obstacles) || EMPTY;
    for (i = 0; i < obs.length; i++){
      var o = obs[i];
      var dx = pos[0] - o.x, dz = pos[2] - o.z;
      var rr = o.r + BODY_R;
      var d2 = dx * dx + dz * dz;
      if (d2 < rr * rr){
        var dl = Math.sqrt(d2);
        var nx, nz;
        if (dl < 1e-4){ nx = 1; nz = 0; } else { nx = dx / dl; nz = dz / dl; }

        pos[2] = o.z + nz * rr;
        var vn = vel[0] * nx + vel[2] * nz;

    var gy = gh(pos[0], pos[2]);

      if (gy >= pos[1] - SNAP_DOWN) pos[1] = gy;     /* glue to the dunes */
      else onGround = false;                          /* crest launched us */
    } else if (pos[1] <= gy){
      pos[1] = gy; vel[1] = 0; onGround = true;       /* land: snap */
    }

    /* ---- derived: speed + anim hint ---- */
    speed2D = Math.sqrt(vel[0] * vel[0] + vel[2] * vel[2]);
    if (!onGround) anim = vel[1] > 0.5 ? 'jump' : 'fall';
    else if (speed2D > 6.2) anim = 'sprint';
    else if (speed2D > 0.6) anim = 'run';
    else anim = 'idle';

    if (st.attack) P.attackQueued = true;             /* saber module clears */

    if (st.stanceTap !== undefined) stanceEdge = !!st.stanceTap;
    else stanceEdge = (st.stance | 0) !== lastStanceCt;
    lastStanceCt = st.stance | 0;
    if (stanceEdge){
      stanceIdx = (stanceIdx + 1) % 3;
      if (stanceEl) stanceEl.textContent = STANCE_NAMES[stanceIdx];
    }

    /* ---- AUTO-FOLLOW: ease the camera behind the way the player is GOING ----
     * Gated off unless the player is actually travelling, has hands off the
     * look control, and is not mid-swing (the body already turns to camYaw when
     * attacking — chasing it back would close a feedback loop).
     * The error is measured against the real velocity, not the stick, so a slide
     * along a rock or a shove still puts the camera where you end up going.
     * By (3) in the header this error does not depend on camYaw, so the loop has
     * a fixed point and every step is clamped to what is left of it: it eases in,
     * settles, and never overshoots or hunts.
     * Those four conditions are steps, so they drive a ramp rather than the
     * rotation itself — see autoBlend in the header. The rotation still needs
     * hasMove: autoAccum is only meaningful for the length of one stick hold, and
     * letting a fade-out tail rotate past the release would leave a stale offset
     * in the movement basis for the whole of the NEXT hold. */

    if (autoOn){ autoBlend += AUTO_RISE * dt; if (autoBlend > 1) autoBlend = 1; }
    else { autoBlend -= AUTO_FALL * dt; if (autoBlend < 0) autoBlend = 0; }

    if (autoBlend > 0 && hasMove && speed2D > AUTO_MIN_SPD){
      /* smoothstep: the blend leaves 0 and reaches 1 with zero slope, so the
       * camera's angular VELOCITY has no corner either, not just its angle */
      var bl = autoBlend * autoBlend * (3 - 2 * autoBlend);
      var sf = (speed2D - AUTO_MIN_SPD) / (SPRINT_SPEED - AUTO_MIN_SPD);
      if (sf < 0) sf = 0; else if (sf > 1) sf = 1;
      var sc = (AUTO_SLOW + (1 - AUTO_SLOW) * sf) * bl;   /* walk gentle, sprint firm */

      var travel = Math.atan2(-vel[0], -vel[2]);
      var er = travel - camYaw;
      er -= TWO_PI * Math.round(er / TWO_PI);
      var sgn = er < 0 ? -1 : 1;
      var mErr = (er < 0 ? -er : er) - AUTO_DEAD;  /* soft deadzone: fades to 0 */
      if (mErr > 0){
        /* exponential ease (dt-exact), then a hard rate cap so it can't snap */
        var stepY = mErr * (1 - Math.exp(-AUTO_GAIN * sc * dt));
        var capY = AUTO_MAX_RATE * sc * dt;
        if (stepY > capY) stepY = capY;
        stepY *= sgn;
        camYaw = wrapPi(camYaw + stepY);
        autoAccum = wrapPi(autoAccum + stepY);     /* <-- the anti-spiral line */
      }

      /* gently level the pitch to a neutral framing so you see the ground ahead.
       * Blended by the same ramp, so hands-off levelling starts from rest too. */
      var pe = PITCH_NEUTRAL - camPitch;
      if (pe > PITCH_DEAD || pe < -PITCH_DEAD){
        var stepP = pe * (1 - Math.exp(-PITCH_GAIN * bl * dt));
        var capP = PITCH_RATE * bl * dt;
        if (stepP > capP) stepP = capP; else if (stepP < -capP) stepP = -capP;
        camPitch += stepP;
      }
    }

    /* ---- camera: springy orbit, pulls back while sprinting ---- */
    var wantDist = speed2D > 6.2 ? CAM_DIST_SPRINT : CAM_DIST;
    camDist += (wantDist - camDist) * (1 - Math.exp(-DIST_SMOOTH * dt));
    placeCamera(dt, false);

    mirror(P);
    JK.GL.setCamera(camEye, camTarget, 72);           /* END of update */
  }
};
})();

/* ===== 40_character.js ===== */
/* JK.Rig — low-poly humanoid rig + procedural animation + lightsaber(s).
 * Owner: character agent.
 *
 * Shared geometry: ONE set of white part meshes built once (buildMeshes); every
 * instance draws them with per-instance palette tints — bots reuse everything.
 *
 * ===================== THE ARC ENGINE (swing rework) =====================
 * Attacks are authored as the BLADE'S ARC, never as joint angles. An arc is a
 * rotation of the blade about a pivot in the character's chest space; the arm is
 * solved to match with two-bone IK, and the torso follows the arc automatically.
 *
 *   rig.playArc(arcDef) -> bool     (accepted when idle or phase >= 0.6)
 *   arcDef = {
 *     dur      seconds
 *     pivot    [x,y,z]  arc centre, BODY-LOCAL (+X right, +Y up, -Z forward,
 *                       origin at the FEET). Chest-ish, e.g. [0.04,1.34,-0.05]
 *     radius   m        pivot -> blade MIDDLE (arm + half blade), ~0.9-1.15
 *     axis     [x,y,z]  normal of the swing plane (need not be unit)
 *     a0, a1   rad      start/end angle in that plane
 *     tilt     rad      roll of the blade about its own length (edge)
 *     windup   0..1     fraction of dur spent in anticipation
 *     recover  0..1     fraction spent settling back toward guard
 *     lunge    m        forward body shift during the strike (visual only)
 *     name     string
 *   }
 *   ANGLE CONVENTION: angle 0 points UP from the pivot — or FORWARD when `axis`
 *   is (near) vertical, since "up" degenerates there. Positive angles follow the
 *   right-hand rule about `axis`. So:
 *     horizontal right->left sweep : axis [0,1,0], a0 -0.95 .. a1 0.85
 *     overhead chop down the front : axis [-1,0,0], a0  0.0  .. a1 1.95
 *     diagonal high-right -> low-left: axis = cross(startDir, endDir)
 *   Easing: anticipation (eases slightly PAST a0 with the blade coiled IN) ->
 *   strike (angular speed peaks a third of the way through, then decelerates) ->
 *   follow-through settle + pull back toward guard. A further short blend into
 *   the procedural pose runs AFTER dur, so swingPhase() stays exactly 0..1.
 *
 * AUTHORING NOTE (measured against jedi/test/swing_probe.js, all 12 attacks):
 *   - The idle guard points the blade up-forward at ~38 deg (GUARD_DIR below).
 *     The tip has to travel from there into the cocked pose, and the probe's
 *     `pathOverSpan <= 1.9` counts that travel. Arcs whose a0 sits within ~1 rad
 *     of the guard pass with room to spare; a cock-back on the far side of the
 *     body costs ~1.5 m of tip path.
